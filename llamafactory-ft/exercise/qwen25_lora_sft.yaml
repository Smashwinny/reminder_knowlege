# LLaMA-Factory LoRA 微调配置：Qwen2.5-1.5B + 自定义身份数据集
# 训练命令：llamafactory-cli train exercise/qwen25_lora_sft.yaml
model_name_or_path: Qwen/Qwen2.5-1.5B-Instruct

stage: sft
do_train: true
finetuning_type: lora
lora_target: all

dataset: shiyi_identity
dataset_dir: exercise/data
template: qwen
cutoff_len: 1024
max_samples: 1000
overwrite_cache: true
preprocessing_num_workers: 4

output_dir: exercise/saves/qwen25-lora-sft
logging_steps: 5
save_steps: 100
plot_loss: true
overwrite_output_dir: true

per_device_train_batch_size: 4
gradient_accumulation_steps: 1
learning_rate: 1.0e-4
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_steps: 5
bf16: true

report_to: none
