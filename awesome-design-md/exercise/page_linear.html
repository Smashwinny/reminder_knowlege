<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>AI笔记工具 · 按 Linear DESIGN.md 实现</title>
<style>
  /* 以下每条值都取自 design-md/linear.app/DESIGN.md */
  :root{
    --primary:#5e6ad2; --primary-hover:#828fff;
    --ink:#f7f8f8; --ink-subtle:#8a8f98;
    --canvas:#010102; --surface-1:#0f1011; --hairline:#23252a;
    --success:#27a644;
  }
  *{margin:0;box-sizing:border-box}
  body{
    background:var(--canvas); color:var(--ink);
    font-family:"Inter","SF Pro Display","Segoe UI",sans-serif;
    padding:96px 24px; display:flex; flex-direction:column; align-items:center; gap:24px;
  }
  .eyebrow{font-size:14px;font-weight:500;color:var(--ink-subtle);letter-spacing:.2px}
  .eyebrow b{color:var(--success);font-weight:600}
  h1{ /* display-lg: 56px/600/1.10/-1.8px */
    font-size:56px;font-weight:600;line-height:1.1;letter-spacing:-1.8px;text-align:center;max-width:820px}
  h1 .accent{color:var(--primary)}
  .sub{ /* body-lg 18px/1.5 */
    font-size:18px;line-height:1.5;color:var(--ink-subtle);text-align:center;max-width:620px}
  .cta-row{display:flex;gap:12px;margin-top:8px}
  .btn{font-size:14px;font-weight:510;padding:8px 14px;border-radius:6px;cursor:pointer;text-decoration:none;display:inline-block}
  .btn-primary{background:var(--primary);color:#fff}
  .btn-secondary{background:var(--surface-1);color:var(--ink);border:1px solid var(--hairline)}
  .cards{display:flex;gap:16px;margin-top:48px;max-width:1000px}
  .card{ /* charcoal panel + hairline border */
    background:var(--surface-1);border:1px solid var(--hairline);border-radius:10px;padding:24px;flex:1}
  .card h3{font-size:22px;font-weight:500;letter-spacing:-.4px;margin-bottom:8px}
  .card p{font-size:15px;line-height:1.5;color:var(--ink-subtle)}
</style>
</head>
<body>
  <div class="eyebrow"><b>NEW</b> · 松果笔记 2.0 现已发布</div>
  <h1>让团队的知识<br>像 <span class="accent">Linear</span> 的 UI 一样克制、精准</h1>
  <p class="sub">同一份产品文案，严格套用 Linear 的 DESIGN.md：近黑画布、炭色面板、单薰衣草紫强调色、负字距大标题。</p>
  <div class="cta-row">
    <a class="btn btn-primary" href="#">开始使用</a>
    <a class="btn btn-secondary" href="#">查看文档</a>
  </div>
  <div class="cards">
    <div class="card"><h3>结构化规范</h3><p>YAML frontmatter 存 token，Markdown 存规则，AI 直接读懂整站气质。</p></div>
    <div class="card"><h3>单强调色纪律</h3><p>薰衣草紫只出现在品牌标、焦点环和关键 CTA，绝不做装饰。</p></div>
    <div class="card"><h3>实机证据</h3><p>本页面就是实验产物：规范在手，人和 AI 都能照着做。</p></div>
  </div>
</body>
</html>
