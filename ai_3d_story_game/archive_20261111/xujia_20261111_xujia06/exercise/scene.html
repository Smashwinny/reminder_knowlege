<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星间信使 · 原创叙事3D原型</title><style>body{margin:0;background:#eaf8ff;color:#13365c;font:18px/1.6 system-ui;text-align:center}main{max-width:720px;margin:auto;padding:20px}canvas{width:100%;height:auto;border-radius:20px}button{background:#ff9100;border:0;padding:12px 20px;border-radius:14px;margin:8px;font:inherit}pre{font:12px/1.5 monospace;text-align:left;white-space:pre-wrap;overflow-wrap:anywhere;background:#d5f4ff;padding:14px}p{text-align:left}</style><main><h1>星间信使</h1><p>原创几何星球，不含龙珠/小王子角色或素材。先收集，再旅行；不同星球保留背包事实。本实验不代表原作者游戏已运行。</p><div id="view"></div><button id="collect">收集记忆</button><button id="travel">前往山脊</button><p id="status"></p><pre id="result">正在进行WebGL自检</pre></main><script type="module">import * as T from './node_modules/three/build/three.module.js';try{const r=new T.WebGLRenderer({antialias:true});r.setSize(640,360);r.setPixelRatio(1);document.querySelector('#view').append(r.domElement);const camera=new T.PerspectiveCamera(45,640/360,.1,100);camera.position.set(0,1.8,5);camera.lookAt(0,0,0);let scene,geo,mat;let swaps=0;function build(n){if(geo){geo.dispose();mat.dispose();}scene=new T.Scene();scene.background=new T.Color('#073264');scene.add(new T.HemisphereLight(0xffffff,0x143040,3));geo=new T.IcosahedronGeometry(1,2);mat=new T.MeshStandardMaterial({color:[0x00cde4,0xff9800,0x2468ff][n%3],roughness:.7,flatShading:true});const planet=new T.Mesh(geo,mat);planet.rotation.set(.15,.3,.2);scene.add(planet);r.render(scene,camera);swaps++;}build(0);const counts=[];for(let i=0;i<12;i++){build(i);counts.push(r.info.memory.geometries);}const out={three_revision:T.REVISION,webgl:!!r.getContext(),scene_switches:swaps,geometry_counts:counts,all_one:counts.every(x=>x===1),draw_calls:r.info.render.calls,triangles:r.info.render.triangles};if(!out.all_one)throw Error('geometry count grew');build(0);document.querySelector('#result').textContent=JSON.stringify(out,null,2);document.body.dataset.test='pass';let bag=false;document.querySelector('#status').textContent='林地：请先收集记忆';document.querySelector('#collect').onclick=()=>{bag=true;document.querySelector('#status').textContent='已收集记忆，旅行已解锁';};document.querySelector('#travel').onclick=()=>{document.querySelector('#status').textContent=bag?'已抵达山脊':'条件未满足：缺少记忆';if(bag)build(1);};}catch(e){document.body.dataset.test='fail';document.querySelector('#result').textContent=String(e.stack||e);}</script></html>
