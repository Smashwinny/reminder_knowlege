<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>八技能交接实验：拾星</title><style>body{font:20px/1.6 sans-serif;background:#10213b;color:#eafaff;margin:28px}h1{color:#00def0}button{font-size:20px;min-height:48px;padding:8px 20px;margin:6px;background:#ff951f;border:0;border-radius:7px}canvas{background:#132e56;border:2px solid #00d9ee;width:min(640px,95vw);height:auto}pre{white-space:pre-wrap;font-size:15px}</style><h1>拾星：共享状态，不共享“猜测”</h1><p id="hud"></p><canvas id="board" width="640" height="220"></canvas><div><button id="coin">拾取星星</button><button id="hit">碰撞受伤</button><button id="reset">重新开始</button></div><p>目标：收集3颗星获胜；受伤3次失败。按钮分发意图，规则只在共享核心中。</p><pre id="result"></pre><script>// Original teaching harness, inspired by pinned skill guidance; no model/engine SDK.
const CONFIG=Object.freeze({version:1,maxHp:3,target:3,width:640,seed:42});
function setup(){return {version:1,hp:3,score:0,phase:'PLAY',x:20,seen:[]};}
function validate(s){if(s.version!==1||!Number.isInteger(s.hp)||s.hp<0||s.hp>3||!Number.isInteger(s.score)||s.score<0||!['PLAY','WIN','LOSE'].includes(s.phase))throw Error('contract');return true;}
function apply(s,a){validate(s);const n=structuredClone(s),events=[];if(s.phase!=='PLAY'||s.seen.includes(a.id))return {state:n,events};n.seen.push(a.id);if(a.type==='collect'){n.score++;events.push({type:'score_changed',value:n.score});if(n.score>=CONFIG.target)n.phase='WIN';}else if(a.type==='damage'){n.hp=Math.max(0,n.hp-1);events.push({type:'health_changed',value:n.hp});if(n.hp===0)n.phase='LOSE';}else if(a.type==='move'){n.x=Math.max(0,Math.min(CONFIG.width,n.x+a.dx));}else throw Error('intent');validate(n);return {state:n,events};}
function hud(s){return {hp:s.hp,score:s.score,phase:s.phase};}
class Screens{constructor(){this.stack=[{name:'game',focus:'pause'}];}push(name,focus){this.stack.push({name,focus});}pop(){if(this.stack.length>1)this.stack.pop();return this.top();}top(){return this.stack.at(-1);}}
function layout(w,h,inset=16){return {hp:{x:inset,y:inset,w:Math.min(200,w/2-inset*2),h:44},pause:{x:w-inset-44,y:inset,w:44,h:44},bounds:{w,h}};}
class Feedback{constructor(){this.trauma=0;this.until=0;}hit(now,duration=.08){this.trauma=Math.min(1,this.trauma+.4);this.until=Math.max(this.until,now+duration);}advance(now,dt,reduced=false){this.trauma=Math.max(0,this.trauma-1.2*dt);return {frozen:now<this.until,offset:reduced?0:12*this.trauma**2*Math.sin(now*23)};}}

let state=setup(),seq=0,draws=0;const readout=document.getElementById('hud'),cv=document.getElementById('board'),ctx=cv.getContext('2d');
function paint(){let v=hud(state);readout.textContent=`生命 ${v.hp}/3 ｜ 星星 ${v.score}/3 ｜ ${v.phase}`;ctx.clearRect(0,0,640,220);ctx.fillStyle='#00d8ed';ctx.fillRect(35,95,55,55);for(let i=0;i<3;i++){ctx.fillStyle=i<v.score?'#ff9a20':'#617da0';ctx.font='55px sans-serif';ctx.fillText('★',200+i*100,135);}draws++;}
function dispatch(type){let r=apply(state,{id:String(++seq),type});state=r.state;if(r.events.length)paint();}
document.getElementById('coin').onclick=()=>dispatch('collect');document.getElementById('hit').onclick=()=>dispatch('damage');document.getElementById('reset').onclick=()=>{state=setup();paint();};paint();
if(new URLSearchParams(location.search).has('test')){document.getElementById('coin').click();document.getElementById('coin').click();document.getElementById('coin').click();if(state.phase!=='WIN')throw Error('no win');document.getElementById('reset').click();document.getElementById('hit').click();if(state.hp!==2||!readout.textContent.includes('生命 2/3'))throw Error('HUD stale');document.getElementById('result').textContent=JSON.stringify({browser_checks:4,win_reached:true,restart_score:state.score,damage_hp:state.hp,hud_current:true,canvas_draws:draws});}
</script></html>
