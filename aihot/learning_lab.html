hwinny/BeefTV", "description": "Local-first, lightweight, AI-native video workspace.", "upstream": "glanderness/BeefTV", "track": "study-and-adaptation", "evidence": "Public fork; personal contribution not yet verified", "demoStatus": "not-verified", "license": "MIT"}];const cases=[{"label": "normal", "actual": "public, max-age=0, s-maxage=60", "pass": true}, {"label": "release in 5s", "actual": "public, max-age=0, s-maxage=5", "pass": true}, {"label": "upstream in 2s", "actual": "public, max-age=0, s-maxage=2", "pass": true}, {"label": "upstream no-store", "actual": "no-cache", "pass": true}, {"label": "already released", "actual": "no-cache", "pass": true}, {"label": "upstream zero", "actual": "no-cache", "pass": true}];const cards=document.querySelector('#cards');function render(filter='all'){const list=projects.filter(p=>filter==='all'||p.track===filter);cards.replaceChildren();for(const p of list){const article=document.createElement('article');const h=document.createElement('h3');h.textContent=p.name;const d=document.createElement('p');d.textContent=p.description||'请以源仓库内容为准';const s=document.createElement('small');s.textContent=p.track==='study-and-adaptation'?'上游：'+p.upstream+' / Demo 未验证':'非 Fork / 桌游改编实现 / Demo 未验证';const a=document.createElement('a');a.href=p.url;a.textContent='查看仓库';a.target='_blank';a.rel='noopener noreferrer';article.append(h,d,s,document.createElement('br'),a);cards.append(article)}document.querySelector('#count').textContent='当前展示 '+list.length+' 个；私有与草稿合成用例均未输出。'}document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render(b.dataset.filter)});const select=document.querySelector('#case');cases.forEach((c,i)=>{const o=document.createElement('option');o.value=i;o.textContent=c.label;select.append(o)});function show(){document.querySelector('#cache').textContent=cases[select.value].actual}select.onchange=show;show();render(
