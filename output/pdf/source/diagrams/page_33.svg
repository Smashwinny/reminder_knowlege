y="161" width="761.8897637795277" height="31.549999999999997" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><text x="51" y="177.051" fill="#16233D" font-size="9.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">Reminder / 拾遗</text><text x="193" y="177.051" fill="#16233D" font-size="9.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">低摩擦记录；手机网页同账号；任务和报告关联</text><text x="496" y="177.051" fill="#16233D" font-size="9.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">网站是正式源，旧本机服务不能重新成为第二源</text><rect x="40" y="192.55" width="761.8897637795277" height="31.549999999999997" rx="0" fill="#EDF2FA" stroke="#EDF2FA"/><text x="51" y="208.601" fill="#16233D" font-size="9.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">Dot</text><text x="193" y="208.601" fill="#16233D" font-size="9.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">云端电脑与长任务协调；机器关机仍可云端工作</text><text x="496" y="208.601" fill="#16233D" font-size="9.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">实际工具、权限、额度与环境会限制任务</text><rect x="40" y="224.10000000000002" width="761.8897637795277" height="31.549999999999997" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><text x="51" y="240.151" fill="#16233D" font-size="9.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">learn-project skill</text><text x="193" y="240.151" fill="#16233D" font-size="9.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">统一疑问、讲解、能力、实验、产物和知识沉淀</text><text x="496" y="240.151" fill="#16233D" font-size="9.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">方法本身不是执行引擎；必须真的运行</text><rect x="40" y="255.65000000000003" width="761.8897637795277" height="31.549999999999997" rx="0" fill="#EDF2FA" stroke="#EDF2FA"/><text x="51" y="271.701" fill="#16233D" font-size="9.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">MCP + OAuth</text><text x="193" y="271.701" fill="#16233D" font-size="9.7" font-family=