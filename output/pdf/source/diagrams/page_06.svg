<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 841.8897637795277 595.2755905511812" role="img"><rect x="0" y="0" width="841.8897637795277" height="595.2755905511812" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><rect x="0" y="0" width="10" height="595.2755905511812" rx="0" fill="#009F8B" stroke="#009F8B"/><text x="40" y="30.055" fill="#52647C" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">REMINDER / PERSONAL LEARNING SYSTEM</text><rect x="619.8897637795277" y="17" width="182" height="23" rx="6" fill="#E6F8F3" stroke="#E6F8F3"/><text x="629.8897637795277" y="30.304000000000002" fill="#009F8B" font-size="8.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">手机记录入口</text><text x="40" y="71.92" fill="#16233D" font-size="24" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">从 X 或抖音开始：先把链接留住</text><text x="40" y="95.549" fill="#52647C" font-size="10.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">本项目已核对的手机入口是复制后粘贴；当前 Android Manifest 没有原生 ACTION_SEND 分享接收器。</text><rect x="40" y="562.2755905511812" width="761.8897637795277" height="1" rx="0" fill="#DCE5F0" stroke="#DCE5F0"/><text x="40" y="576.6665905511811" fill="#52647C" font-size="7.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">核验基线 2026-10-05 14:07 CST | 实线=已有路径；虚线=待打通 / 建议配置</text><text x="755.8897637795277" y="577.3305905511811" fill="#16233D" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">06 / 36</text><text x="40" y="552.5005905511812" fill="#52647C" font-size="7.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">依据：AndroidManifest.xml；网站 onlyUrl / fetchPage 代码</text><rect x="40" y="139" width="246" height="166" rx="10" fill="#E6F8F3" stroke="#009F8B"/><rect x="40" y="139" width="5" height="166" rx="2" fill="#009F8B" stroke="#009F8B"/><text x="56" y="164.62" fill="#009F8B" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">01 · 复制原始链接</text><text x="56" y="185.13" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">在 X 或抖音选择复制链接。保存作者、主题</text><text x="56" y="202.18" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">和你想学什么，避免以后只剩一条无法辨认</text><text x="56" y="219.23" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">的短链。</text><rect x="298" y="139" width="246" height="166" rx="10" fill="#E6F8F3" stroke="#009F8B"/><rect x="298" y="139" width="5" height="166" rx="2" fill="#009F8B" stroke="#009F8B"/><text x="314" y="164.62" fill="#009F8B" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">02 · 在拾遗保存</text><text x="314" y="185.13" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">手机 App 或网站登录本人账号，粘贴并保</text><text x="314" y="202.18" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">存。若想触发站点自动摘要，任务正文需是</text><text x="314" y="219.23" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">单个纯 HTTP(S) 链接。</text><rect x="556" y="139" width="246" height="166" rx="10" fill="#E6F8F3" stroke="#009F8B"/><rect x="556" y="139" width="5" height="166" rx="2" fill="#009F8B" stroke="#009F8B"/><text x="572" y="164.62" fill="#009F8B" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">03 · 进入允许列表</text><text x="572" y="185.13" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">在网站 /dot 管理页把任务加入本人获准清</text><text x="572" y="202.18" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">单。是否自动加入今后新增未开始记录，需</text><text x="572" y="219.23" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">要单独配置并回读。</text><polyline points="286,220 298,220" fill="none" stroke="#009F8B" stroke-width="1.65"/><polygon points="298,220 290.0,216.0 290.0,224.0" fill="#009F8B"/><polyline points="544,220 556,220" fill="none" stroke="#009F8B" stroke-width="1.65"/><polygon points="556,220 548.0,216.0 548.0,224.0" fill="#009F8B"/><rect x="40" y="338" width="367" height="103" rx="10" fill="#FFF0E4" stroke="#F07822"/><rect x="40" y="338" width="5" height="103" rx="2" fill="#F07822" stroke="#F07822"/><text x="56" y="363.62" fill="#F07822" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">X：可读取文字 ≠ 已核实全部内容</text><text x="56" y="383.632" fill="#16233D" font-size="10.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">站点摘要有第三方 X 文本接口作为候选读取途径；Dot 仍需核对作者、帖</text><text x="56" y="399.752" fill="#16233D" font-size="10.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">子中的真实出链及官方仓库。</text><rect x="428" y="338" width="374" height="103" rx="10" fill="#FFF4D8" stroke="#A66700"/><rect x="428" y="338" width="5" height="103" rx="2" fill="#A66700" stroke="#A66700"/><text x="444" y="363.62" fill="#A66700" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">抖音：短链 ≠ 自动转录视频</text><text x="444" y="383.632" fill="#16233D" font-size="10.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">当前站点读公开网页文字，没有已验收的视频下载 / ASR 流程。受阻时补</text><text x="444" y="399.752" fill="#16233D" font-size="10.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">字幕、笔记或明确的项目链接，保留待核实。</text><rect x="40" y="463" width="761.8897637795277" height="64" rx="8" fill="#FFF4D8" stroke="#FFF4D8"/><text x="54" y="482.632" fill="#A66700" font-size="10.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">第一次试用的成功标准</text><text x="54" y="499.885" fill="#16233D" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">在手机保存一条你确实有权分享、来源可读的学习链接；在电脑网站同一账号能回读同一条记录。不要用“摘要已显示”作为视频内容完整读取的证明。</text></svg>