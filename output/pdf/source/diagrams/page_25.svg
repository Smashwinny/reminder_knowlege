<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 841.8897637795277 595.2755905511812" role="img"><rect x="0" y="0" width="841.8897637795277" height="595.2755905511812" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><rect x="0" y="0" width="10" height="595.2755905511812" rx="0" fill="#2875EA" stroke="#2875EA"/><text x="40" y="30.055" fill="#52647C" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">REMINDER / PERSONAL LEARNING SYSTEM</text><rect x="619.8897637795277" y="17" width="182" height="23" rx="6" fill="#EAF2FF" stroke="#EAF2FF"/><text x="629.8897637795277" y="30.304000000000002" fill="#2875EA" font-size="8.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">搭建 07 / Windows 本地</text><text x="40" y="71.92" fill="#16233D" font-size="24" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">先准备知识仓库与配套工具</text><text x="40" y="95.549" fill="#52647C" font-size="10.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">以下假设新机器 F:\reminder 不存在。已有目录只检查状态，不覆盖、重置或重新 clone 到里面。</text><rect x="40" y="562.2755905511812" width="761.8897637795277" height="1" rx="0" fill="#DCE5F0" stroke="#DCE5F0"/><text x="40" y="576.6665905511811" fill="#52647C" font-size="7.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">核验基线 2026-10-05 14:07 CST | 实线=已有路径；虚线=待打通 / 建议配置</text><text x="755.8897637795277" y="577.3305905511811" fill="#16233D" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">25 / 36</text><text x="40" y="552.5005905511812" fill="#52647C" font-size="7.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">依据：WinGet 官方 [S7]；公共仓库文件清单；配套包</text><rect x="40" y="132" width="470" height="176.12" rx="8" fill="#16233D" stroke="#16233D"/><text x="54" y="149.055" fill="#7ED7DF" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">Windows / PowerShell 7 · 软件许可提示由本人处理</text><text x="54" y="168.055" fill="#FFFFFF" font-size="8.5" font-family="Consolas,monospace" font-weight="400">winget install --id Git.Git -e</text><text x="54" y="180.975" fill="#FFFFFF" font-size="8.5" font-family="Consolas,monospace" font-weight="400">winget search --id Microsoft.PowerShell -e</text><text x="54" y="193.895" fill="#FFFFFF" font-size="8.5" font-family="Consolas,monospace" font-weight="400">winget search --id Python.Python.3.12 -e</text><text x="54" y="206.815" fill="#FFFFFF" font-size="8.5" font-family="Consolas,monospace" font-weight="400">winget install --id Microsoft.PowerShell -e</text><text x="54" y="219.735" fill="#FFFFFF" font-size="8.5" font-family="Consolas,monospace" font-weight="400">winget install --id Python.Python.3.12 -e</text><text x="54" y="232.655" fill="#FFFFFF" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400"># 关闭并重开 PowerShell 7，检查实际解释器</text><text x="54" y="245.575" fill="#FFFFFF" font-size="8.5" font-family="Consolas,monospace" font-weight="400">git --version</text><text x="54" y="258.495" fill="#FFFFFF" font-size="8.5" font-family="Consolas,monospace" font-weight="400">pwsh --version</text><text x="54" y="271.415" fill="#FFFFFF" font-size="8.5" font-family="Consolas,monospace" font-weight="400">python --version</text><text x="54" y="284.335" fill="#FFFFFF" font-size="8.5" font-family="Consolas,monospace" font-weight="400">git clone https://github.com/Smashwinny/reminder_knowlege.git F:\reminder</text><text x="54" y="297.255" fill="#FFFFFF" font-size="8.5" font-family="Consolas,monospace" font-weight="400">Set-Location F:\reminder</text><rect x="533" y="133" width="269" height="157" rx="10" fill="#EAF2FF" stroke="#2875EA"/><rect x="533" y="133" width="5" height="157" rx="2" fill="#2875EA" stroke="#2875EA"/><text x="549" y="158.62" fill="#2875EA" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">为什么还有配套包</text><text x="549" y="179.13" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">当前公开 main 只有历史 tools。本次附最新无凭</text><text x="549" y="196.18" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">据工具的白名单快照；不能只 clone 后就假定已</text><text x="549" y="213.23" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">有 pipeline / Dot 回迁命令。</text><rect x="533" y="311" width="269" height="148" rx="10" fill="#EAF2FF" stroke="#2875EA"/><rect x="533" y="311" width="5" height="148" rx="2" fill="#2875EA" stroke="#2875EA"/><text x="549" y="336.62" fill="#2875EA" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">安装工具的顺序</text><text x="549" y="356.715" fill="#16233D" font-size="10.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">先解压随附包到临时目录。</text><text x="549" y="372.98999999999995" fill="#16233D" font-size="10.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">阅读本机工具补齐/README.md。</text><text x="549" y="389.265" fill="#16233D" font-size="10.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">只在新干净 clone 中复制明确文件。</text><text x="549" y="405.53999999999996" fill="#16233D" font-size="10.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">已有工作区逐文件比较，由协调者合并。</text><rect x="40" y="464" width="761.8897637795277" height="64" rx="8" fill="#FFF4D8" stroke="#FFF4D8"/><text x="54" y="483.632" fill="#A66700" font-size="10.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">预期结果</text><text x="54" y="500.885" fill="#16233D" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">Git、Python、pwsh 均可查询版本；tools/reminder_dot_backup.py 与 reminder_pipeline.py 存在。这里只准备备份环境，不启动旧本机周期学习。</text></svg>