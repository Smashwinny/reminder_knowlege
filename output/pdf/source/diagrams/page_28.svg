<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 841.8897637795277 595.2755905511812" role="img"><rect x="0" y="0" width="841.8897637795277" height="595.2755905511812" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><rect x="0" y="0" width="10" height="595.2755905511812" rx="0" fill="#2875EA" stroke="#2875EA"/><text x="40" y="30.055" fill="#52647C" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">REMINDER / PERSONAL LEARNING SYSTEM</text><rect x="619.8897637795277" y="17" width="182" height="23" rx="6" fill="#EAF2FF" stroke="#EAF2FF"/><text x="629.8897637795277" y="30.304000000000002" fill="#2875EA" font-size="8.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">搭建 10 / 本机协调者</text><text x="40" y="71.92" fill="#16233D" font-size="24" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">把备份变成合格的知识交付</text><text x="40" y="95.549" fill="#52647C" font-size="10.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">以下是操作骨架；manifest、审核意见和确认回执必须来自实际产物，不能填占位值骗过验收。</text><rect x="40" y="562.2755905511812" width="761.8897637795277" height="1" rx="0" fill="#DCE5F0" stroke="#DCE5F0"/><text x="40" y="576.6665905511811" fill="#52647C" font-size="7.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">核验基线 2026-10-05 14:07 CST | 实线=已有路径；虚线=待打通 / 建议配置</text><text x="755.8897637795277" y="577.3305905511811" fill="#16233D" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">28 / 36</text><rect x="40" y="131" width="762" height="248.01600000000002" rx="8" fill="#16233D" stroke="#16233D"/><text x="54" y="148.055" fill="#7ED7DF" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">协调者操作骨架 / PowerShell 7 · Bash 换行使用反斜杠</text><text x="54" y="167.304" fill="#FFFFFF" font-size="8.8" font-family="Consolas,monospace" font-weight="400">python tools/reminder_coordinator.py status</text><text x="54" y="180.68" fill="#FFFFFF" font-size="8.8" font-family="Consolas,monospace" font-weight="400">python tools/reminder_coordinator.py acquire --owner coordinator_example</text><text x="54" y="194.056" fill="#FFFFFF" font-size="8.8" font-family="Consolas,monospace" font-weight="400">python tools/reminder_pipeline.py sync</text><text x="54" y="207.432" fill="#FFFFFF" font-size="8.8" font-family="Consolas,monospace" font-weight="400">python tools/reminder_pipeline.py status --task TASK</text><text x="54" y="220.80800000000002" fill="#FFFFFF" font-size="8.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400"># 仅已 classify 为 learning；已有 start 票据跳过 claim/start</text><text x="54" y="234.184" fill="#FFFFFF" font-size="8.8" font-family="Consolas,monospace" font-weight="400">python tools/reminder_pipeline.py claim --task TASK --owner ORIGINAL_OWNER</text><text x="54" y="247.56" fill="#FFFFFF" font-size="8.8" font-family="Consolas,monospace" font-weight="400">python tools/reminder_pipeline.py start --task TASK --owner ORIGINAL_OWNER --project PROJECT</text><text x="54" y="260.936" fill="#FFFFFF" font-size="8.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400"># 整理真实文件、合并 vault、由另一位审核者审阅</text><text x="54" y="274.312" fill="#FFFFFF" font-size="8.8" font-family="Consolas,monospace" font-weight="400">python tools/reminder_pipeline.py ready --task TASK --owner ORIGINAL_OWNER `</text><text x="54" y="287.688" fill="#FFFFFF" font-size="8.8" font-family="Consolas,monospace" font-weight="400">  --manifest PROJECT/manifest.json</text><text x="54" y="301.06399999999996" fill="#FFFFFF" font-size="8.8" font-family="Consolas,monospace" font-weight="400">python tools/reminder_pipeline.py review --task TASK --owner ORIGINAL_OWNER `</text><text x="54" y="314.44" fill="#FFFFFF" font-size="8.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">  --reviewer REVIEWER --notes &quot;实际审核意见&quot;</text><text x="54" y="327.816" fill="#FFFFFF" font-size="8.8" font-family="Consolas,monospace" font-weight="400">python tools/reminder_pipeline.py confirm-analysis --task TASK --owner ORIGINAL_OWNER `</text><text x="54" y="341.192" fill="#FFFFFF" font-size="8.8" font-family="Consolas,monospace" font-weight="400">  --coordinator coordinator_example --receipt PRIVATE_RECEIPT.json</text><text x="54" y="354.568" fill="#FFFFFF" font-size="8.8" font-family="Consolas,monospace" font-weight="400">python tools/reminder_pipeline.py render</text><text x="54" y="367.94399999999996" fill="#FFFFFF" font-size="8.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400"># 保持协调者租约：下一页 Git 收尾后再 release</text><text x="40" y="436.802" fill="#16233D" font-size="9.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">manifest：topic、project_dir、pdf、html、exercise_dir、experiment_log、vault_note、source_urls；使用真实仓库相对路径。</text><text x="40" y="466.802" fill="#16233D" font-size="9.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">receipt：schema、accountId、listId、taskId、reportId、sourceHash、backupBundle、backupSha256、handoff；只留私有 .pipeline。</text><text x="40" y="498.3" fill="#2875EA" font-size="10" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">已有 start 票据不再次 claim / start；原 owner 续约。确认只读网站来源并释放资源。真实独立审核必须先完成，任务勾选仍留给本人。</text></svg>