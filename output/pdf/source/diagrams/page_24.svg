<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 841.8897637795277 595.2755905511812" role="img"><rect x="0" y="0" width="841.8897637795277" height="595.2755905511812" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><rect x="0" y="0" width="10" height="595.2755905511812" rx="0" fill="#764FE3" stroke="#764FE3"/><text x="40" y="30.055" fill="#52647C" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">REMINDER / PERSONAL LEARNING SYSTEM</text><rect x="619.8897637795277" y="17" width="182" height="23" rx="6" fill="#F0EAFF" stroke="#F0EAFF"/><text x="629.8897637795277" y="30.304000000000002" fill="#764FE3" font-size="8.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">搭建 06 / Dot 云端</text><text x="40" y="71.92" fill="#16233D" font-size="24" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">让 Dot 先证明会学习，再保存日程</text><text x="40" y="95.549" fill="#52647C" font-size="10.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">先做一条真实、来源可读的小项目；连接成功与完整学习成功分别验收。</text><rect x="40" y="562.2755905511812" width="761.8897637795277" height="1" rx="0" fill="#DCE5F0" stroke="#DCE5F0"/><text x="40" y="576.6665905511811" fill="#52647C" font-size="7.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">核验基线 2026-10-05 14:07 CST | 实线=已有路径；虚线=待打通 / 建议配置</text><text x="755.8897637795277" y="577.3305905511811" fill="#16233D" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">24 / 36</text><rect x="40" y="135" width="368" height="154" rx="10" fill="#F0EAFF" stroke="#764FE3"/><rect x="40" y="135" width="5" height="154" rx="2" fill="#764FE3" stroke="#764FE3"/><text x="56" y="160.62" fill="#764FE3" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">交给 Dot 的材料</text><text x="56" y="181.13" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">当前 README / 学习指南、原 learn-project 方法、固定版本知识索</text><text x="56" y="198.18" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">引、明确允许列表和本批次任务范围。没有把 F: 盘作为云端路径，也</text><text x="56" y="215.23" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">没有把本机 token 发给 Dot。</text><rect x="431" y="135" width="371" height="154" rx="10" fill="#F0EAFF" stroke="#764FE3"/><rect x="431" y="135" width="5" height="154" rx="2" fill="#764FE3" stroke="#764FE3"/><text x="447" y="160.62" fill="#764FE3" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">首条实测</text><text x="447" y="181.13" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">identity → preliminary 领取 / 来源核实 / 保存 / 回读 / 释放 → full</text><text x="447" y="198.18" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">领取 / 真实实验 / PDF / 独立审核 → 六原件保存 / 标签回读 / 释放。</text><rect x="40" y="314" width="761.8897637795277" height="143" rx="9" fill="#F0EAFF" stroke="#F0EAFF"/><text x="56" y="338.96" fill="#764FE3" font-size="12" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">可复制给 Dot 的启动指令（摘要版）</text><text x="56" y="364.462" fill="#16233D" font-size="11.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">请先核对拾遗插件的本人账户、一个允许列表和三个权限。读取学习指南及固定版本 learn-project；只学习来源已核实、无其他 owner 的记录</text><text x="56" y="384.462" fill="#16233D" font-size="11.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">。按方法做真实实验、彩色 PDF、知识提案和独立审核，保存六类原件并回读标签，完成勾选留给我。首条全部验收后，再确认保存每 15 分钟、</text><text x="56" y="404.462" fill="#16233D" font-size="11.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">Asia/Shanghai 的日程，明确本批范围，异常单独记录，同一故障不反复通知。</text><rect x="40" y="464" width="761.8897637795277" height="64" rx="8" fill="#FFF4D8" stroke="#FFF4D8"/><text x="54" y="483.632" fill="#A66700" font-size="10.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">日程必须实际 list 回读</text><text x="54" y="500.885" fill="#16233D" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">确认 enabled、时区、周期、保存的完整指令和目标环境。一次 run_now 成功不保证长期调度、严格时点或跨回合绝对串行；日程范围不能自动扩大到清单外任务。</text></svg>