<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 841.8897637795277 595.2755905511812" role="img"><rect x="0" y="0" width="841.8897637795277" height="595.2755905511812" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><rect x="0" y="0" width="10" height="595.2755905511812" rx="0" fill="#2875EA" stroke="#2875EA"/><text x="40" y="30.055" fill="#52647C" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">REMINDER / PERSONAL LEARNING SYSTEM</text><rect x="619.8897637795277" y="17" width="182" height="23" rx="6" fill="#EAF2FF" stroke="#EAF2FF"/><text x="629.8897637795277" y="30.304000000000002" fill="#2875EA" font-size="8.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">搭建 09 / Windows 本地</text><text x="40" y="71.92" fill="#16233D" font-size="24" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">执行一次备份，再注册登录触发</text><text x="40" y="95.549" fill="#52647C" font-size="10.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">触发器名为 Reminder-Dot-Backup-OnLogon；它只复制产物，不启动模型、vault 合并或 Git。</text><rect x="40" y="562.2755905511812" width="761.8897637795277" height="1" rx="0" fill="#DCE5F0" stroke="#DCE5F0"/><text x="40" y="576.6665905511811" fill="#52647C" font-size="7.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">核验基线 2026-10-05 14:07 CST | 实线=已有路径；虚线=待打通 / 建议配置</text><text x="755.8897637795277" y="577.3305905511811" fill="#16233D" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">27 / 36</text><text x="40" y="552.5005905511812" fill="#52647C" font-size="7.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">依据：install_reminder_dot_backup_trigger.ps1；备份入口</text><rect x="40" y="136" width="470" height="128.696" rx="8" fill="#16233D" stroke="#16233D"/><text x="54" y="153.055" fill="#7ED7DF" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">Windows / PowerShell 7</text><text x="54" y="172.387" fill="#FFFFFF" font-size="8.9" font-family="Consolas,monospace" font-weight="400">Set-Location F:\reminder</text><text x="54" y="185.915" fill="#FFFFFF" font-size="8.9" font-family="Consolas,monospace" font-weight="400">&amp; ./tools/reminder_dot_on_login.ps1</text><text x="54" y="199.443" fill="#FFFFFF" font-size="8.9" font-family="Consolas,monospace" font-weight="400">&amp; ./tools/install_reminder_dot_backup_trigger.ps1 -WhatIf</text><text x="54" y="212.971" fill="#FFFFFF" font-size="8.9" font-family="Consolas,monospace" font-weight="400">&amp; ./tools/install_reminder_dot_backup_trigger.ps1</text><text x="54" y="226.499" fill="#FFFFFF" font-size="8.9" font-family="Consolas,monospace" font-weight="400">Get-ScheduledTask -TaskName Reminder-Dot-Backup-OnLogon</text><text x="54" y="240.027" fill="#FFFFFF" font-size="8.9" font-family="Consolas,monospace" font-weight="400">Get-ScheduledTaskInfo -TaskName Reminder-Dot-Backup-OnLogon</text><text x="54" y="253.555" fill="#FFFFFF" font-size="8.9" font-family="Consolas,monospace" font-weight="400">python tools/reminder_pipeline.py status</text><rect x="534" y="138" width="268" height="157" rx="10" fill="#EAF2FF" stroke="#2875EA"/><rect x="534" y="138" width="5" height="157" rx="2" fill="#2875EA" stroke="#2875EA"/><text x="550" y="163.62" fill="#2875EA" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">一次备份的通过标准</text><text x="550" y="184.13" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">账户 / 列表一致。</text><text x="550" y="201.18" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">报告 Markdown 与六原件 SHA256 一致。</text><text x="550" y="218.23" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">重复备份新增 0，不覆盖冲突副本。</text><text x="550" y="235.28" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">cloudDeleted 为 false。</text><rect x="534" y="315" width="268" height="135" rx="10" fill="#EAF2FF" stroke="#2875EA"/><rect x="534" y="315" width="5" height="135" rx="2" fill="#2875EA" stroke="#2875EA"/><text x="550" y="340.62" fill="#2875EA" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">到哪里找文件</text><text x="550" y="360.217" fill="#16233D" font-size="9.9" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">完成/.pipeline/dot/账户/列表/</text><text x="550" y="375.562" fill="#16233D" font-size="9.9" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">reports/：私有报告与文件</text><text x="550" y="390.907" fill="#16233D" font-size="9.9" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">exports/：原始导出</text><text x="550" y="406.252" fill="#16233D" font-size="9.9" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">handoff.json：各阶段交接账本</text><rect x="40" y="464" width="761.8897637795277" height="64" rx="8" fill="#FFF4D8" stroke="#FFF4D8"/><text x="54" y="483.632" fill="#A66700" font-size="10.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">启动方式必须分别验收</text><text x="54" y="500.885" fill="#16233D" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">首次手动备份成功，再看注册触发器回读和真实登录执行结果。机器离线、会话过期或配置缺失时保留待同步；一次创建成功不等于每次启动都可靠。</text></svg>