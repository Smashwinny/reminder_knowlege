<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 841.8897637795277 595.2755905511812" role="img"><rect x="0" y="0" width="841.8897637795277" height="595.2755905511812" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><rect x="0" y="0" width="10" height="595.2755905511812" rx="0" fill="#764FE3" stroke="#764FE3"/><text x="40" y="30.055" fill="#52647C" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">REMINDER / PERSONAL LEARNING SYSTEM</text><rect x="619.8897637795277" y="17" width="182" height="23" rx="6" fill="#F0EAFF" stroke="#F0EAFF"/><text x="629.8897637795277" y="30.304000000000002" fill="#764FE3" font-size="8.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">分类与任务状态</text><text x="40" y="71.92" fill="#16233D" font-size="24" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">先路由，再学习；“完成”仍由本人决定</text><text x="40" y="95.549" fill="#52647C" font-size="10.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">分类阶段必须记录来源、判断依据、已有知识关联、下一步和未确认事项。</text><rect x="40" y="562.2755905511812" width="761.8897637795277" height="1" rx="0" fill="#DCE5F0" stroke="#DCE5F0"/><text x="40" y="576.6665905511811" fill="#52647C" font-size="7.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">核验基线 2026-10-05 14:07 CST | 实线=已有路径；虚线=待打通 / 建议配置</text><text x="755.8897637795277" y="577.3305905511811" fill="#16233D" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">09 / 36</text><rect x="40" y="132" width="761.8897637795277" height="30" rx="6" fill="#16233D" stroke="#16233D"/><text x="51" y="148.885" fill="#FFFFFF" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">分类</text><text x="241" y="148.885" fill="#FFFFFF" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">具体判据</text><text x="581" y="148.885" fill="#FFFFFF" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">下一步</text><rect x="40" y="162" width="761.8897637795277" height="32.0" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><text x="51" y="178.3" fill="#16233D" font-size="10" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">learning / 学习</text><text x="241" y="178.3" fill="#16233D" font-size="10" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">知识、教程、论文、原理或项目已核实</text><text x="581" y="178.3" fill="#16233D" font-size="10" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">可领取且有权限时进入完整学习</text><rect x="40" y="194.0" width="761.8897637795277" height="32.0" rx="0" fill="#EDF2FA" stroke="#EDF2FA"/><text x="51" y="210.3" fill="#16233D" font-size="10" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">non_learning / 非学习</text><text x="241" y="210.3" fill="#16233D" font-size="10" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">实质内容已读，确无本次学习主题</text><text x="581" y="210.3" fill="#16233D" font-size="10" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">保存理由与相应标签</text><rect x="40" y="226.0" width="761.8897637795277" height="32.0" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><text x="51" y="242.3" fill="#16233D" font-size="10" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">duplicate / 重复增补</text><text x="241" y="242.3" fill="#16233D" font-size="10" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">已学过相同内容，但需核对版本和差异</text><text x="581" y="242.3" fill="#16233D" font-size="10" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">关联既有指南，只分析增补价值</text><rect x="40" y="258.0" width="761.8897637795277" height="32.0" rx="0" fill="#EDF2FA" stroke="#EDF2FA"/><text x="51" y="274.3" fill="#16233D" font-size="10" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">needs_review / 证据不足</text><text x="241" y="274.3" fill="#16233D" font-size="10" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">原文 / 目标身份 / 出链未确认</text><text x="581" y="274.3" fill="#16233D" font-size="10" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">补证据，不强行绑定搜索命中</text><rect x="40" y="290.0" width="761.8897637795277" height="32.0" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><text x="51" y="306.3" fill="#16233D" font-size="10" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">blocked / 环境受阻</text><text x="241" y="306.3" fill="#16233D" font-size="10" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">目标明确，但执行或审核条件不足</text><text x="581" y="306.3" fill="#16233D" font-size="10" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">写具体阻碍；同源不重复启动</text><rect x="40" y="322.0" width="761.8897637795277" height="32.0" rx="0" fill="#EDF2FA" stroke="#EDF2FA"/><text x="51" y="338.3" fill="#16233D" font-size="10" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">non_link / 非链接</text><text x="241" y="338.3" fill="#16233D" font-size="10" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">原记录没有 HTTP(S)/www 链接</text><text x="581" y="338.3" fill="#16233D" font-size="10" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">按正文处理；不等于无学习价值</text><rect x="40" y="462" width="761.8897637795277" height="66" rx="8" fill="#FFF0E4" stroke="#FFF0E4"/><text x="54" y="481.632" fill="#F07822" font-size="10.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">两条状态轴</text><text x="54" y="498.885" fill="#16233D" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">分析标签：已完成完整分析 / 初步判定非项目学习类 / 非链接类，以及待核实等补充标签。任务状态：未开始 / 进行中 / 用户完成。智能体不调用旧 publish、done、viewed</text><text x="54" y="513.61" fill="#16233D" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">来勾选任务。</text></svg>