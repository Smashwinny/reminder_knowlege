<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 841.8897637795277 595.2755905511812" role="img"><rect x="0" y="0" width="841.8897637795277" height="595.2755905511812" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><rect x="0" y="0" width="10" height="595.2755905511812" rx="0" fill="#087B68" stroke="#087B68"/><text x="40" y="30.055" fill="#52647C" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">REMINDER / PERSONAL LEARNING SYSTEM</text><rect x="619.8897637795277" y="17" width="182" height="23" rx="6" fill="#E7F6EF" stroke="#E7F6EF"/><text x="629.8897637795277" y="30.304000000000002" fill="#087B68" font-size="8.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">每日巩固框架</text><text x="40" y="71.92" fill="#16233D" font-size="24" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">让本人回忆，再让 AI 给反馈</text><text x="40" y="95.549" fill="#52647C" font-size="10.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">已存在每日复习日程的历史记录；本次未复核其时间、内容或评分回写。以下为建议的完整复习设计。</text><rect x="40" y="562.2755905511812" width="761.8897637795277" height="1" rx="0" fill="#DCE5F0" stroke="#DCE5F0"/><text x="40" y="576.6665905511811" fill="#52647C" font-size="7.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">核验基线 2026-10-05 14:07 CST | 实线=已有路径；虚线=待打通 / 建议配置</text><text x="755.8897637795277" y="577.3305905511811" fill="#16233D" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">16 / 36</text><text x="40" y="552.5005905511812" fill="#52647C" font-size="7.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">依据：既有日程记录；主动回忆研究 [S8]；建议模板</text><rect x="40" y="145" width="142" height="125" rx="10" fill="#E7F6EF" stroke="#087B68"/><rect x="40" y="145" width="5" height="125" rx="2" fill="#087B68" stroke="#087B68"/><text x="56" y="170.62" fill="#087B68" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">挑 3–5 个概念</text><text x="56" y="190.13400000000001" fill="#16233D" font-size="9.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">来源明确、近期新学 / 上</text><text x="56" y="205.324" fill="#16233D" font-size="9.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">次薄弱</text><polyline points="182,207 195,207" fill="none" stroke="#087B68" stroke-width="1.65" stroke-dasharray="5 3"/><polygon points="195,207 187.0,203.0 187.0,211.0" fill="#087B68"/><rect x="195" y="145" width="142" height="125" rx="10" fill="#E7F6EF" stroke="#087B68"/><rect x="195" y="145" width="5" height="125" rx="2" fill="#087B68" stroke="#087B68"/><text x="211" y="170.62" fill="#087B68" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">闭卷说清楚</text><text x="211" y="190.13400000000001" fill="#16233D" font-size="9.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">定义、为什么、机制、反</text><text x="211" y="205.324" fill="#16233D" font-size="9.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">例</text><polyline points="337,207 350,207" fill="none" stroke="#087B68" stroke-width="1.65" stroke-dasharray="5 3"/><polygon points="350,207 342.0,203.0 342.0,211.0" fill="#087B68"/><rect x="350" y="145" width="142" height="125" rx="10" fill="#E7F6EF" stroke="#087B68"/><rect x="350" y="145" width="5" height="125" rx="2" fill="#087B68" stroke="#087B68"/><text x="366" y="170.62" fill="#087B68" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">动手做一小步</text><text x="366" y="190.13400000000001" fill="#16233D" font-size="9.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">改参数 / 负对照 / 迁移场</text><text x="366" y="205.324" fill="#16233D" font-size="9.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">景</text><polyline points="492,207 505,207" fill="none" stroke="#087B68" stroke-width="1.65" stroke-dasharray="5 3"/><polygon points="505,207 497.0,203.0 497.0,211.0" fill="#087B68"/><rect x="505" y="145" width="142" height="125" rx="10" fill="#E7F6EF" stroke="#087B68"/><rect x="505" y="145" width="5" height="125" rx="2" fill="#087B68" stroke="#087B68"/><text x="521" y="170.62" fill="#087B68" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">对照证据反馈</text><text x="521" y="190.13400000000001" fill="#16233D" font-size="9.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">标出错因；回链笔记和实</text><text x="521" y="205.324" fill="#16233D" font-size="9.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">验</text><polyline points="647,207 660,207" fill="none" stroke="#087B68" stroke-width="1.65" stroke-dasharray="5 3"/><polygon points="660,207 652.0,203.0 652.0,211.0" fill="#087B68"/><rect x="660" y="145" width="142" height="125" rx="10" fill="#E7F6EF" stroke="#087B68"/><rect x="660" y="145" width="5" height="125" rx="2" fill="#087B68" stroke="#087B68"/><text x="676" y="170.62" fill="#087B68" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">保存复习结果</text><text x="676" y="190.13400000000001" fill="#16233D" font-size="9.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">本人确认评分；安排下一</text><text x="676" y="205.324" fill="#16233D" font-size="9.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">次</text><rect x="40" y="321" width="366" height="126" rx="10" fill="#E7F6EF" stroke="#087B68"/><rect x="40" y="321" width="5" height="126" rx="2" fill="#087B68" stroke="#087B68"/><text x="56" y="346.62" fill="#087B68" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">轻量评分：0 / 1 / 2</text><text x="56" y="367.13" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">0：说不清，先看证据并次日重试。</text><text x="56" y="384.18" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">1：能解释但不会用，补一个小实验。</text><text x="56" y="401.23" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">2：能独立迁移，下次复习间隔拉长。</text><rect x="430" y="321" width="372" height="126" rx="10" fill="#F0EAFF" stroke="#764FE3"/><rect x="430" y="321" width="5" height="126" rx="2" fill="#764FE3" stroke="#764FE3"/><text x="446" y="346.62" fill="#764FE3" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">示例节奏：1 / 3 / 7 / 14 / 30 天</text><text x="446" y="367.13" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">这是可调整的排程例子，不是本项目已经实现的复习算法，也不承诺统</text><text x="446" y="384.18" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">一最优。每天 10–15 分钟；用实际答题质量调整。</text><rect x="40" y="464" width="761.8897637795277" height="64" rx="8" fill="#FFF4D8" stroke="#FFF4D8"/><text x="54" y="483.632" fill="#A66700" font-size="10.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">资料生成与本人掌握是两件事</text><text x="54" y="500.885" fill="#16233D" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">看完 PDF 可算阅读；能复述、实验和迁移才是掌握。Dot 在电脑离线时可基于公开笔记提问，但私有本机评分和未提交笔记需要上线后由本人 / 协调者合并。</text></svg>