<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 841.8897637795277 595.2755905511812" role="img"><rect x="0" y="0" width="841.8897637795277" height="595.2755905511812" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><rect x="0" y="0" width="10" height="595.2755905511812" rx="0" fill="#2875EA" stroke="#2875EA"/><text x="40" y="30.055" fill="#52647C" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">REMINDER / PERSONAL LEARNING SYSTEM</text><rect x="619.8897637795277" y="17" width="182" height="23" rx="6" fill="#EAF2FF" stroke="#EAF2FF"/><text x="629.8897637795277" y="30.304000000000002" fill="#2875EA" font-size="8.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">云端成果回迁</text><text x="40" y="71.92" fill="#16233D" font-size="24" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">先复制校验，再入库，最后推送 Git</text><text x="40" y="95.549" fill="#52647C" font-size="10.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">这五个成功状态分别记账；其中任何一步等待，都不能称“全部完成”。</text><rect x="40" y="562.2755905511812" width="761.8897637795277" height="1" rx="0" fill="#DCE5F0" stroke="#DCE5F0"/><text x="40" y="576.6665905511811" fill="#52647C" font-size="7.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">核验基线 2026-10-05 14:07 CST | 实线=已有路径；虚线=待打通 / 建议配置</text><text x="755.8897637795277" y="577.3305905511811" fill="#16233D" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">14 / 36</text><text x="40" y="552.5005905511812" fill="#52647C" font-size="7.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">依据：reminder_dot_backup.py；handoff；confirm-analysis</text><rect x="40" y="145" width="142" height="110" rx="10" fill="#FFF0E4" stroke="#F07822"/><rect x="40" y="145" width="5" height="110" rx="2" fill="#F07822" stroke="#F07822"/><text x="56" y="170.62" fill="#F07822" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">网站保存</text><text x="56" y="190.13400000000001" fill="#16233D" font-size="9.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">私有报告 + 六原件</text><polyline points="182,200 195,200" fill="none" stroke="#F07822" stroke-width="1.65"/><polygon points="195,200 187.0,196.0 187.0,204.0" fill="#F07822"/><rect x="195" y="145" width="142" height="110" rx="10" fill="#EAF2FF" stroke="#2875EA"/><rect x="195" y="145" width="5" height="110" rx="2" fill="#2875EA" stroke="#2875EA"/><text x="211" y="170.62" fill="#2875EA" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">本机备份</text><text x="211" y="190.13400000000001" fill="#16233D" font-size="9.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">校验 SHA256 / 范围</text><polyline points="337,200 350,200" fill="none" stroke="#2875EA" stroke-width="1.65"/><polygon points="350,200 342.0,196.0 342.0,204.0" fill="#2875EA"/><rect x="350" y="145" width="142" height="110" rx="10" fill="#E7F6EF" stroke="#087B68"/><rect x="350" y="145" width="5" height="110" rx="2" fill="#087B68" stroke="#087B68"/><text x="366" y="170.62" fill="#087B68" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">知识入库</text><text x="366" y="190.13400000000001" fill="#16233D" font-size="9.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">概念查重 + MOC</text><polyline points="492,200 505,200" fill="none" stroke="#087B68" stroke-width="1.65"/><polygon points="505,200 497.0,196.0 497.0,204.0" fill="#087B68"/><rect x="505" y="145" width="142" height="110" rx="10" fill="#EEF1F7" stroke="#333E57"/><rect x="505" y="145" width="5" height="110" rx="2" fill="#333E57" stroke="#333E57"/><text x="521" y="170.62" fill="#333E57" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">Git 提交</text><text x="521" y="190.13400000000001" fill="#16233D" font-size="9.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">审核后明确文件</text><polyline points="647,200 660,200" fill="none" stroke="#333E57" stroke-width="1.65"/><polygon points="660,200 652.0,196.0 652.0,204.0" fill="#333E57"/><rect x="660" y="145" width="142" height="110" rx="10" fill="#EEF1F7" stroke="#333E57"/><rect x="660" y="145" width="5" height="110" rx="2" fill="#333E57" stroke="#333E57"/><text x="676" y="170.62" fill="#333E57" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">Git 推送</text><text x="676" y="190.13400000000001" fill="#16233D" font-size="9.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">远端 SHA 回读</text><rect x="40" y="309" width="367" height="131" rx="10" fill="#EAF2FF" stroke="#2875EA"/><rect x="40" y="309" width="5" height="131" rx="2" fill="#2875EA" stroke="#2875EA"/><text x="56" y="334.62" fill="#2875EA" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">固定脚本：只负责搬运</text><text x="56" y="353.304" fill="#2875EA" font-size="8.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">tools/reminder_dot_on_login.ps1</text><text x="56" y="375.466" fill="#16233D" font-size="10.2" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">用户登录 Windows 时拉取私有副本，验证文件、来源和账户列表，更新</text><text x="56" y="391.276" fill="#16233D" font-size="10.2" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">handoff.json。重复拉取不重复计数，不删除云端原件。</text><rect x="430" y="309" width="372" height="131" rx="10" fill="#E7F6EF" stroke="#087B68"/><rect x="430" y="309" width="5" height="131" rx="2" fill="#087B68" stroke="#087B68"/><text x="446" y="334.62" fill="#087B68" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">协调者：负责理解与交付</text><text x="446" y="353.304" fill="#087B68" font-size="8.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">Windows 的唯一知识协调者</text><text x="446" y="375.466" fill="#16233D" font-size="10.2" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">核对当前 sourceHash 与原 owner，把练习整理到现有项目目录，合并</text><text x="446" y="391.276" fill="#16233D" font-size="10.2" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">vault，独立审核并 confirm-analysis，再按明确清单完成 Git 收尾。</text><rect x="40" y="464" width="761.8897637795277" height="64" rx="8" fill="#FFF4D8" stroke="#FFF4D8"/><text x="54" y="483.632" fill="#A66700" font-size="10.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">目前尚未打通的最后一公里</text><text x="54" y="500.885" fill="#16233D" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">Dot 向当前本机既有聊天的正式投递返回 placement-v1 / NOT_FOUND，自动唤醒未通过。登录备份已运行，不代表本机智能体会自动合并知识或推送。</text></svg>