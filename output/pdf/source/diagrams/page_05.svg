<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 841.8897637795277 595.2755905511812" role="img"><rect x="0" y="0" width="841.8897637795277" height="595.2755905511812" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><rect x="0" y="0" width="10" height="595.2755905511812" rx="0" fill="#D74554" stroke="#D74554"/><text x="40" y="30.055" fill="#52647C" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">REMINDER / PERSONAL LEARNING SYSTEM</text><rect x="619.8897637795277" y="17" width="182" height="23" rx="6" fill="#FDECEF" stroke="#FDECEF"/><text x="629.8897637795277" y="30.304000000000002" fill="#D74554" font-size="8.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">职责表</text><text x="40" y="71.92" fill="#16233D" font-size="24" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">每个终端到底运行什么</text><text x="40" y="95.549" fill="#52647C" font-size="10.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">“Ubuntu 本地”是管理员电脑；“阿里云服务器”即使运行 Linux，也不是这台本地 Ubuntu。</text><rect x="40" y="562.2755905511812" width="761.8897637795277" height="1" rx="0" fill="#DCE5F0" stroke="#DCE5F0"/><text x="40" y="576.6665905511811" fill="#52647C" font-size="7.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">核验基线 2026-10-05 14:07 CST | 实线=已有路径；虚线=待打通 / 建议配置</text><text x="755.8897637795277" y="577.3305905511811" fill="#16233D" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">05 / 36</text><rect x="40" y="130" width="761.8897637795277" height="30" rx="6" fill="#16233D" stroke="#16233D"/><text x="51" y="146.885" fill="#FFFFFF" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">位置</text><text x="167" y="146.885" fill="#FFFFFF" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">运行模块 / 文件</text><text x="421" y="146.885" fill="#FFFFFF" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">输入与输出</text><text x="701" y="146.885" fill="#FFFFFF" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">谁负责</text><rect x="40" y="160" width="761.8897637795277" height="31.4" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><text x="51" y="175.968" fill="#16233D" font-size="9.6" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">手机</text><text x="167" y="175.968" fill="#16233D" font-size="9.6" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">拾遗 Android App；或手机浏览器</text><text x="421" y="175.968" fill="#16233D" font-size="9.6" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">链接 / 简短想法 → 同账号任务</text><text x="701" y="175.968" fill="#16233D" font-size="9.6" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">本人</text><rect x="40" y="191.4" width="761.8897637795277" height="31.4" rx="0" fill="#EDF2FA" stroke="#EDF2FA"/><text x="51" y="207.368" fill="#16233D" font-size="9.6" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">阿里云服务器</text><text x="167" y="207.368" fill="#16233D" font-size="9.6" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">Docker reminder_app；/opt/reminder；/data</text><text x="421" y="207.368" fill="#16233D" font-size="9.6" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">任务、列表、OAuth、报告和原件持久化</text><text x="701" y="207.368" fill="#16233D" font-size="9.6" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">Ubuntu 运维者</text><rect x="40" y="222.8" width="761.8897637795277" height="45.8" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><text x="51" y="238.768" fill="#16233D" font-size="9.6" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">Dot 云端</text><text x="167" y="238.768" fill="#16233D" font-size="9.6" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">本人 Dot + MCP 插件 + 云端实验目录</text><text x="421" y="238.768" fill="#16233D" font-size="9.6" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">获准任务 → 分类 / 真实学习 / 六类原件</text><text x="701" y="238.768" fill="#16233D" font-size="9.6" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">云端学习者 + 独立审</text><text x="701" y="253.168" fill="#16233D" font-size="9.6" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">核者</text><rect x="40" y="268.6" width="761.8897637795277" height="31.4" rx="0" fill="#EDF2FA" stroke="#EDF2FA"/><text x="51" y="284.56800000000004" fill="#16233D" font-size="9.6" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">Ubuntu 本地</text><text x="167" y="284.56800000000004" fill="#16233D" font-size="9.6" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">私有网站 Git 副本、SSH、异机备份检查</text><text x="421" y="284.56800000000004" fill="#16233D" font-size="9.6" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">已审核代码 → 部署；服务器备份 → 私有副本</text><text x="701" y="284.56800000000004" fill="#16233D" font-size="9.6" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">唯一网站维护者</text><rect x="40" y="300.0" width="761.8897637795277" height="31.4" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><text x="51" y="315.968" fill="#16233D" font-size="9.6" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">Windows 本地</text><text x="167" y="315.968" fill="#16233D" font-size="9.6" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">tools/；完成/.pipeline/；项目目录；vault/</text><text x="421" y="315.968" fill="#16233D" font-size="9.6" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">云端原件 → 校验副本 → 入库与公开 Git</text><text x="701" y="315.968" fill="#16233D" font-size="9.6" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">唯一知识协调者</text><rect x="40" y="331.4" width="761.8897637795277" height="31.4" rx="0" fill="#EDF2FA" stroke="#EDF2FA"/><text x="51" y="347.368" fill="#16233D" font-size="9.6" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">GitHub 远端</text><text x="167" y="347.368" fill="#16233D" font-size="9.6" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">reminder 私有代码仓；reminder_knowlege 公开仓</text><text x="421" y="347.368" fill="#16233D" font-size="9.6" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">代码发布与运维协作；学习成果版本化</text><text x="701" y="347.368" fill="#16233D" font-size="9.6" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">两类仓库分别管理</text><rect x="40" y="459" width="761.8897637795277" height="65" rx="8" fill="#E7F6EF" stroke="#E7F6EF"/><text x="54" y="478.632" fill="#087B68" font-size="10.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">Obsidian 的位置</text><text x="54" y="495.885" fill="#16233D" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">当前 Obsidian 使用 Windows 的 F:\reminder\vault。Ubuntu 不是另一份可同时写入的最终知识库；多设备学习前必须协调任务租约和唯一写入者。</text></svg>