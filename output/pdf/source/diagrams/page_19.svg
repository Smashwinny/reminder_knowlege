<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 841.8897637795277 595.2755905511812" role="img"><rect x="0" y="0" width="841.8897637795277" height="595.2755905511812" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><rect x="0" y="0" width="10" height="595.2755905511812" rx="0" fill="#D74554" stroke="#D74554"/><text x="40" y="30.055" fill="#52647C" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">REMINDER / PERSONAL LEARNING SYSTEM</text><rect x="619.8897637795277" y="17" width="182" height="23" rx="6" fill="#FDECEF" stroke="#FDECEF"/><text x="629.8897637795277" y="30.304000000000002" fill="#D74554" font-size="8.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">搭建 01 / Ubuntu 本地</text><text x="40" y="71.92" fill="#16233D" font-size="24" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">准备运维终端与服务器连接</text><text x="40" y="95.549" fill="#52647C" font-size="10.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">Ubuntu 保管网站代码与运维连接；它不会把 Windows 的最终知识目录当服务器的数据目录。</text><rect x="40" y="562.2755905511812" width="761.8897637795277" height="1" rx="0" fill="#DCE5F0" stroke="#DCE5F0"/><text x="40" y="576.6665905511811" fill="#52647C" font-size="7.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">核验基线 2026-10-05 14:07 CST | 实线=已有路径；虚线=待打通 / 建议配置</text><text x="755.8897637795277" y="577.3305905511811" fill="#16233D" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">19 / 36</text><rect x="40" y="137" width="452" height="131.88799999999998" rx="8" fill="#16233D" stroke="#16233D"/><text x="54" y="154.055" fill="#7ED7DF" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">Ubuntu 本地 / Bash</text><text x="54" y="173.636" fill="#FFFFFF" font-size="9.2" font-family="Consolas,monospace" font-weight="400">git --version</text><text x="54" y="187.62" fill="#FFFFFF" font-size="9.2" font-family="Consolas,monospace" font-weight="400">ssh -V</text><text x="54" y="201.60399999999998" fill="#FFFFFF" font-size="9.2" font-family="Consolas,monospace" font-weight="400">node --version</text><text x="54" y="215.588" fill="#FFFFFF" font-size="9.2" font-family="Consolas,monospace" font-weight="400">git clone https://github.com/Smashwinny/reminder.git</text><text x="54" y="229.57199999999997" fill="#FFFFFF" font-size="9.2" font-family="Consolas,monospace" font-weight="400">cd reminder</text><text x="54" y="243.55599999999998" fill="#FFFFFF" font-size="9.2" font-family="Consolas,monospace" font-weight="400">git status --short</text><text x="54" y="257.54" fill="#FFFFFF" font-size="9.2" font-family="Consolas,monospace" font-weight="400">git log -1 --oneline</text><rect x="524" y="138" width="278" height="150" rx="10" fill="#FDECEF" stroke="#D74554"/><rect x="524" y="138" width="5" height="150" rx="2" fill="#D74554" stroke="#D74554"/><text x="540" y="163.62" fill="#D74554" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">每组命令做什么</text><text x="540" y="183.964" fill="#16233D" font-size="10.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">检查 Git / SSH / Node。</text><text x="540" y="200.704" fill="#16233D" font-size="10.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">克隆已获权限的私有网站仓库。</text><text x="540" y="217.44400000000002" fill="#16233D" font-size="10.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">确认工作区与当前版本。</text><text x="540" y="234.184" fill="#16233D" font-size="10.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">Node 22 对应当前容器版本。</text><rect x="40" y="285.888" width="452" height="61.056" rx="8" fill="#16233D" stroke="#16233D"/><text x="54" y="302.943" fill="#7ED7DF" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">先测代码，再进入阿里云；连接信息自行替换</text><text x="54" y="322.275" fill="#FFFFFF" font-size="8.9" font-family="Consolas,monospace" font-weight="400">node --test sync-server/server.test.js</text><text x="54" y="335.803" fill="#FFFFFF" font-size="8.9" font-family="Consolas,monospace" font-weight="400">ssh -i /PRIVATE/PATH/key ADMIN@ECS_HOST</text><rect x="524" y="310" width="278" height="135" rx="10" fill="#FDECEF" stroke="#D74554"/><rect x="524" y="310" width="5" height="135" rx="2" fill="#D74554" stroke="#D74554"/><text x="540" y="335.62" fill="#D74554" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">预期结果 / 故障处理</text><text x="540" y="355.715" fill="#16233D" font-size="10.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">测试通过后再准备部署。</text><text x="540" y="371.98999999999995" fill="#16233D" font-size="10.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">SSH 成功看到服务器主机名。</text><text x="540" y="388.265" fill="#16233D" font-size="10.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">仓库 404 先核权限，不找旧公网入口。</text><text x="540" y="404.53999999999996" fill="#16233D" font-size="10.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">有未提交改动先保留，不能自动 reset。</text><rect x="40" y="464" width="761.8897637795277" height="64" rx="8" fill="#FFF4D8" stroke="#FFF4D8"/><text x="54" y="483.632" fill="#A66700" font-size="10.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">版本与已有生产</text><text x="54" y="500.885" fill="#16233D" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">当前生产曾验收固定版本 97ef3cc；新建时使用负责人确认的含 Dot 集成版本。生产已有数据时先完整备份和核对差异，不能照抄“首次部署”覆盖现有目录。</text></svg>