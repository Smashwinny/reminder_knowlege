<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 841.8897637795277 595.2755905511812" role="img"><rect x="0" y="0" width="841.8897637795277" height="595.2755905511812" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><rect x="0" y="0" width="10" height="595.2755905511812" rx="0" fill="#087B68" stroke="#087B68"/><text x="40" y="30.055" fill="#52647C" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">REMINDER / PERSONAL LEARNING SYSTEM</text><rect x="619.8897637795277" y="17" width="182" height="23" rx="6" fill="#E7F6EF" stroke="#E7F6EF"/><text x="629.8897637795277" y="30.304000000000002" fill="#087B68" font-size="8.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">搭建 13 / 每日复习</text><text x="40" y="71.92" fill="#16233D" font-size="24" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">把复习责任交给 Dot，把评分留给本人</text><text x="40" y="95.549" fill="#52647C" font-size="10.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">下面是建议的日程指令；本次只交付手册，未修改已有复习日程或新增自动化。</text><rect x="40" y="562.2755905511812" width="761.8897637795277" height="1" rx="0" fill="#DCE5F0" stroke="#DCE5F0"/><text x="40" y="576.6665905511811" fill="#52647C" font-size="7.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">核验基线 2026-10-05 14:07 CST | 实线=已有路径；虚线=待打通 / 建议配置</text><text x="755.8897637795277" y="577.3305905511811" fill="#16233D" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">31 / 36</text><rect x="40" y="131" width="478" height="220" rx="9" fill="#E7F6EF" stroke="#E7F6EF"/><text x="55" y="156.96" fill="#087B68" font-size="12" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">给 Dot 的可复制复习指令</text><text x="55" y="186.379" fill="#16233D" font-size="11.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">每天北京时间 20:30，基于已发布且能实际读取的知识笔记，挑 3–5 个近期概念或我上次</text><text x="55" y="206.379" fill="#16233D" font-size="11.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">答错的概念，先只给问题，不给答案。问定义、原理、一个反例和一个迁移用途；我回答</text><text x="55" y="226.379" fill="#16233D" font-size="11.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">后再用原笔记和真实实验证据反馈。请生成带日期的复习草稿，记录我的原回答、0/1/2</text><text x="55" y="246.379" fill="#16233D" font-size="11.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">评分建议、错因和下次日期，待我确认。本机离线只留云端草稿；上线后由唯一协调者合</text><text x="55" y="266.379" fill="#16233D" font-size="11.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">并 vault。不要读取获准范围外的私密记录，也不要把评分写进任务完成状态。请确认日程</text><text x="55" y="286.379" fill="#16233D" font-size="11.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">实际保存结果。</text><rect x="547" y="134" width="255" height="148" rx="10" fill="#E7F6EF" stroke="#087B68"/><rect x="547" y="134" width="5" height="148" rx="2" fill="#087B68" stroke="#087B68"/><text x="563" y="159.62" fill="#087B68" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">建议新增的笔记</text><text x="563" y="179.881" fill="#16233D" font-size="10.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">vault/复习/日期.md</text><text x="563" y="196.466" fill="#16233D" font-size="10.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">概念链接 + 问题</text><text x="563" y="213.05100000000002" fill="#16233D" font-size="10.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">本人回答 + 错因</text><text x="563" y="229.636" fill="#16233D" font-size="10.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">评分建议 + 本人确认</text><text x="563" y="246.221" fill="#16233D" font-size="10.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">下一次复习日期</text><rect x="547" y="302" width="255" height="128" rx="10" fill="#F0EAFF" stroke="#764FE3"/><rect x="547" y="302" width="5" height="128" rx="2" fill="#764FE3" stroke="#764FE3"/><text x="563" y="327.62" fill="#764FE3" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">日程回读要看</text><text x="563" y="347.881" fill="#16233D" font-size="10.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">Asia/Shanghai / 每日时点</text><text x="563" y="364.46599999999995" fill="#16233D" font-size="10.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">复习来源和范围</text><text x="563" y="381.051" fill="#16233D" font-size="10.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">是否等待本人回答</text><text x="563" y="397.63599999999997" fill="#16233D" font-size="10.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">通知方式与无变化时静默</text><rect x="40" y="454" width="761.8897637795277" height="68" rx="8" fill="#FFF4D8" stroke="#FFF4D8"/><text x="54" y="473.632" fill="#A66700" font-size="10.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">与十五分钟学习日程分开</text><text x="54" y="490.885" fill="#16233D" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">学习调度负责加工新资料；复习日程负责检验本人能否回忆和应用。本机评分数据库与间隔算法尚未验收，模板需首次答题和写回验证后才能称已运行。</text></svg>