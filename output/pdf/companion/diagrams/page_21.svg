<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 841.8897637795277 595.2755905511812" role="img"><rect x="0" y="0" width="841.8897637795277" height="595.2755905511812" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><rect x="0" y="0" width="10" height="595.2755905511812" rx="0" fill="#F07822" stroke="#F07822"/><text x="40" y="30.055" fill="#52647C" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">REMINDER / PERSONAL LEARNING SYSTEM</text><rect x="619.8897637795277" y="17" width="182" height="23" rx="6" fill="#FFF0E4" stroke="#FFF0E4"/><text x="629.8897637795277" y="30.304000000000002" fill="#F07822" font-size="8.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">搭建 03 / 阿里云服务器</text><text x="40" y="71.92" fill="#16233D" font-size="24" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">部署站点，先让手机与网页同步</text><text x="40" y="95.549" fill="#52647C" font-size="10.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">下面以新目录 /opt/reminder 为例；先完成普通站点，再配置 Dot 四项门控变量。</text><rect x="40" y="562.2755905511812" width="761.8897637795277" height="1" rx="0" fill="#DCE5F0" stroke="#DCE5F0"/><text x="40" y="576.6665905511811" fill="#52647C" font-size="7.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">核验基线 2026-10-05 14:07 CST | 实线=已有路径；虚线=待打通 / 建议配置</text><text x="755.8897637795277" y="577.3305905511811" fill="#16233D" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">21 / 36</text><text x="40" y="552.5005905511812" fill="#52647C" font-size="7.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">依据：deploy/install.sh；docker-compose.yml；.env.example</text><rect x="40" y="133" width="484" height="191.776" rx="8" fill="#16233D" stroke="#16233D"/><text x="54" y="150.055" fill="#7ED7DF" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">阿里云服务器 / Bash</text><text x="54" y="169.1795" fill="#FFFFFF" font-size="8.65" font-family="Consolas,monospace" font-weight="400">sudo install -d -m 0750 -o &quot;$USER&quot; /opt/reminder</text><text x="54" y="182.3275" fill="#FFFFFF" font-size="8.65" font-family="Consolas,monospace" font-weight="400">git clone https://github.com/Smashwinny/reminder.git /opt/reminder</text><text x="54" y="195.47549999999998" fill="#FFFFFF" font-size="8.65" font-family="Consolas,monospace" font-weight="400">cd /opt/reminder</text><text x="54" y="208.6235" fill="#FFFFFF" font-size="8.65" font-family="Consolas,monospace" font-weight="400">umask 077</text><text x="54" y="221.7715" fill="#FFFFFF" font-size="8.65" font-family="Consolas,monospace" font-weight="400">cp deploy/.env.example deploy/.env</text><text x="54" y="234.9195" fill="#FFFFFF" font-size="8.65" font-family="Consolas,monospace" font-weight="400">openssl rand -hex 24</text><text x="54" y="248.0675" fill="#FFFFFF" font-size="8.65" font-family="Consolas,monospace" font-weight="400">nano deploy/.env</text><text x="54" y="261.2155" fill="#FFFFFF" font-size="8.65" font-family="Consolas,monospace" font-weight="400">touch deploy/kimi.key</text><text x="54" y="274.36350000000004" fill="#FFFFFF" font-size="8.65" font-family="Consolas,monospace" font-weight="400">chmod 600 deploy/.env deploy/kimi.key</text><text x="54" y="287.5115" fill="#FFFFFF" font-size="8.65" font-family="Consolas,monospace" font-weight="400">sudo docker compose -f deploy/docker-compose.yml up -d --build</text><text x="54" y="300.65950000000004" fill="#FFFFFF" font-size="8.65" font-family="Consolas,monospace" font-weight="400">sudo docker compose -f deploy/docker-compose.yml ps</text><text x="54" y="313.80750000000006" fill="#FFFFFF" font-size="8.65" font-family="Consolas,monospace" font-weight="400">curl -fsS http://127.0.0.1:8787/api/healthz</text><rect x="547" y="136" width="255" height="180" rx="10" fill="#FFF0E4" stroke="#F07822"/><rect x="547" y="136" width="5" height="180" rx="2" fill="#F07822" stroke="#F07822"/><text x="563" y="161.62" fill="#F07822" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">必须人工填写</text><text x="563" y="182.13" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">把随机邀请码填入 .env。</text><text x="563" y="199.18" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">Kimi 摘要可选：Key 仅填 kimi.key。</text><text x="563" y="216.23" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">Dot 账户和 callback 等下一步确定。</text><text x="563" y="233.28" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">不要把随机值、Key 或 .env 发到 Issue / Git</text><text x="563" y="250.32999999999998" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">。</text><rect x="547" y="335" width="255" height="124" rx="10" fill="#FFF0E4" stroke="#F07822"/><rect x="547" y="335" width="5" height="124" rx="2" fill="#F07822" stroke="#F07822"/><text x="563" y="360.62" fill="#F07822" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">预期结果</text><text x="563" y="380.632" fill="#16233D" font-size="10.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">容器 reminder_app 健康。</text><text x="563" y="396.752" fill="#16233D" font-size="10.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">数据在 reminder_data 卷。</text><text x="563" y="412.872" fill="#16233D" font-size="10.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">本机 healthz 返回成功。</text><text x="563" y="428.992" fill="#16233D" font-size="10.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">外网稍后经 HTTPS 入口访问。</text><rect x="40" y="464" width="761.8897637795277" height="64" rx="8" fill="#FFF4D8" stroke="#FFF4D8"/><text x="54" y="483.632" fill="#A66700" font-size="10.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">两种首次部署方式选一种</text><text x="54" y="500.885" fill="#16233D" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">也可在已配置好 .env 的新实例运行 sudo sh deploy/install.sh：会创建缺失的空 kimi.key 并检查容器 / 端口冲突。发现已有实例则停止，转入负责人审核的更新流程。</text></svg>