<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 841.8897637795277 595.2755905511812" role="img"><rect x="0" y="0" width="841.8897637795277" height="595.2755905511812" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><rect x="0" y="0" width="10" height="595.2755905511812" rx="0" fill="#764FE3" stroke="#764FE3"/><text x="40" y="30.055" fill="#52647C" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">REMINDER / PERSONAL LEARNING SYSTEM</text><rect x="619.8897637795277" y="17" width="182" height="23" rx="6" fill="#F0EAFF" stroke="#F0EAFF"/><text x="629.8897637795277" y="30.304000000000002" fill="#764FE3" font-size="8.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">搭建 05 / 浏览器 + 阿里云</text><text x="40" y="71.92" fill="#16233D" font-size="24" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">用私有 MCP / OAuth 连接本人 Dot</text><text x="40" y="95.549" fill="#52647C" font-size="10.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">这一步在界面中完成，不存在本项目已经验证的“一条 CLI 命令连接 Dot”。</text><rect x="40" y="562.2755905511812" width="761.8897637795277" height="1" rx="0" fill="#DCE5F0" stroke="#DCE5F0"/><text x="40" y="576.6665905511811" fill="#52647C" font-size="7.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">核验基线 2026-10-05 14:07 CST | 实线=已有路径；虚线=待打通 / 建议配置</text><text x="755.8897637795277" y="577.3305905511811" fill="#16233D" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">23 / 36</text><text x="40" y="552.5005905511812" fill="#52647C" font-size="7.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">依据：连接本人 Dot 流程；官方 OAuth [S3]</text><rect x="40" y="131" width="761.8897637795277" height="30" rx="6" fill="#16233D" stroke="#16233D"/><text x="51" y="147.885" fill="#FFFFFF" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">在哪里</text><text x="204" y="147.885" fill="#FFFFFF" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">操作</text><text x="571" y="147.885" fill="#FFFFFF" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">核对结果</text><rect x="40" y="161" width="761.8897637795277" height="31.1" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><text x="51" y="176.802" fill="#16233D" font-size="9.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">ChatGPT 桌面 / 浏览器</text><text x="204" y="176.802" fill="#16233D" font-size="9.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">创建私有 MCP 应用；MCP URL 为 https://reminder.geniusqi.com/mcp</text><text x="571" y="176.802" fill="#16233D" font-size="9.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">自建实例替换自己的域名</text><rect x="40" y="192.1" width="761.8897637795277" height="31.1" rx="0" fill="#EDF2FA" stroke="#EDF2FA"/><text x="51" y="207.902" fill="#16233D" font-size="9.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">同一应用配置界面</text><text x="204" y="207.902" fill="#16233D" font-size="9.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">选择预定义自定义 OAuth 公共客户端；确定 client ID；复制精确 callback</text><text x="571" y="207.902" fill="#16233D" font-size="9.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">callback 不能猜、不能沿用别人草稿</text><rect x="40" y="223.2" width="761.8897637795277" height="45.2" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><text x="51" y="239.00199999999998" fill="#16233D" font-size="9.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">阿里云 deploy/.env</text><text x="204" y="239.00199999999998" fill="#16233D" font-size="9.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">填写 DOT_ALLOWED_USER_ID / DOT_PUBLIC_ORIGIN /</text><text x="204" y="253.10199999999998" fill="#16233D" font-size="9.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">DOT_OAUTH_CLIENT_ID / DOT_OAUTH_REDIRECT_URI</text><text x="571" y="239.00199999999998" fill="#16233D" font-size="9.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">账户用 canonical UUID；四项齐备才开放</text><rect x="40" y="268.4" width="761.8897637795277" height="31.1" rx="0" fill="#EDF2FA" stroke="#EDF2FA"/><text x="51" y="284.202" fill="#16233D" font-size="9.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">网站 /dot 管理页</text><text x="204" y="284.202" fill="#16233D" font-size="9.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">本人登录；选择获准列表及是否自动加入以后新增记录</text><text x="571" y="284.202" fill="#16233D" font-size="9.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">列表真实成员和 future auto-add 分别确认</text><rect x="40" y="299.5" width="761.8897637795277" height="31.1" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><text x="51" y="315.302" fill="#16233D" font-size="9.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">本人 OAuth 同意页</text><text x="204" y="315.302" fill="#16233D" font-size="9.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">核对账户、列表与三个 scope；本人确认同意</text><text x="571" y="315.302" fill="#16233D" font-size="9.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">records.read + analysis.write + learning.write</text><rect x="40" y="330.6" width="761.8897637795277" height="31.1" rx="0" fill="#EDF2FA" stroke="#EDF2FA"/><text x="51" y="346.40200000000004" fill="#16233D" font-size="9.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">Dot 私密对话</text><text x="204" y="346.40200000000004" fill="#16233D" font-size="9.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">调用 reminder_identity 并实际回读</text><text x="571" y="346.40200000000004" fill="#16233D" font-size="9.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">身份 / listId / 权限 / 模式符合本人选择</text><rect x="40" y="464" width="761.8897637795277" height="64" rx="8" fill="#FFF4D8" stroke="#FFF4D8"/><text x="54" y="483.632" fill="#A66700" font-size="10.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">配置变更后的验收</text><text x="54" y="500.885" fill="#16233D" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">运维者审核配置后更新 Reminder app，再检查 discovery 与真实 OAuth；未授权 MCP POST 应拒绝。临时哨兵 ID 被拒绝不能证明真实跨账户 / 跨列表隔离，需要用受控测</text><text x="54" y="515.61" fill="#16233D" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">试账户验证。</text></svg>