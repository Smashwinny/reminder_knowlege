<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 841.8897637795277 595.2755905511812" role="img"><rect x="0" y="0" width="841.8897637795277" height="595.2755905511812" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><rect x="0" y="0" width="10" height="595.2755905511812" rx="0" fill="#2875EA" stroke="#2875EA"/><text x="40" y="30.055" fill="#52647C" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">REMINDER / PERSONAL LEARNING SYSTEM</text><rect x="619.8897637795277" y="17" width="182" height="23" rx="6" fill="#EAF2FF" stroke="#EAF2FF"/><text x="629.8897637795277" y="30.304000000000002" fill="#2875EA" font-size="8.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">搭建 08 / Windows 本地</text><text x="40" y="71.92" fill="#16233D" font-size="24" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">私密配置账户、列表和本机凭据</text><text x="40" y="95.549" fill="#52647C" font-size="10.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">Dot OAuth 与本机网站会话是两种凭据；本机凭据从已有环境变量或私有 token 文件读取。</text><rect x="40" y="562.2755905511812" width="761.8897637795277" height="1" rx="0" fill="#DCE5F0" stroke="#DCE5F0"/><text x="40" y="576.6665905511811" fill="#52647C" font-size="7.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">核验基线 2026-10-05 14:07 CST | 实线=已有路径；虚线=待打通 / 建议配置</text><text x="755.8897637795277" y="577.3305905511811" fill="#16233D" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">26 / 36</text><rect x="40" y="133" width="465" height="164.72" rx="8" fill="#16233D" stroke="#16233D"/><text x="54" y="150.055" fill="#7ED7DF" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">Windows / PowerShell 7 · 不把 token 写在命令参数中</text><text x="54" y="169.138" fill="#FFFFFF" font-size="8.6" font-family="Consolas,monospace" font-weight="400">Set-Location F:\reminder</text><text x="54" y="182.21" fill="#FFFFFF" font-size="8.6" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">New-Item -ItemType Directory -Force 完成/.pipeline</text><text x="54" y="195.282" fill="#FFFFFF" font-size="8.6" font-family="Consolas,monospace" font-weight="400">Copy-Item reminder-dot/dot-backup-config.example.json `</text><text x="54" y="208.354" fill="#FFFFFF" font-size="8.6" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">  完成/.pipeline/dot-backup-config.json</text><text x="54" y="221.42600000000002" fill="#FFFFFF" font-size="8.6" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">notepad 完成/.pipeline/dot-backup-config.json</text><text x="54" y="234.49800000000002" fill="#FFFFFF" font-size="8.6" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400"># 在私密终端输入已有本机网站会话 token</text><text x="54" y="247.57" fill="#FFFFFF" font-size="8.6" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">$reminderSecret = Read-Host &#x27;网站会话 token&#x27; -AsSecureString</text><text x="54" y="260.642" fill="#FFFFFF" font-size="8.6" font-family="Consolas,monospace" font-weight="400">$env:SHIYI_TOKEN = `</text><text x="54" y="273.714" fill="#FFFFFF" font-size="8.6" font-family="Consolas,monospace" font-weight="400">  [System.Net.NetworkCredential]::new(&#x27;&#x27;, $reminderSecret).Password</text><text x="54" y="286.786" fill="#FFFFFF" font-size="8.6" font-family="Consolas,monospace" font-weight="400">python tools/reminder_dot_backup.py --help</text><rect x="529" y="135" width="273" height="157" rx="10" fill="#EAF2FF" stroke="#2875EA"/><rect x="529" y="135" width="5" height="157" rx="2" fill="#2875EA" stroke="#2875EA"/><text x="545" y="160.62" fill="#2875EA" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">配置文件只填写两项</text><text x="545" y="181.13" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">accountId：identity 核对的 canonical 账户</text><text x="545" y="198.18" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">UUID。</text><text x="545" y="215.23" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">listId：本人允许列表 UUID。</text><text x="545" y="232.28" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">来自私密授权回读，不能按名字猜或复制本人的值</text><text x="545" y="249.32999999999998" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">给朋友。</text><rect x="529" y="312" width="273" height="137" rx="10" fill="#FFF0E4" stroke="#F07822"/><rect x="529" y="312" width="5" height="137" rx="2" fill="#F07822" stroke="#F07822"/><text x="545" y="337.62" fill="#F07822" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">没有既有 token 时</text><text x="545" y="357.632" fill="#16233D" font-size="10.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">在本人私密终端通过网站正式登录建立本机会话。配</text><text x="545" y="373.752" fill="#16233D" font-size="10.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">套包提供 getpass 登录示例，拒绝重定向且不打印</text><text x="545" y="389.872" fill="#16233D" font-size="10.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">token；不要使用旧 login 命令把密码写到命令行。</text><rect x="40" y="464" width="761.8897637795277" height="64" rx="8" fill="#FFF4D8" stroke="#FFF4D8"/><text x="54" y="483.632" fill="#A66700" font-size="10.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">会话保存的范围</text><text x="54" y="500.885" fill="#16233D" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">临时 SHIYI_TOKEN 只在当前进程生效，不能供以后登录任务复用。需要自动登录备份时，将正式取得的会话安全保存到 tools/.shiyi_token 并限制本机读取权限；它不授予</text><text x="54" y="515.61" fill="#16233D" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">Dot 电脑权限。</text></svg>