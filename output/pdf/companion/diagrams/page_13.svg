<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 841.8897637795277 595.2755905511812" role="img"><rect x="0" y="0" width="841.8897637795277" height="595.2755905511812" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><rect x="0" y="0" width="10" height="595.2755905511812" rx="0" fill="#764FE3" stroke="#764FE3"/><text x="40" y="30.055" fill="#52647C" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">REMINDER / PERSONAL LEARNING SYSTEM</text><rect x="619.8897637795277" y="17" width="182" height="23" rx="6" fill="#F0EAFF" stroke="#F0EAFF"/><text x="629.8897637795277" y="30.304000000000002" fill="#764FE3" font-size="8.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">Dot 如何使用 skill</text><text x="40" y="71.92" fill="#16233D" font-size="24" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">方法和知识以固定版本传到云端</text><text x="40" y="95.549" fill="#52647C" font-size="10.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">本机 F:\reminder 不是 Dot 云端磁盘。读取方法、执行工具与连接本机，是三个不同动作。</text><rect x="40" y="562.2755905511812" width="761.8897637795277" height="1" rx="0" fill="#DCE5F0" stroke="#DCE5F0"/><text x="40" y="576.6665905511811" fill="#52647C" font-size="7.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">核验基线 2026-10-05 14:07 CST | 实线=已有路径；虚线=待打通 / 建议配置</text><text x="755.8897637795277" y="577.3305905511811" fill="#16233D" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">13 / 36</text><text x="40" y="552.5005905511812" fill="#52647C" font-size="7.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">依据：RUNNING_IN_DOT.md；reminder_dot_reference.py；官方说明 [S1]</text><rect x="40" y="139" width="223" height="134" rx="10" fill="#EEF1F7" stroke="#333E57"/><rect x="40" y="139" width="5" height="134" rx="2" fill="#333E57" stroke="#333E57"/><text x="56" y="164.62" fill="#333E57" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">已发布知识仓库</text><text x="56" y="184.715" fill="#16233D" font-size="10.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">固定 commit 的 SKILL.md</text><text x="56" y="200.99" fill="#16233D" font-size="10.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">按标题和指纹生成索引</text><text x="56" y="217.26500000000001" fill="#16233D" font-size="10.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">只包含已发布概念 / 项目笔记</text><rect x="306" y="139" width="223" height="134" rx="10" fill="#F0EAFF" stroke="#764FE3"/><rect x="306" y="139" width="5" height="134" rx="2" fill="#764FE3" stroke="#764FE3"/><text x="322" y="164.62" fill="#764FE3" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">Dot 读方法</text><text x="322" y="184.715" fill="#16233D" font-size="10.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">reminder_learning_guide</text><text x="322" y="200.99" fill="#16233D" font-size="10.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">读取原 skill 和相关笔记</text><text x="322" y="217.26500000000001" fill="#16233D" font-size="10.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">记录实际读到的版本及依据</text><rect x="572" y="139" width="230" height="134" rx="10" fill="#F0EAFF" stroke="#764FE3"/><rect x="572" y="139" width="5" height="134" rx="2" fill="#764FE3" stroke="#764FE3"/><text x="588" y="164.62" fill="#764FE3" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">Dot 执行方法</text><text x="588" y="184.715" fill="#16233D" font-size="10.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">在云端新建项目目录</text><text x="588" y="200.99" fill="#16233D" font-size="10.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">按实有工具配置实验</text><text x="588" y="217.26500000000001" fill="#16233D" font-size="10.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">不照抄 Windows 专属命令</text><polyline points="263,208 306,208" fill="none" stroke="#087B68" stroke-width="1.65"/><polygon points="306,208 298.0,204.0 298.0,212.0" fill="#087B68"/><polyline points="529,208 572,208" fill="none" stroke="#764FE3" stroke-width="1.65"/><polygon points="572,208 564.0,204.0 564.0,212.0" fill="#764FE3"/><rect x="40" y="320" width="368" height="118" rx="10" fill="#E7F6EF" stroke="#087B68"/><rect x="40" y="320" width="5" height="118" rx="2" fill="#087B68" stroke="#087B68"/><text x="56" y="345.62" fill="#087B68" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">索引不是最新本机知识库</text><text x="56" y="366.13" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">未提交的 Obsidian 手动笔记、私密记录和整台电脑不在云端索引。</text><text x="56" y="383.18" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">云端查重先给范围声明；回迁后本机再次查重合并。</text><rect x="430" y="320" width="372" height="118" rx="10" fill="#EEF1F7" stroke="#333E57"/><rect x="430" y="320" width="5" height="118" rx="2" fill="#333E57" stroke="#333E57"/><text x="446" y="345.62" fill="#333E57" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">读不到 raw 网页时怎么办</text><text x="446" y="366.13" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">记录原失败，再通过实际可用的 Git 对象完整读取同一固定文件；用</text><text x="446" y="383.18" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">commit、blob、SHA256 追溯。不能把搜索摘要当作 skill 已完整读</text><text x="446" y="400.23" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">取。</text><rect x="40" y="463" width="761.8897637795277" height="64" rx="8" fill="#FFF4D8" stroke="#FFF4D8"/><text x="54" y="482.632" fill="#A66700" font-size="10.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">“安装了 skill”不能凭口头确认</text><text x="54" y="499.885" fill="#16233D" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">官方指出本地 skills 需要连接电脑。当前云端方案是把方法作为可追溯输入读取，并实际执行；本次不声称本机 skill 已自动挂载到 Dot。</text></svg>