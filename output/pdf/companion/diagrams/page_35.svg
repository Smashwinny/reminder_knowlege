<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 841.8897637795277 595.2755905511812" role="img"><rect x="0" y="0" width="841.8897637795277" height="595.2755905511812" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><rect x="0" y="0" width="10" height="595.2755905511812" rx="0" fill="#764FE3" stroke="#764FE3"/><text x="40" y="30.055" fill="#52647C" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">REMINDER / PERSONAL LEARNING SYSTEM</text><rect x="619.8897637795277" y="17" width="182" height="23" rx="6" fill="#F0EAFF" stroke="#F0EAFF"/><text x="629.8897637795277" y="30.304000000000002" fill="#764FE3" font-size="8.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">面向伙伴 / 演进路线</text><text x="40" y="71.92" fill="#16233D" font-size="24" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">从个人闭环，走向可复制的产品</text><text x="40" y="95.549" fill="#52647C" font-size="10.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">这是演进建议与验证指标；没有把个人实验包装成已验证的企业多租户平台。</text><rect x="40" y="562.2755905511812" width="761.8897637795277" height="1" rx="0" fill="#DCE5F0" stroke="#DCE5F0"/><text x="40" y="576.6665905511811" fill="#52647C" font-size="7.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">核验基线 2026-10-05 14:07 CST | 实线=已有路径；虚线=待打通 / 建议配置</text><text x="755.8897637795277" y="577.3305905511811" fill="#16233D" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">35 / 36</text><rect x="40" y="132" width="246" height="193" rx="10" fill="#F0EAFF" stroke="#764FE3"/><rect x="40" y="132" width="5" height="193" rx="2" fill="#764FE3" stroke="#764FE3"/><text x="56" y="157.62" fill="#764FE3" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">现在 · 证明端到端价值</text><text x="56" y="178.13" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">已拿到真实云端报告、实验证据、独立审核</text><text x="56" y="195.18" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">、本机知识与 Git。用一条真实学习项目演</text><text x="56" y="212.23" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">示，可让伙伴直接看到输入与产出。</text><rect x="298" y="132" width="246" height="193" rx="10" fill="#EAF2FF" stroke="#2875EA"/><rect x="298" y="132" width="5" height="193" rx="2" fill="#2875EA" stroke="#2875EA"/><text x="314" y="157.62" fill="#2875EA" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">下一步 · 补齐自动收尾</text><text x="314" y="178.13" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">原生本机唤醒、票据续约、新记录派发、知</text><text x="314" y="195.18" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">识索引更新、复习写回都需明确验收。解决</text><text x="314" y="212.23" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">“报告完成后仍等协调者”的断点。</text><rect x="556" y="132" width="246" height="193" rx="10" fill="#FFF0E4" stroke="#F07822"/><rect x="556" y="132" width="5" height="193" rx="2" fill="#F07822" stroke="#F07822"/><text x="572" y="157.62" fill="#F07822" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">再扩展 · 才谈团队规模</text><text x="572" y="178.13" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">多账户授权隔离、事务租约、分块产物存储</text><text x="572" y="195.18" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">、稳定事件触发、成本审计和恢复演练。现</text><text x="572" y="212.23" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">单进程 JSON 存储不直接扩成多副本。</text><rect x="40" y="353" width="761.8897637795277" height="30" rx="6" fill="#16233D" stroke="#16233D"/><text x="51" y="369.885" fill="#FFFFFF" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">向伙伴 / 投资人展示的指标</text><text x="398" y="369.885" fill="#FFFFFF" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">应该怎样测</text><rect x="40" y="383" width="761.8897637795277" height="32.3" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><text x="51" y="399.466" fill="#16233D" font-size="10.2" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">来源核实率 / 可学习比例</text><text x="398" y="399.466" fill="#16233D" font-size="10.2" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">真实输入中多少能确认目标；不可读与非学习分开</text><rect x="40" y="415.3" width="761.8897637795277" height="32.3" rx="0" fill="#EDF2FA" stroke="#EDF2FA"/><text x="51" y="431.766" fill="#16233D" font-size="10.2" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">复现通过率 / 审核退回率</text><text x="398" y="431.766" fill="#16233D" font-size="10.2" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">以实际实验和独立审核计算，不以文件存在计算</text><rect x="40" y="447.6" width="761.8897637795277" height="32.3" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><text x="51" y="464.06600000000003" fill="#16233D" font-size="10.2" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">回迁与推送时延 / 恢复成功率</text><text x="398" y="464.06600000000003" fill="#16233D" font-size="10.2" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">分别记录网站保存、本机入库、远端 push 的时间</text><rect x="40" y="479.90000000000003" width="761.8897637795277" height="32.3" rx="0" fill="#EDF2FA" stroke="#EDF2FA"/><text x="51" y="496.36600000000004" fill="#16233D" font-size="10.2" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">七天后可解释和可迁移的比例</text><text x="398" y="496.36600000000004" fill="#16233D" font-size="10.2" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">本人闭卷回答和小实验；没有实际数据不填提升百分比</text><text x="40" y="526.221" fill="#52647C" font-size="8.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">成本账：云服务器 / 域名、Dot 账户额度、摘要 API、实验资源、审核与协调投入分别记录；本手册没有给未经核对的价格或投资回报承诺。</text></svg>