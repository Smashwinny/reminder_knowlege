<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 841.8897637795277 595.2755905511812" role="img"><rect x="0" y="0" width="841.8897637795277" height="595.2755905511812" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><rect x="0" y="0" width="10" height="595.2755905511812" rx="0" fill="#A66700" stroke="#A66700"/><text x="40" y="30.055" fill="#52647C" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">REMINDER / PERSONAL LEARNING SYSTEM</text><rect x="619.8897637795277" y="17" width="182" height="23" rx="6" fill="#FFF4D8" stroke="#FFF4D8"/><text x="629.8897637795277" y="30.304000000000002" fill="#A66700" font-size="8.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">附录 B / 排错与维护</text><text x="40" y="71.92" fill="#16233D" font-size="24" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">先定位失败环节，再做对应修复</text><text x="40" y="95.549" fill="#52647C" font-size="10.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">失败时保留原件和已有状态，不把缓存当本次网站真值，不用新 owner 绕开旧租约。</text><rect x="40" y="562.2755905511812" width="761.8897637795277" height="1" rx="0" fill="#DCE5F0" stroke="#DCE5F0"/><text x="40" y="576.6665905511811" fill="#52647C" font-size="7.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">核验基线 2026-10-05 14:07 CST | 实线=已有路径；虚线=待打通 / 建议配置</text><text x="755.8897637795277" y="577.3305905511811" fill="#16233D" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">34 / 36</text><rect x="40" y="131" width="761.8897637795277" height="30" rx="6" fill="#16233D" stroke="#16233D"/><text x="51" y="147.885" fill="#FFFFFF" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">现象</text><text x="235" y="147.885" fill="#FFFFFF" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">优先核对</text><text x="534" y="147.885" fill="#FFFFFF" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">下一步</text><rect x="40" y="161" width="761.8897637795277" height="30.65" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><text x="51" y="176.553" fill="#16233D" font-size="9.1" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">链接只有壳 / 视频读不到</text><text x="235" y="176.553" fill="#16233D" font-size="9.1" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">原文、作者、出链 / 字幕是否真实可访问</text><text x="534" y="176.553" fill="#16233D" font-size="9.1" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">标证据不足；补公开来源或本人笔记</text><rect x="40" y="191.65" width="761.8897637795277" height="30.65" rx="0" fill="#EDF2FA" stroke="#EDF2FA"/><text x="51" y="207.203" fill="#16233D" font-size="9.1" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">OAuth / MCP 503</text><text x="235" y="207.203" fill="#16233D" font-size="9.1" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">四项 Dot 门控配置是否齐备并已生效</text><text x="534" y="207.203" fill="#16233D" font-size="9.1" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">唯一运维者修配置；健康与 discovery 回读</text><rect x="40" y="222.3" width="761.8897637795277" height="30.65" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><text x="51" y="237.853" fill="#16233D" font-size="9.1" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">401 / 授权失效</text><text x="235" y="237.853" fill="#16233D" font-size="9.1" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">对应凭据类别、过期、scope 与 resource</text><text x="534" y="237.853" fill="#16233D" font-size="9.1" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">正式私密重新连接；不打印 token</text><rect x="40" y="252.95000000000002" width="761.8897637795277" height="30.65" rx="0" fill="#EDF2FA" stroke="#EDF2FA"/><text x="51" y="268.50300000000004" fill="#16233D" font-size="9.1" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">409 / 已有租约</text><text x="235" y="268.50300000000004" fill="#16233D" font-size="9.1" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">任务、同源、项目和原 owner</text><text x="534" y="268.50300000000004" fill="#16233D" font-size="9.1" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">跳过或原 owner 续约；不自动抢占</text><rect x="40" y="283.6" width="761.8897637795277" height="30.65" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><text x="51" y="299.153" fill="#16233D" font-size="9.1" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">上传超出 1 MB</text><text x="235" y="299.153" fill="#16233D" font-size="9.1" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">实际六类文件总大小</text><text x="534" y="299.153" fill="#16233D" font-size="9.1" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">保留受阻；不能删关键证据伪装完整</text><rect x="40" y="314.25" width="761.8897637795277" height="30.65" rx="0" fill="#EDF2FA" stroke="#EDF2FA"/><text x="51" y="329.803" fill="#16233D" font-size="9.1" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">备份通过但 Git 未更新</text><text x="235" y="329.803" fill="#16233D" font-size="9.1" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">handoff 的知识入库 / commit / push 状态</text><text x="534" y="329.803" fill="#16233D" font-size="9.1" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">协调者继续审核与明确文件推送</text><rect x="40" y="344.9" width="761.8897637795277" height="30.65" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><text x="51" y="360.453" fill="#16233D" font-size="9.1" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">Git 暂存归属不明 / 远端拒绝</text><text x="235" y="360.453" fill="#16233D" font-size="9.1" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">暂存清单、远端变更、当前协调者</text><text x="534" y="360.453" fill="#16233D" font-size="9.1" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">保留现场；不 reset / 强推 / 自动 rebase</text><rect x="40" y="375.54999999999995" width="761.8897637795277" height="30.65" rx="0" fill="#EDF2FA" stroke="#EDF2FA"/><text x="51" y="391.10299999999995" fill="#16233D" font-size="9.1" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">Dot 不能唤醒本机聊天</text><text x="235" y="391.10299999999995" fill="#16233D" font-size="9.1" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">设备在线、正式路由与 PING / PONG 回执</text><text x="534" y="391.10299999999995" fill="#16233D" font-size="9.1" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">当前 NOT_FOUND 未通过；不要归因于 OAuth</text><rect x="40" y="406.19999999999993" width="761.8897637795277" height="30.65" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><text x="51" y="421.75299999999993" fill="#16233D" font-size="9.1" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">Obsidian 链接断了</text><text x="235" y="421.75299999999993" fill="#16233D" font-size="9.1" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">vault 打开位置、笔记名、相对路径</text><text x="534" y="421.75299999999993" fill="#16233D" font-size="9.1" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">修正 Markdown 链接；不重复生成同义概念</text></svg>