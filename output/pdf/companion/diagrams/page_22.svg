<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 841.8897637795277 595.2755905511812" role="img"><rect x="0" y="0" width="841.8897637795277" height="595.2755905511812" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><rect x="0" y="0" width="10" height="595.2755905511812" rx="0" fill="#F07822" stroke="#F07822"/><text x="40" y="30.055" fill="#52647C" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">REMINDER / PERSONAL LEARNING SYSTEM</text><rect x="619.8897637795277" y="17" width="182" height="23" rx="6" fill="#FFF0E4" stroke="#FFF0E4"/><text x="629.8897637795277" y="30.304000000000002" fill="#F07822" font-size="8.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">搭建 04 / 阿里云服务器</text><text x="40" y="71.92" fill="#16233D" font-size="24" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">把 HTTPS 入口和备份接好</text><text x="40" y="95.549" fill="#52647C" font-size="10.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">当前实例使用 Cloudflare 命名隧道；新读者可采用自己的隧道或 Nginx / 证书，二选一。</text><rect x="40" y="562.2755905511812" width="761.8897637795277" height="1" rx="0" fill="#DCE5F0" stroke="#DCE5F0"/><text x="40" y="576.6665905511811" fill="#52647C" font-size="7.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">核验基线 2026-10-05 14:07 CST | 实线=已有路径；虚线=待打通 / 建议配置</text><text x="755.8897637795277" y="577.3305905511811" fill="#16233D" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">22 / 36</text><rect x="40" y="133" width="363" height="131" rx="10" fill="#FFF0E4" stroke="#F07822"/><rect x="40" y="133" width="5" height="131" rx="2" fill="#F07822" stroke="#F07822"/><text x="56" y="158.62" fill="#F07822" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">入口配置：Cloudflare 路线</text><text x="56" y="178.964" fill="#16233D" font-size="10.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">在 Cloudflare 配置自己的域名与命名隧道，服务指向</text><text x="56" y="195.704" fill="#16233D" font-size="10.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">http://127.0.0.1:8787。官方安装 cloudflared；私密 token 文件按</text><text x="56" y="212.44400000000002" fill="#16233D" font-size="10.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">服务模板路径保存并限制权限。</text><rect x="431" y="133" width="371" height="131" rx="10" fill="#FDECEF" stroke="#D74554"/><rect x="431" y="133" width="5" height="131" rx="2" fill="#D74554" stroke="#D74554"/><text x="447" y="158.62" fill="#D74554" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">入口配置：Nginx 路线</text><text x="447" y="178.964" fill="#16233D" font-size="10.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">参考 deploy/nginx-reminder.conf.example，换成本人域名与已取得</text><text x="447" y="195.704" fill="#16233D" font-size="10.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">的有效证书；nginx -t 通过后加载。已有入口由原运维者维护，不新增</text><text x="447" y="212.44400000000002" fill="#16233D" font-size="10.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">第二个正式数据源。</text><rect x="40" y="291" width="762" height="129.76" rx="8" fill="#16233D" stroke="#16233D"/><text x="54" y="308.055" fill="#7ED7DF" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">服务器备份和公网验证 / Bash · YOUR_DOMAIN 换成自己的域名</text><text x="54" y="327.47" fill="#FFFFFF" font-size="9.0" font-family="Consolas,monospace" font-weight="400">cd /opt/reminder</text><text x="54" y="341.15000000000003" fill="#FFFFFF" font-size="9.0" font-family="Consolas,monospace" font-weight="400">sudo cp deploy/reminder-backup.service deploy/reminder-backup.timer /etc/systemd/system/</text><text x="54" y="354.83000000000004" fill="#FFFFFF" font-size="9.0" font-family="Consolas,monospace" font-weight="400">sudo systemctl daemon-reload</text><text x="54" y="368.51000000000005" fill="#FFFFFF" font-size="9.0" font-family="Consolas,monospace" font-weight="400">sudo systemctl enable --now reminder-backup.timer</text><text x="54" y="382.19000000000005" fill="#FFFFFF" font-size="9.0" font-family="Consolas,monospace" font-weight="400">sudo sh deploy/backup.sh</text><text x="54" y="395.87" fill="#FFFFFF" font-size="9.0" font-family="Consolas,monospace" font-weight="400">sudo systemctl status reminder-backup.timer</text><text x="54" y="409.55" fill="#FFFFFF" font-size="9.0" font-family="Consolas,monospace" font-weight="400">curl -fsS https://YOUR_DOMAIN/api/healthz</text><rect x="40" y="449" width="761.8897637795277" height="70" rx="8" fill="#FFF4D8" stroke="#FFF4D8"/><text x="54" y="468.632" fill="#A66700" font-size="10.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">备份验收与时区</text><text x="54" y="485.885" fill="#16233D" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">保留压缩备份及 .sha256，复制到独立私有位置并测试恢复。模板 OnCalendar=03:20 使用服务器时区并带随机延迟；查 timedatectl 后确定实际时间，不把同机卷副本当异</text><text x="54" y="500.61" fill="#16233D" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">机备份。</text></svg>