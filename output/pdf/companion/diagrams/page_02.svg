<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 841.8897637795277 595.2755905511812" role="img"><rect x="0" y="0" width="841.8897637795277" height="595.2755905511812" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><rect x="0" y="0" width="10" height="595.2755905511812" rx="0" fill="#764FE3" stroke="#764FE3"/><text x="40" y="30.055" fill="#52647C" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">REMINDER / PERSONAL LEARNING SYSTEM</text><rect x="619.8897637795277" y="17" width="182" height="23" rx="6" fill="#F0EAFF" stroke="#F0EAFF"/><text x="629.8897637795277" y="30.304000000000002" fill="#764FE3" font-size="8.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">01 / 项目价值</text><text x="40" y="71.92" fill="#16233D" font-size="24" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">把“存了很多”转成“真的会用”</text><text x="40" y="95.549" fill="#52647C" font-size="10.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">这是一套个人学习流水线：连接已有工具，并给每次学习建立可回溯的交付标准。</text><rect x="40" y="562.2755905511812" width="761.8897637795277" height="1" rx="0" fill="#DCE5F0" stroke="#DCE5F0"/><text x="40" y="576.6665905511811" fill="#52647C" font-size="7.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">核验基线 2026-10-05 14:07 CST | 实线=已有路径；虚线=待打通 / 建议配置</text><text x="755.8897637795277" y="577.3305905511811" fill="#16233D" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">02 / 36</text><text x="40" y="552.5005905511812" fill="#52647C" font-size="7.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">依据：AGENTS.md；learn-project；三项公开学习提交</text><rect x="40" y="133" width="246" height="160" rx="10" fill="#E6F8F3" stroke="#009F8B"/><rect x="40" y="133" width="5" height="160" rx="2" fill="#009F8B" stroke="#009F8B"/><text x="56" y="158.62" fill="#009F8B" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">输入不再零散</text><text x="56" y="178.549" fill="#16233D" font-size="10.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">手机看到链接时只需保存。原帖、摘要、来源</text><text x="56" y="194.514" fill="#16233D" font-size="10.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">和后续产物保持同一条任务的关联。</text><rect x="298" y="133" width="246" height="160" rx="10" fill="#F0EAFF" stroke="#764FE3"/><rect x="298" y="133" width="5" height="160" rx="2" fill="#764FE3" stroke="#764FE3"/><text x="314" y="158.62" fill="#764FE3" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">理解不只靠摘要</text><text x="314" y="178.549" fill="#16233D" font-size="10.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">围绕你的知识储备列疑问，用图和例子讲原理</text><text x="314" y="194.514" fill="#16233D" font-size="10.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">，实际运行实验，明确能力边界。</text><rect x="556" y="133" width="246" height="160" rx="10" fill="#E7F6EF" stroke="#087B68"/><rect x="556" y="133" width="5" height="160" rx="2" fill="#087B68" stroke="#087B68"/><text x="572" y="158.62" fill="#087B68" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">知识不再孤立</text><text x="572" y="178.549" fill="#16233D" font-size="10.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">新概念查重，项目笔记链接已有概念；可在</text><text x="572" y="194.514" fill="#16233D" font-size="10.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">Obsidian 沿关联复习和迁移到下一项目。</text><rect x="40" y="315" width="761.8897637795277" height="30" rx="6" fill="#16233D" stroke="#16233D"/><text x="51" y="331.885" fill="#FFFFFF" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">已经证明的能力</text><text x="286" y="331.885" fill="#FFFFFF" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">实际证据</text><text x="541" y="331.885" fill="#FFFFFF" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">尚不能据此证明</text><rect x="40" y="345" width="761.8897637795277" height="32.0" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><text x="51" y="361.3" fill="#16233D" font-size="10" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">跨端完整学习闭环</text><text x="286" y="361.3" fill="#16233D" font-size="10" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">3 个项目已网站交付、回迁、入库并推送 Git</text><text x="541" y="361.3" fill="#16233D" font-size="10" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">所有链接都可读取；全流程永久无人值守</text><rect x="40" y="377.0" width="761.8897637795277" height="32.0" rx="0" fill="#EDF2FA" stroke="#EDF2FA"/><text x="51" y="393.3" fill="#16233D" font-size="10" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">云端连续推进</text><text x="286" y="393.3" fill="#16233D" font-size="10" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">第 4 项 Colab 完整报告已存；Metrik 正在学习</text><text x="541" y="393.3" fill="#16233D" font-size="10" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">每 15 分钟完成一份报告</text><rect x="40" y="409.0" width="761.8897637795277" height="32.0" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><text x="51" y="425.3" fill="#16233D" font-size="10" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">可核查的交付质量</text><text x="286" y="425.3" fill="#16233D" font-size="10" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">真实实验日志、逐页 PDF 与独立审核</text><text x="541" y="425.3" fill="#16233D" font-size="10" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">AI 报告等于本人已掌握</text><rect x="40" y="463" width="761.8897637795277" height="64" rx="8" fill="#F0EAFF" stroke="#F0EAFF"/><text x="54" y="482.632" fill="#764FE3" font-size="10.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">向伙伴解释时的一句话</text><text x="54" y="499.885" fill="#16233D" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">“我把随手收集的项目，交给云端智能体做有证据的学习资料；再把新知识合并到自己的知识网，并用练习和复习检验是否掌握。”</text></svg>