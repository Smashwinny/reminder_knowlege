<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 841.8897637795277 595.2755905511812" role="img"><rect x="0" y="0" width="841.8897637795277" height="595.2755905511812" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><rect x="0" y="0" width="10" height="595.2755905511812" rx="0" fill="#F07822" stroke="#F07822"/><text x="40" y="30.055" fill="#52647C" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">REMINDER / PERSONAL LEARNING SYSTEM</text><rect x="619.8897637795277" y="17" width="182" height="23" rx="6" fill="#FFF0E4" stroke="#FFF0E4"/><text x="629.8897637795277" y="30.304000000000002" fill="#F07822" font-size="8.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">权限与私密性</text><text x="40" y="71.92" fill="#16233D" font-size="24" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">服务端限制范围，不靠一句“请保密”</text><text x="40" y="95.549" fill="#52647C" font-size="10.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">当前授权边界是本人同意的私有 OAuth 连接，不是可认证的“唯一 Dot 身份”。</text><rect x="40" y="562.2755905511812" width="761.8897637795277" height="1" rx="0" fill="#DCE5F0" stroke="#DCE5F0"/><text x="40" y="576.6665905511811" fill="#52647C" font-size="7.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">核验基线 2026-10-05 14:07 CST | 实线=已有路径；虚线=待打通 / 建议配置</text><text x="755.8897637795277" y="577.3305905511811" fill="#16233D" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">07 / 36</text><text x="40" y="552.5005905511812" fill="#52647C" font-size="7.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">依据：DOT_INTEGRATION.md；官方 OAuth 文档 [S3]</text><rect x="40" y="137" width="230" height="132" rx="10" fill="#E6F8F3" stroke="#009F8B"/><rect x="40" y="137" width="5" height="132" rx="2" fill="#009F8B" stroke="#009F8B"/><text x="56" y="162.62" fill="#009F8B" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">本人同意</text><text x="56" y="183.13" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">登录自己的 Reminder 账户</text><text x="56" y="200.18" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">选择一个服务端列表</text><text x="56" y="217.23" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">确认三个 scope 后 OAuth 同意</text><rect x="306" y="137" width="230" height="132" rx="10" fill="#FFF0E4" stroke="#F07822"/><rect x="306" y="137" width="5" height="132" rx="2" fill="#F07822" stroke="#F07822"/><text x="322" y="162.62" fill="#F07822" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">服务端执行范围</text><text x="322" y="183.13" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">固定 canonical 账户 ID</text><text x="322" y="200.18" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">绑定 listId / resource / 期限</text><text x="322" y="217.23" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">每次工具请求检查权限</text><rect x="572" y="137" width="230" height="132" rx="10" fill="#F0EAFF" stroke="#764FE3"/><rect x="572" y="137" width="5" height="132" rx="2" fill="#764FE3" stroke="#764FE3"/><text x="588" y="162.62" fill="#764FE3" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">Dot 只拿必要工具</text><text x="588" y="183.13" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">records.read：读取</text><text x="588" y="200.18" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">analysis.write：分类报告</text><text x="588" y="217.23" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">learning.write：完整产物</text><polyline points="270,202 306,202" fill="none" stroke="#F07822" stroke-width="1.65"/><polygon points="306,202 298.0,198.0 298.0,206.0" fill="#F07822"/><polyline points="536,202 572,202" fill="none" stroke="#764FE3" stroke-width="1.65"/><polygon points="572,202 564.0,198.0 564.0,206.0" fill="#764FE3"/><rect x="40" y="310" width="761.8897637795277" height="30" rx="6" fill="#16233D" stroke="#16233D"/><text x="51" y="326.885" fill="#FFFFFF" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">数据类型</text><text x="386" y="326.885" fill="#FFFFFF" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">网站 / 本机</text><text x="608" y="326.885" fill="#FFFFFF" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">公开知识 Git</text><rect x="40" y="340" width="761.8897637795277" height="32.3" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><text x="51" y="356.466" fill="#16233D" font-size="10.2" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">私密任务正文、分类报告、授权和运行账本</text><text x="386" y="356.466" fill="#16233D" font-size="10.2" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">私有存储；按权限访问</text><text x="608" y="356.466" fill="#16233D" font-size="10.2" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">不提交</text><rect x="40" y="372.3" width="761.8897637795277" height="32.3" rx="0" fill="#EDF2FA" stroke="#EDF2FA"/><text x="51" y="388.766" fill="#16233D" font-size="10.2" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">脱敏后的 PDF、HTML、实验与合并知识笔记</text><text x="386" y="388.766" fill="#16233D" font-size="10.2" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">保留原件及审核记录</text><text x="608" y="388.766" fill="#16233D" font-size="10.2" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">明确检查后才提交</text><rect x="40" y="404.6" width="761.8897637795277" height="32.3" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><text x="51" y="421.06600000000003" fill="#16233D" font-size="10.2" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">密码、会话 token、OAuth 凭据、服务配置</text><text x="386" y="421.06600000000003" fill="#16233D" font-size="10.2" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">各自环境内保管；不可进入报告</text><text x="608" y="421.06600000000003" fill="#16233D" font-size="10.2" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">不提交</text><rect x="40" y="464" width="761.8897637795277" height="64" rx="8" fill="#FFF4D8" stroke="#FFF4D8"/><text x="54" y="483.632" fill="#A66700" font-size="10.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">额外电脑连接是另一个权限</text><text x="54" y="500.885" fill="#16233D" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">官方支持 Dot 连接个人电脑，但它扩大了能力范围。网站只准访问某个列表，并不能约束 Dot 在其他已连接应用或电脑中的全部权限。</text></svg>