<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 841.8897637795277 595.2755905511812" role="img"><rect x="0" y="0" width="841.8897637795277" height="595.2755905511812" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><rect x="0" y="0" width="10" height="595.2755905511812" rx="0" fill="#087B68" stroke="#087B68"/><text x="40" y="30.055" fill="#52647C" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">REMINDER / PERSONAL LEARNING SYSTEM</text><rect x="619.8897637795277" y="17" width="182" height="23" rx="6" fill="#E7F6EF" stroke="#E7F6EF"/><text x="629.8897637795277" y="30.304000000000002" fill="#087B68" font-size="8.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">搭建 12 / Obsidian 与换机</text><text x="40" y="71.92" fill="#16233D" font-size="24" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">打开 vault，让概念成为可点击的网络</text><text x="40" y="95.549" fill="#52647C" font-size="10.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">Obsidian 的 vault 是一个本地文件夹；没有“上传到 Obsidian 服务器”这个必需步骤。</text><rect x="40" y="562.2755905511812" width="761.8897637795277" height="1" rx="0" fill="#DCE5F0" stroke="#DCE5F0"/><text x="40" y="576.6665905511811" fill="#52647C" font-size="7.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">核验基线 2026-10-05 14:07 CST | 实线=已有路径；虚线=待打通 / 建议配置</text><text x="755.8897637795277" y="577.3305905511811" fill="#16233D" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">30 / 36</text><text x="40" y="552.5005905511812" fill="#52647C" font-size="7.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">依据：Obsidian 内部链接与图谱 [S4][S5]</text><rect x="40" y="133" width="366" height="143" rx="10" fill="#E7F6EF" stroke="#087B68"/><rect x="40" y="133" width="5" height="143" rx="2" fill="#087B68" stroke="#087B68"/><text x="56" y="158.62" fill="#087B68" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">Windows 界面步骤</text><text x="56" y="179.13" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">安装并打开 Obsidian → 打开已有文件夹为 vault → 选择</text><text x="56" y="196.18" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">F:\reminder\vault → 打开 00-总览.md → 点项目笔记和 [[概念链接</text><text x="56" y="213.23" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">]] → 打开图谱 / 当前笔记局部图谱。</text><rect x="430" y="133" width="372" height="143" rx="10" fill="#E7F6EF" stroke="#087B68"/><rect x="430" y="133" width="5" height="143" rx="2" fill="#087B68" stroke="#087B68"/><text x="446" y="158.62" fill="#087B68" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">知识入库的四个动作</text><text x="446" y="179.13" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">新概念写一句话定义和证据。</text><text x="446" y="196.18" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">同义概念合并，保留别名。</text><text x="446" y="213.23" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">相关概念互链，注明关系。</text><text x="446" y="230.28" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">项目笔记链接指南、实验并更新总览。</text><rect x="40" y="307" width="762" height="102.4" rx="8" fill="#16233D" stroke="#16233D"/><text x="54" y="324.055" fill="#7ED7DF" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">换机首次 clone；已克隆且工作区干净才 pull / Bash 或 PowerShell</text><text x="54" y="343.47" fill="#FFFFFF" font-size="9.0" font-family="Consolas,monospace" font-weight="400">git clone https://github.com/Smashwinny/reminder_knowlege.git REMINDER_NEW_DEVICE</text><text x="54" y="357.15000000000003" fill="#FFFFFF" font-size="9.0" font-family="Consolas,monospace" font-weight="400">cd REMINDER_NEW_DEVICE</text><text x="54" y="370.83000000000004" fill="#FFFFFF" font-size="9.0" font-family="Consolas,monospace" font-weight="400">git status --short</text><text x="54" y="384.51000000000005" fill="#FFFFFF" font-size="9.0" font-family="Consolas,monospace" font-weight="400">git pull --ff-only</text><text x="54" y="398.19000000000005" fill="#FFFFFF" font-size="9.0" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400"># Obsidian 里打开 REMINDER_NEW_DEVICE/vault</text><rect x="40" y="442" width="761.8897637795277" height="77" rx="8" fill="#FFF4D8" stroke="#FFF4D8"/><text x="54" y="461.632" fill="#A66700" font-size="10.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">同步与写入纪律</text><text x="54" y="478.885" fill="#16233D" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">Git 同步 Markdown 和已审核学习文件；私人备份另走安全渠道。未提交的手动笔记先保留并明确合并，不能靠 pull 覆盖。换机阅读可以；多台同时学习或写 vault 需要重新</text><text x="54" y="493.61" fill="#16233D" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">协调唯一写入者。</text></svg>