<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 841.8897637795277 595.2755905511812" role="img"><rect x="0" y="0" width="841.8897637795277" height="595.2755905511812" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><rect x="0" y="0" width="10" height="595.2755905511812" rx="0" fill="#333E57" stroke="#333E57"/><text x="40" y="30.055" fill="#52647C" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">REMINDER / PERSONAL LEARNING SYSTEM</text><rect x="619.8897637795277" y="17" width="182" height="23" rx="6" fill="#EEF1F7" stroke="#EEF1F7"/><text x="629.8897637795277" y="30.304000000000002" fill="#333E57" font-size="8.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">搭建 11 / 本机 Git 协调</text><text x="40" y="71.92" fill="#16233D" font-size="24" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">只提交审核过的学习成果</text><text x="40" y="95.549" fill="#52647C" font-size="10.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">当前使用独立公开知识发布副本隔离私有网站历史；不把整个工作分支直接推到公开仓库。</text><rect x="40" y="562.2755905511812" width="761.8897637795277" height="1" rx="0" fill="#DCE5F0" stroke="#DCE5F0"/><text x="40" y="576.6665905511811" fill="#52647C" font-size="7.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">核验基线 2026-10-05 14:07 CST | 实线=已有路径；虚线=待打通 / 建议配置</text><text x="755.8897637795277" y="577.3305905511811" fill="#16233D" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">29 / 36</text><rect x="40" y="132" width="510" height="195.728" rx="8" fill="#16233D" stroke="#16233D"/><text x="54" y="149.055" fill="#7ED7DF" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">Windows 唯一协调者 / PowerShell · 文件名按真实交付替换</text><text x="54" y="167.308" fill="#FFFFFF" font-size="7.6" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">git -C 完成/.pipeline/knowledge-publication status --short</text><text x="54" y="178.85999999999999" fill="#FFFFFF" font-size="7.6" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">git -C 完成/.pipeline/knowledge-publication diff --cached --name-only</text><text x="54" y="190.41199999999998" fill="#FFFFFF" font-size="7.6" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400"># 暂存区归属明确且已知；按本次审核文件逐个列出</text><text x="54" y="201.964" fill="#FFFFFF" font-size="7.6" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">git -C 完成/.pipeline/knowledge-publication add -- `</text><text x="54" y="213.516" fill="#FFFFFF" font-size="7.6" font-family="Consolas,monospace" font-weight="400">  PROJECT/guide.pdf PROJECT/guide.html `</text><text x="54" y="225.06799999999998" fill="#FFFFFF" font-size="7.6" font-family="Consolas,monospace" font-weight="400">  PROJECT/exercise/main.py PROJECT/experiment_log.txt `</text><text x="54" y="236.62" fill="#FFFFFF" font-size="7.6" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">  vault/项目笔记/PROJECT.md vault/概念/CONCEPT.md vault/00-总览.md</text><text x="54" y="248.172" fill="#FFFFFF" font-size="7.6" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">git -C 完成/.pipeline/knowledge-publication diff --cached --stat</text><text x="54" y="259.724" fill="#FFFFFF" font-size="7.6" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">git -C 完成/.pipeline/knowledge-publication diff --cached</text><text x="54" y="271.27599999999995" fill="#FFFFFF" font-size="7.6" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">git -C 完成/.pipeline/knowledge-publication commit -m &quot;learn: 项目指南与实测知识入库&quot;</text><text x="54" y="282.828" fill="#FFFFFF" font-size="7.6" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">git -C 完成/.pipeline/knowledge-publication push origin main</text><text x="54" y="294.38" fill="#FFFFFF" font-size="7.6" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">git -C 完成/.pipeline/knowledge-publication rev-parse HEAD</text><text x="54" y="305.932" fill="#FFFFFF" font-size="7.6" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">git -C 完成/.pipeline/knowledge-publication ls-remote origin refs/heads/main</text><text x="54" y="317.484" fill="#FFFFFF" font-size="7.6" font-family="Consolas,monospace" font-weight="400">python tools/reminder_coordinator.py release --owner coordinator_example</text><rect x="574" y="134" width="228" height="162" rx="10" fill="#EEF1F7" stroke="#333E57"/><rect x="574" y="134" width="5" height="162" rx="2" fill="#333E57" stroke="#333E57"/><text x="590" y="159.62" fill="#333E57" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">通过标准</text><text x="590" y="179.632" fill="#16233D" font-size="10.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">已核对指南、日志、笔记不含私密原记录</text><text x="590" y="195.752" fill="#16233D" font-size="10.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">。</text><text x="590" y="211.872" fill="#16233D" font-size="10.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">提交 hooks 通过。</text><text x="590" y="227.99200000000002" fill="#16233D" font-size="10.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">推送后的远端 main SHA 与本次 commit</text><text x="590" y="244.11200000000002" fill="#16233D" font-size="10.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">相同。</text><text x="590" y="260.232" fill="#16233D" font-size="10.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">账本再记 pushed + SHA。</text><rect x="574" y="317" width="228" height="130" rx="10" fill="#FFF4D8" stroke="#A66700"/><rect x="574" y="317" width="5" height="130" rx="2" fill="#A66700" stroke="#A66700"/><text x="590" y="342.62" fill="#A66700" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">出现拒绝或冲突</text><text x="590" y="362.549" fill="#16233D" font-size="10.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">保留本次文件与提交，先核对远端。</text><text x="590" y="378.51399999999995" fill="#16233D" font-size="10.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">共享工作区不自动 rebase / reset。</text><text x="590" y="394.479" fill="#16233D" font-size="10.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">不强推，不跳 hooks，不全仓 add。</text><rect x="40" y="464" width="761.8897637795277" height="64" rx="8" fill="#FFF4D8" stroke="#FFF4D8"/><text x="54" y="483.632" fill="#A66700" font-size="10.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">独立发布副本的初始化</text><text x="54" y="500.885" fill="#16233D" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">先 clone 已确认的公开知识仓库到上述目录；仅复制明确审核文件。新手自己 fork 时更新远端目标，核对仓库可见性，不能将私人学习内容默认公开。</text></svg>