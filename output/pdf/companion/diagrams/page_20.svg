<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 841.8897637795277 595.2755905511812" role="img"><rect x="0" y="0" width="841.8897637795277" height="595.2755905511812" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><rect x="0" y="0" width="10" height="595.2755905511812" rx="0" fill="#F07822" stroke="#F07822"/><text x="40" y="30.055" fill="#52647C" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">REMINDER / PERSONAL LEARNING SYSTEM</text><rect x="619.8897637795277" y="17" width="182" height="23" rx="6" fill="#FFF0E4" stroke="#FFF0E4"/><text x="629.8897637795277" y="30.304000000000002" fill="#F07822" font-size="8.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">搭建 02 / 阿里云服务器</text><text x="40" y="71.92" fill="#16233D" font-size="24" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">安装 Docker 与 Compose v2</text><text x="40" y="95.549" fill="#52647C" font-size="10.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">只在全新、获准运维的 Ubuntu ECS 执行。已有 Docker 时先检查版本，不混装或删除现有服务。</text><rect x="40" y="562.2755905511812" width="761.8897637795277" height="1" rx="0" fill="#DCE5F0" stroke="#DCE5F0"/><text x="40" y="576.6665905511811" fill="#52647C" font-size="7.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">核验基线 2026-10-05 14:07 CST | 实线=已有路径；虚线=待打通 / 建议配置</text><text x="755.8897637795277" y="577.3305905511811" fill="#16233D" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">20 / 36</text><text x="40" y="552.5005905511812" fill="#52647C" font-size="7.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">依据：Docker 官方 Ubuntu 安装步骤 [S6]；项目使用 Compose v2</text><rect x="40" y="130" width="761.8897637795277" height="256.224" rx="8" fill="#16233D" stroke="#16233D"/><text x="54" y="147.055" fill="#7ED7DF" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">阿里云服务器 / Bash · 官方 APT 仓库安装</text><text x="54" y="166.138" fill="#FFFFFF" font-size="8.6" font-family="Consolas,monospace" font-weight="400">sudo apt update</text><text x="54" y="179.21" fill="#FFFFFF" font-size="8.6" font-family="Consolas,monospace" font-weight="400">sudo apt install -y ca-certificates curl git</text><text x="54" y="192.282" fill="#FFFFFF" font-size="8.6" font-family="Consolas,monospace" font-weight="400">sudo install -m 0755 -d /etc/apt/keyrings</text><text x="54" y="205.354" fill="#FFFFFF" font-size="8.6" font-family="Consolas,monospace" font-weight="400">sudo curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc</text><text x="54" y="218.42600000000002" fill="#FFFFFF" font-size="8.6" font-family="Consolas,monospace" font-weight="400">sudo chmod a+r /etc/apt/keyrings/docker.asc</text><text x="54" y="231.49800000000002" fill="#FFFFFF" font-size="8.6" font-family="Consolas,monospace" font-weight="400">sudo tee /etc/apt/sources.list.d/docker.sources &lt;&lt;EOF</text><text x="54" y="244.57" fill="#FFFFFF" font-size="8.6" font-family="Consolas,monospace" font-weight="400">Types: deb</text><text x="54" y="257.642" fill="#FFFFFF" font-size="8.6" font-family="Consolas,monospace" font-weight="400">URIs: https://download.docker.com/linux/ubuntu</text><text x="54" y="270.714" fill="#FFFFFF" font-size="8.6" font-family="Consolas,monospace" font-weight="400">Suites: $(. /etc/os-release &amp;&amp; echo &quot;${UBUNTU_CODENAME:-$VERSION_CODENAME}&quot;)</text><text x="54" y="283.786" fill="#FFFFFF" font-size="8.6" font-family="Consolas,monospace" font-weight="400">Components: stable</text><text x="54" y="296.858" fill="#FFFFFF" font-size="8.6" font-family="Consolas,monospace" font-weight="400">Architectures: $(dpkg --print-architecture)</text><text x="54" y="309.93" fill="#FFFFFF" font-size="8.6" font-family="Consolas,monospace" font-weight="400">Signed-By: /etc/apt/keyrings/docker.asc</text><text x="54" y="323.00199999999995" fill="#FFFFFF" font-size="8.6" font-family="Consolas,monospace" font-weight="400">EOF</text><text x="54" y="336.07399999999996" fill="#FFFFFF" font-size="8.6" font-family="Consolas,monospace" font-weight="400">sudo apt update</text><text x="54" y="349.14599999999996" fill="#FFFFFF" font-size="8.6" font-family="Consolas,monospace" font-weight="400">sudo apt install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin</text><text x="54" y="362.21799999999996" fill="#FFFFFF" font-size="8.6" font-family="Consolas,monospace" font-weight="400">sudo docker compose version</text><text x="54" y="375.28999999999996" fill="#FFFFFF" font-size="8.6" font-family="Consolas,monospace" font-weight="400">sudo docker run --rm hello-world</text><rect x="40" y="462" width="761.8897637795277" height="64" rx="8" fill="#FFF0E4" stroke="#FFF0E4"/><text x="54" y="481.632" fill="#F07822" font-size="10.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">预期结果</text><text x="54" y="498.885" fill="#16233D" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">docker compose version 返回 v2 或更新的官方插件；hello-world 给出成功输出。容器端口仍按本项目绑定 127.0.0.1，不通过开放 8787 公网端口解决连通问题。</text></svg>