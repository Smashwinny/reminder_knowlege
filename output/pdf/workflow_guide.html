ht="700">01 / 36</text><text x="40" y="170.88" fill="#16233D" font-size="36" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">一个链接的价值，</text><text x="40" y="216.9" fill="#764FE3" font-size="30" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">在它进入你的知识网络之后。</text><text x="42" y="262.45" fill="#16233D" font-size="15" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">手机随手记录 → 核实原始来源 → 云端真实实验与图文讲解</text><text x="42" y="287.45" fill="#16233D" font-size="15" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">→ 私有报告 → 本机知识入库 → Git 备份 → 主动复习。</text><rect x="537" y="139" width="265" height="185" rx="10" fill="#EAF2FF" stroke="#2875EA"/><rect x="537" y="139" width="5" height="185" rx="2" fill="#2875EA" stroke="#2875EA"/><text x="553" y="164.62" fill="#2875EA" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">这份指南回答四个问题</text><text x="553" y="185.96" fill="#16233D" font-size="12" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">它做到了什么？</text><text x="553" y="204.56" fill="#16233D" font-size="12" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">数据和智能体在哪里运行？</text><text x="553" y="223.16" fill="#16233D" font-size="12" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">如何从零搭建并验证？</text><text x="553" y="241.76000000000002" fill="#16233D" font-size="12" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">如何把结果变成自己的能力？</text><rect x="42" y="374" width="132" height="73" rx="10" fill="#E6F8F3" stroke="#009F8B"/><rect x="42" y="374" width="5" height="73" rx="2" fill="#009F8B" stroke="#009F8B"/><text x="58" y="399.62" fill="#009F8B" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">捕获</text><text x="58" y="418.636" fill="#16233D" font-size="9.2" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">记录 → 证据</text><polyline points="174,409 193,409" fill="none" stroke="#009F8B" stroke-width="1.65"/><po  x="662" y="399.62" fill="#087B68" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">复习</text><text x="662" y="418.636" fill="#16233D" font-size="9.2" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">回忆 → 应用</text><rect x="40" y="464" width="761.8897637795277" height="64" rx="8" fill="#FFF4D8" stroke="#FFF4D8"/><text x="54" y="483.632" fill="#A66700" font-size="10.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">阅读约定</text><text x="54" y="500.885" fill="#16233D" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">前半部适合向伙伴展示；后半部是逐终端搭建手册。事实、当前限制与未来路线分别标注。本 PDF 不包含任何密码、令牌、私有 SSH 连接信息或私人任务正文。</text></svg></section><section class="page" id="p2"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 841.8897637795277 595.2755905511812" role="img"><rect x="0" y="0" width="841.8897637795277" height="595.2755905511812" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><rect x="0" y="0" width="10" height="595.2755905511812" rx="0" fill="#764FE3" stroke="#764FE3"/><text x="40" y="30.055" fill="#52647C" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">REMINDER / PERSONAL LEARNING SYSTEM</text><rect x="619.8897637795277" y="17" width="182" height="23" rx="6" fill="#F0EAFF" stroke="#F0EAFF"/><text x="629.8897637795277" y="30.304000000000002" fill="#764FE3" font-size="8.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">01 / 项目价值</text><text x="40" y="71.92" fill="#16233D" font-size="24" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">把“存了很多”转成“真的会用”</text><text x="40" y="95.549" fill="#52647C" font-size="10.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">这是一套个人学习流水线：连接已有工具，并给每次学习建立可回溯的交付标准。</text><rect x="40" y="562.2755905511812" width="761.8897637795277" height="1" rx="0" fill="#DCE5F0" stroke="#DCE5F0"/><text x="40" y="576.6665905511811" fill="#52647C" font-size="7.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">核验基线 2026-10-05 14:07 CST | 实线=已有路径；虚线=待打通 / 建议配置</text><text x="755.8897637795277" y="577.3305905511811" fill="#16233D" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">02 / 36</text><text x="40" y="552.5005905511812" fill="#52647C" font-size="7.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">依据：AGENTS.md；learn-project；三项公开学习提交</text><rect x="40" y="133" width="246" height="160" rx="10" fill="#E6F8F3" stroke="#009F8B"/><rect x="40" y="133" width="5" height="160" rx="2" fill="#009F8B" stroke="#009F8B"/><text x="56" y="158.62" fill="#009F8B" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">输入不再零散</text><text x="56" y="178.549" fill="#16233D" font-size="10.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">手机看到链接时只需保存。原帖、摘要、来源</text><text x="56" y="194.514" fill="#16233D" font-size="10.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">和后续产物保持同一条任务的关联。</text><rect x="298" y="133" width="246" height="160" rx="10" fill="#F0EAFF" stroke="#764FE3"/><rect x="298" y="133" width="5" height="160" rx="2" fill="#764FE3" stroke="#764FE3"/><text x="314" y="158.62" fill="#764FE3" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">理解不只靠摘要</text><text x="314" y="178.549" fill="#16233D" font-size="10.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">围绕你的知识储备列疑问，用图和例子讲原理</text><text x="314" y="194.514" fill="#16233D" font-size="10.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">，实际运行实验，明确能力边界。</text><rect x="556" y="133" width="246" height="160" rx="10" fill="#E7F6EF" stroke="#087B68"/><rect x="556" y="133" width="5" height="160" rx="2" fill="#087B68" stroke="#087B68"/><text x="572" y="158.62" fill="#087B68" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">知识不再孤立</text><text x="572" y="178.549" fill="#16233D" font-size="10.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">新概念查重，项目笔记链接已有概念；可在</text><text x="572" y="194.514" fill="#16233D" font-size="10.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">Obsidian 沿关联复习和迁移到下一项目。</text><rect x="40" y="315" width="761.8897637795277" height="30" rx="6" fill="#16233D" stroke="#16233D"/><text x="51" y="331.885" fill="#FFFFFF" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">已经证明的能力</text><text x="286" y="331.885" fill="#FFFFFF" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">实际证据</text><text x="541" y="331.885" fill="#FFFFFF" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">尚不能据此证明</text><rect x="40" y="345" width="761.8897637795277" height="32.0" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><text x="51" y="361.3" fill="#16233D" font-size="10" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">跨端完整学习闭环</text><text x="286" y="361.3" fill="#16233D" font-size="10" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">3 个项目已网站交付、回迁、入库并推送 Git</text><text x="541" y="361.3" fill="#16233D" font-size="10" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">所有链接都可读取；全流程永久无人值守</text><rect x="40" y="377.0" width="761.8897637795277" height="32.0" rx="0" fill="#EDF2FA" stroke="#EDF2FA"/><text x="51" y="393.3" fill="#16233D" font-size="10" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">云端连续推进</text><text x="286" y="393.3" fill="#16233D" font-size="10" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">第 4 项 Colab 完整报告已存；Metrik 正在学习</text><text x="541" y="393.3" fill="#16233D" font-size="10" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">每 15 分钟完成一份报告</text><rect x="40" y="409.0" width="761.8897637795277" height="32.0" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><text x="51" y="425.3" fill="#16233D" font-size="10" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">可核查的交付质量</text><text x="286" y="425.3" fill="#16233D" font-size="10" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">真实实验日志、逐页 PDF 与独立审核</text><text x="541" y="425.3" fill="#16233D" font-size="10" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">AI 报告等于本人已掌握</text><rect x="40" y="463" width="761.8897637795277" height="64" rx="8" fill="#F0EAFF" stroke="#F0EAFF"/><text x="54" y="482.632" fill="#764FE3" font-size="10.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">向伙伴解释时的一句话</text><text x="54" y="499.885" fill="#16233D" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">“我把随手收集的项目，交给云端智能体做有证据的学习资料；再把新知识合并到自己的知识网，并用练习和复习检验是否掌握。”</text></svg></section><section class="page" id="p3"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 841.8897637795277 595.2755905511812" role="img"><rect x="0" y="0" width="841.8897637795277" height="595.2755905511812" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><rect x="0" y="0" width="10" height="595.2755905511812" rx="0" fill="#2875EA" stroke="#2875EA"/><text x="40" y="30.055" fill="#52647C" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">REMINDER / PERSONAL LEARNING SYSTEM</text><rect x="619.8897637795277" y="17" width="182" height="23" rx="6" fill="#EAF2FF" stroke="#EAF2FF"/><text x="629.8897637795277" y="30.304000000000002" fill="#2875EA" font-size="8.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">阅读地图</text><text x="40" y="71.92" fill="#16233D" font-size="24" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">先看框图，再照终端动手</text><text x="40" y="95.549" fill="#52647C" font-size="10.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">颜色代表运行环境；状态标记代表实际完成程度。不要把位置、权限和成功状态混在一起。</text><rect x="40" y="562.2755905511812" width="761.8897637795277" height="1" rx="0" fill="#DCE5F0" stroke="#DCE5F0"/><text x="40" y="576.6665905511811" fill="#52647C" font-size="7.7" font-family="Microsoft YaH 647C" font-size="9.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">电脑离线：Dot 仍可云端学习，报告先留网站。本机再次在线：备份脚本拉取；知识入库和 Git 需要协调者接续。原生自动唤醒当前未通过。</text></svg></section><section class="page" id="p5"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 841.8897637795277 595.2755905511812" role="img"><rect x="0" y="0" width="841.8897637795277" height="595.2755905511812" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><rect x="0" y="0" width="10" height="595.2755905511812" rx="0" fill="#D74554" stroke="#D74554"/><text x="40" y="30.055" fill="#52647C" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">REMINDER / PERSONAL LEARNING SYSTEM</text><rect x="619.8897637795277" y="17" width="182" height="23" rx="6" fill="#FDECEF" stroke="#FDECEF"/><text x="629.8897637795277" y="30.304000000000002" fill="#D74554" font-size="8.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">职责表</text><text x="40" y="71.92" fill="#16233D" font-size="24" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">每个终端到底运行什么</text><text x="40" y="95.549" fill="#52647C" font-size="10.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">“Ubuntu 本地”是管理员电脑；“阿里云服务器”即使运行 Linux，也不是这台本地 Ubuntu。</text><rect x="40" y="562.2755905511812" width="761.8897637795277" height="1" rx="0" fill="#DCE5F0" stroke="#DCE5F0"/><text x="40" y="576.6665905511811" fill="#52647C" font-size="7.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">核验基线 2026-10-05 14:07 CST | 实线=已有路径；虚线=待打通 / 建议配置</text><text x="755.8897637795277" y="577.3305905511811" fill="#16233D" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">05 / 36</text><rect x="40" y="130" width="761.8897637795277" height="30" rx="6" fill="#16233D" stroke="#16233D"/><text x="51" y="146.885" fill="#FFFFFF" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">位置</text><text x="167" y="146.885" fill="#FFFFFF" font-size="9.5" font-fa crosoft YaHei,Arial,sans-serif" font-weight="400">本人 Dot + MCP 插件 + 云端实验目录</text><text x="421" y="238.768" fill="#16233D" font-size="9.6" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">获准任务 → 分类 / 真实学习 / 六类原件</text><text x="701" y="238.768" fill="#16233D" font-size="9.6" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">云端学习者 + 独立审</text><text x="701" y="253.168" fill="#16233D" font-size="9.6" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">核者</text><rect x="40" y="268.6" width="761.8897637795277" height="31.4" rx="0" fill="#EDF2FA" stroke="#EDF2FA"/><text x="51" y="284.56800000000004" fill="#16233D" font-size="9.6" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">Ubuntu 本地</text><text x="167" y="284.56800000000004" fill="#16233D" font-size="9.6" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">私有网站 Git 副本、SSH、异机备份检查</text><text x="421" y="284.56800000000004" fill="#16233D" font-size="9.6" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">已审核代码 → 部署；服务器备份 → 私有副本</text><text x="701" y="284.56800000000004" fill="#16233D" font-size="9.6" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">唯一网站维护者</text><rect x="40" y="300.0" width="761.8897637795277" height="31.4" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><text x="51" y="315.968" fill="#16233D" font-size="9.6" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">Windows 本地</text><text x="167" y="315.968" fill="#16233D" font-size="9.6" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">tools/；完成/.pipeline/；项目目录；vault/</text><text x="421" y="315.968" fill="#16233D" font-size="9.6" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">云端原件 → 校验副本 → 入库与公开 Git</text><text x="701" y="315.968" fill="#16233D" font-size="9.6" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">唯一知识协调者</text><rect x="40" y="331.4" width="761.8897637795277" height="31.4" rx="0" fill="#EDF2FA" stroke="#EDF2FA"/><text x="51" y="347.368" fill="#16233D" font-size="9.6" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">GitHub 远端</text><text x="167" y="347.368" fill="#16233D" font-size="9.6" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">reminder 私有代码仓；reminder_knowlege 公开仓</text><text x="421" y="347.368" fill="#16233D" font-size="9.6" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">代码发布与运维协作；学习成果版本化</text><text x="701" y="347.368" fill="#16233D" font-size="9.6" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">两类仓库分别管理</text><rect x="40" y="459" width="761.8897637795277" height="65" rx="8" fill="#E7F6EF" stroke="#E7F6EF"/><text x="54" y="478.632" fill="#087B68" font-size="10.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">Obsidian 的位置</text><text x="54" y="495.885" fill="#16233D" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">当前 Obsidian 使用 Windows 的 F:\reminder\vault。Ubuntu 不是另一份可同时写入的最终知识库；多设备学习前必须协调任务租约和唯一写入者。</text></svg></section><section class="page" id="p6"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 841.8897637795277 595.2755905511812" role="img"><rect x="0" y="0" width="841.8897637795277" height="595.2755905511812" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><rect x="0" y="0" width="10" height="595.2755905511812" rx="0" fill="#009F8B" stroke="#009F8B"/><text x="40" y="30.055" fill="#52647C" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">REMINDER / PERSONAL LEARNING SYSTEM</text><rect x="619.8897637795277" y="17" width="182" height="23" rx="6" fill="#E6F8F3" stroke="#E6F8F3"/><text x="629.8897637795277" y="30.304000000000002" fill="#009F8B" font-size="8.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">手机记录入口</text><text x="40" y="71.92" fill="#16233D" font-size="24" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">从 X 或抖音开始：先把链接留住</text><text x="40" y="95.549" fill="#52647C" font-size="10.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">本项目已核对的手机入口是复制后粘贴；当前 Android Manifest 没有原生 ACTION_SEND 分享接收器。</text><rect x="40" y="562.2755905511812" width="761.8897637795277" height="1" rx="0" fill="#DCE5F0" stroke="#DCE5F0"/><text x="40" y="576.6665905511811" fill="#52647C" font-size="7.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">核验基线 2026-10-05 14:07 CST | 实线=已有路径；虚线=待打通 / 建议配置</text><text x="755.8897637795277" y="577.3305905511811" fill="#16233D" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">06 / 36</text><text x="40" y="552.5005905511812" fill="#52647C" font-size="7.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">依据：AndroidManifest.xml；网站 onlyUrl / fetchPage 代码</text><rect x="40" y="139" width="246" height="166" rx="10" fill="#E6F8F3" stroke="#009F8B"/><rect x="40" y="139" width="5" height="166" rx="2" fill="#009F8B" stroke="#009F8B"/><text x="56" y="164.62" fill="#009F8B" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">01 · 复制原始链接</text><text x="56" y="185.13" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">在 X 或抖音选择复制链接。保存作者、主题</text><text x="56" y="202.18" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">和你想学什么，避免以后只剩一条无法辨认</text><text x="56" y="219.23" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">的短链。</text><rect x="298" y="139" width="246" height="166" rx="10" fill="#E6F8F3" stroke="#009F8B"/><rect x="298" y="139" width="5" height="166" rx="2" fill="#009F8B" stroke="#009F8B"/><text x="314" y="164.62" fill="#009F8B" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">02 · 在拾遗保存</text><text x="314" y="185.13" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">手机 App 或网站登录本人账号，粘贴并保</text><text x="314" y="202.18" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">存。若想触发站点自动摘要，任务正文需是</text><text x="314" y="219.23" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">单个纯 HTTP(S) 链接。</text><rect x="556" y="139" width="246" height="166" rx="10" fill="#E6F8F3" stroke="#009F8B"/><rect x="556" y="139" width="5" height="166" rx="2" fill="#009F8B" stroke="#009F8B"/><text x="572" y="164.62" fill="#009F8B" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">03 · 进入允许列表</text><text x="572" y="185.13" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">在网站 /dot 管理页把任务加入本人获准清</text><text x="572" y="202.18" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">单。是否自动加入今后新增未开始记录，需</text><text x="572" y="219.23" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">要单独配置并回读。</text><polyline points="286,220 298,220" fill="none" stroke="#009F8B" stroke-width="1.65"/><polygon points="298,220 290.0,216.0 290.0,224.0" fill="#009F8B"/><polyline points="544,220 556,220" fill="none" stroke="#009F8B" stroke-width="1.65"/><polygon points="556,220 548.0,216.0 548.0,224.0" fill="#009F8B"/><rect x="40" y="338" width="367" height="103" rx="10" fill="#FFF0E4" stroke="#F07822"/><rect x="40" y="338" width="5" height="103" rx="2" fill="#F07822" stroke="#F07822"/><text x="56" y="363.62" fill="#F07822" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">X：可读取文字 ≠ 已核实全部内容</text><text x="56" y="383.632" fill="#16233D" font-size="10.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">站点摘要有第三方 X 文本接口作为候选读取途径；Dot 仍需核对作者、帖</text><text x="56" y="399.752" fill="#16233D" font-size="10.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">子中的真实出链及官方仓库。</text><rect x="428" y="338" width="374" height="103" rx="10" fill="#FFF4D8" stroke="#A66700"/><rect x="428" y="338" width="5" height="103" rx="2" fill="#A66700" stroke="#A66700"/><text x="444" y="363.62" fill="#A66700" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">抖音：短链 ≠ 自动转录视频</text><text x="444" y="383.632" fill="#16233D" font-size="10.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">当前站点读公开网页文字，没有已验收的视频下载 / ASR 流程。受阻时补</text><text x="444" y="399.752" fill="#16233D" font-size="10.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">字幕、笔记或明确的项目链接，保留待核实。</text><rect x="40" y="463" width="761.8897637795277" height="64" rx="8" fill="#FFF4D8" stroke="#FFF4D8"/><text x="54" y="482.632" fill="#A66700" font-size="10.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">第一次试用的成功标准</text><text x="54" y="499.885" fill="#16233D" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">在手机保存一条你确实有权分享、来源可读的学习链接；在电脑网站同一账号能回读同一条记录。不要用“摘要已显示”作为视频内容完整读取的证明。</text></svg></section><section class="page" id="p7"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 841.8897637795277 595.2755905511812" role="img"><rect x="0" y="0" width="841.8897637795277" height="595.2755905511812" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><rect x="0" y="0" width="10" height="595.2755905511812" rx="0" fill="#F07822" stroke="#F07822"/><text x="40" y="30.055" fill="#52647C" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">REMINDER / PERSONAL LEARNING SYSTEM</text><rect x="619.8897637795277" y="17" width="182" height="23" rx="6" fill="#FFF0E4" stroke="#FFF0E4"/><text x="629.8897637795277" y="30.304000000000002" fill="#F07822" font-size="8.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">权限与私密性</text><text x="40" y="71.92" fill="#16233D" font-size="24" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">服务端限制范围，不靠一句“请保密”</text><text x="40" y="95.549" fill="#52647C" font-size="10.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">当前授权边界是本人同意的私有 OAuth 连接，不是可认证的“唯一 Dot 身份”。</text><rect x="40" y="562.2755905511812" width="761.8897637795277" height="1" rx="0" fill="#DCE5F0" stroke="#DCE5F0"/><text x="40" y="576.6665905511811" fill="#52647C" font-size="7.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">核验基线 2026-10-05 14:07 CST | 实线=已有路径；虚线=待打通 / 建议配置</text><text x="755.8897637795277" y="577.3305905511811" fill="#16233D" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">07 / 36</text><text x="40" y="552.5005905511812" fill="#52647C" font-size="7.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">依据：DOT_INTEGRATION.md；官方 OAuth 文档 [S3]</text><rect x="40" y="137" width="230" height="132" rx="10" fill="#E6F8F3" stroke="#009F8B"/><rect x="40" y="137" width="5" height="132" rx="2" fill="#009F8B" stroke="#009F8B"/><text x="56" y="162.62" fill="#009F8B" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">本人同意</text><text x="56" y="183.13" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">登录自己的 Reminder 账户</text><text x="56" y="200.18" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">选择一个服务端列表</text><text x="56" y="217.23" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">确认三个 scope 后 OAuth 同意</text><rect x="306" y="137" width="230" height="132" rx="10" fill="#FFF0E4" stroke="#F07822"/><rect x="306" y="137" width="5" height="132" rx="2" fill="#F07822" stroke="#F07822"/><text x="322" y="162.62" fill="#F07822" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">服务端执行范围</text><text x="322" y="183.13" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">固定 canonical 账户 ID</text><text x="322" y="200.18" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">绑定 listId / resource / 期限</text><text x="322" y="217.23" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">每次工具请求检查权限</text><rect x="572" y="137" width="230" height="132" rx="10" fill="#F0EAFF" stroke="#764FE3"/><rect x="572" y="137" width="5" height="132" rx="2" fill="#764FE3" stroke="#764FE3"/><text x="588" y="162.62" fill="#764FE3" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">Dot 只拿必要工具</text><text x="588" y="183.13" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">records.read：读取</text><text x="588" y="200.18" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">analysis.write：分类报告</text><text x="588" y="217.23" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">learning.write：完整产物</text><polyline points="270,202 306,202" fill="none" stroke="#F07822" stroke-width="1.65"/><polygon points="306,202 298.0,198.0 298.0,206.0" fill="#F07822"/><polyline points="536,202 572,202" fill="none" stroke="#764FE3" stroke-width="1.65"/><polygon points="572,202 564.0,198.0 564.0,206.0" fill="#764FE3"/><rect x="40" y="310" width="761.8897637795277" height="30" rx="6" fill="#16233D" stroke="#16233D"/><text x="51" y="326.885" fill="#FFFFFF" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">数据类型</text><text x="386" y="326.885" fill="#FFFFFF" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">网站 / 本机</text><text x="608" y="326.885" fill="#FFFFFF" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">公开知识 Git</text><rect x="40" y="340" width="761.8897637795277" height="32.3" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><text x="51" y="356.466" fill="#16233D" font-size="10.2" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">私密任务正文、分类报告、授权和运行账本</text><text x="386" y="356.466" fill="#16233D" font-size="10.2" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">私有存储；按权限访问</text><text x="608" y="356.466" fill="#16233D" font-size="10.2" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">不提交</text><rect x="40" y="372.3" width="761.8897637795277" height="32.3" rx="0" fill="#EDF2FA" stroke="#EDF2FA"/><text x="51" y="388.766" fill="#16233D" font-size="10.2" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">脱敏后的 PDF、HTML、实验与合并知识笔记</text><text x="386" y="388.766" fill="#16233D" font-size="10.2" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">保留原件及审核记录</text><text x="608" y="388.766" fill="#16233D" font-size="10.2" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">明确检查后才提交</text><rect x="40" y="404.6" width="761.8897637795277" height="32.3" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><text x="51" y="421.06600000000003" fill="#16233D" font-size="10.2" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">密码、会话 token、OAuth 凭据、服务配置</text><text x="386" y="421.06600000000003" fill="#16233D" font-size="10.2" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">各自环境内保管；不可进入报告</text><text x="608" y="421.06600000000003" fill="#16233D" font-size="10.2" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">不提交</text><rect x="40" y="464" width="761.8897637795277" height="64" rx="8" fill="#FFF4D8" stroke="#FFF4D8"/><text x="54" y="483.632" fill="#A66700" font-size="10.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">额外电脑连接是另一个权限</text><text x="54" y="500.885" fill="#16233D" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">官方支持 Dot 连接个人电脑，但它扩大了能力范围。网站只准访问某个列表，并不能约束 Dot 在其他已连接应用或电脑中的全部权限。</text></svg></section><section class="page" id="p8"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 841.8897637795277 595.2755905511812" role="img"><rect x="0" y="0" width="841.8897637795277" height="595.2755905511812" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><rect x="0" y="0" width="10" height="595.2755905511812" rx="0" fill="#F07822" stroke="#F07822"/><text x="40" y="30.055" fill="#52647C" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">REMINDER / PERSONAL LEARNING SYSTEM</text><rect x="619.8897637795277" y="17" width="182" height="23" rx="6" fill="#FFF0E4" stroke="#FFF0E4"/><text x="629.8897637795277" y="30.304000000000002" fill="#F07822" font-size="8.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">两段大模型链路</text><text x="40" y="71.92" fill="#16233D" font-size="24" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">网站摘要与 Dot 完整学习：目的不同</text><text x="40" y="95.549" fill="#52647C" font-size="10.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">网站摘要帮助找回“这是什么”；Dot 的学习流程帮助回答“我能理解并运用什么”。</text><rect x="40" y="562.2755905511812" width="761.8897637795277" height="1" rx="0" fill="#DCE5F0" stroke="#DCE5F0"/><text x="40" y="576.6665905511811" fill="#52647C" font-size="7.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">核验基线 2026-10-05 14:07 CST | 实线=已有路径；虚线=待打通 / 建议配置</text><text x="755.8897637795277" y="577.3305905511811" fill="#16233D" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">08 / 36</text><text x="40" y="552.5005905511812" fill="#52647C" font-size="7.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">依据：server.js 摘要队列；learn-project</text><rect x="40" y="138" width="177" height="125" rx="10" fill="#E6F8F3" stroke="#009F8B"/><rect x="40" y="138" width="5" height="125" rx="2" fill="#009F8B" stroke="#009F8B"/><text x="56" y="163.62" fill="#009F8B" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">原始链接</text><text x="56" y="184.13" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">手机保存</text><text x="56" y="201.18" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">进入本人任务</text><text x="56" y="218.23" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">记录来源版本</text><rect x="289" y="138" width="513" height="125" rx="10" fill="#FFF0E4" stroke="#F07822"/><rect x="289" y="138" width="5" height="125" rx="2" fill="#F07822" stroke="#F07822"/><text x="305" y="163.62" fill="#F07822" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">路径 A · 站点摘要</text><text x="305" y="182.304" fill="#F07822" font-size="8.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">运行：阿里云服务；模型请求：Kimi API</text><text x="305" y="205.13" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">阿里云抓取公开网页文本；X 可尝试第三方文本接口 → 配置了 Kimi Key 时调用摘要模型 → 写中</text><text x="305" y="222.18" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">文摘要。失败保留任务或回退网页摘录。</text><polyline points="217,183 289,183" fill="none" stroke="#F07822" stroke-width="1.65"/><polygon points="289,183 281.0,179.0 281.0,187.0" fill="#F07822"/><rect x="219" y="162" width="38.099999999999994" height="17" rx="3" fill="#FFFFFF" stroke="#FFFFFF"/><text x="225" y="171.221" fill="#F07822" font-size="8.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">纯链接</text><rect x="289" y="319" width="513" height="139" rx="10" fill="#F0EAFF" stroke="#764FE3"/><rect x="289" y="319" width="5" height="139" rx="2" fill="#764FE3" stroke="#764FE3"/><text x="305" y="344.62" fill="#764FE3" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">路径 B · 深度学习</text><text x="305" y="363.304" fill="#764FE3" font-size="8.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">运行：Dot 云端电脑</text><text x="305" y="386.13" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">Dot 经 OAuth/MCP 读取获准任务 → 再核实原文和官方来源 → 调用学习方法 → 执行实验与独立</text><text x="305" y="403.18" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">审核 → 保存完整报告。不会只把摘要再改写一遍当作学习完成。</text><polyline points="127,263 127,388 289,388" fill="none" stroke="#764FE3" stroke-width="1.65"/><polygon points="289,388 281.0,384.0 281.0,392.0" fill="#764FE3"/><rect x="134" y="363" width="72.9" height="17" rx="3" fill="#FFFFFF" stroke="#FFFFFF"/><text x="140" y="372.221" fill="#764FE3" font-size="8.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">获准列表的任务</text><rect x="40" y="464" width="761.8897637795277" height="64" rx="8" fill="#FFF4D8" stroke="#FFF4D8"/><text x="54" y="483.632" fill="#A66700" font-size="10.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">费用与准确性分别控制</text><text x="54" y="500.885" fill="#16233D" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">摘要 API 有站点日限额；Dot 学习还受账户额度、工具与实验环境影响。摘要额度不能作为完整学习成本上限，第三方文本也不能代替作者或官方证据。</text></svg></section><section class="page" id="p9"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 841.8897637795277 595.2755905511812" role="img"><rect x="0" y="0" width="841.8897637795277" height="595.2755905511812" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><rect x="0" y="0" width="10" height="595.2755905511812" rx="0" fill="#764FE3" stroke="#764FE3"/><text x="40" y="30.055" fill="#52647C" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">REMINDER / PERSONAL LEARNING SYSTEM</text><rect x="619.8897637795277" y="17" width="182" height="23" rx="6" fill="#F0EAFF" stroke="#F0EAFF"/><text x="629.8897637795277" y="30.304000000000002" fill="#764FE3" font-size="8.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">分类与任务状态</text><text x="40" y="71.92" fill="#16233D" font-size="24" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">先路由，再学习；“完成”仍由本人决定</text><text x="40" y="95.549" fill="#52647C" font-size="10.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">分类阶段必须记录来源、判断依据、已有知识关联、下一步和未确认事项。</text><rect x="40" y="562.2755905511812" width="761.8897637795277" height="1" rx="0" fill="#DCE5F0" stroke="#DCE5F0"/><text x="40" y="576.6665905511811" fill="#52647C" font-size="7.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">核验基线 2026-10-05 14:07 CST | 实线=已有路径；虚线=待打通 / 建议配置</text><text x="755.8897637795277" y="577.3305905511811" fill="#16233D" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">09 / 36</text><rect x="40" y="132" width="761.8897637795277" height="30" rx="6" fill="#16233D" stroke="#16233D"/><text x="51" y="148.885" fill="#FFFFFF" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">分类</text><text x="241" y="148.885" fill="#FFFFFF" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">具体判据</text><text x="581" y="148.885" fill="#FFFFFF" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">下一步</text><rect x="40" y="162" width="761.8897637795277" height="32.0" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><text x="51" y="178.3" fill="#16233D" font-size="10" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">learning / 学习</text><text x="241" y="178.3" fill="#16233D" font-size="10" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">知识、教程、论文、原理或项目已核实</text><text x="581" y="178.3" fill="#16233D" font-size="10" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">可领取且有权限时进入完整学习</text><rect x="40" y="194.0" width="761.8897637795277" height="32.0" rx="0" fill="#EDF2FA" stroke="#EDF2FA"/><text x="51" y="210.3" fill="#16233D" font-size="10" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">non_learning / 非学习</text><text x="241" y="210.3" fill="#16233D" font-size="10" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">实质内容已读，确无本次学习主题</text><text x="581" y="210.3" fill="#16233D" font-size="10" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">保存理由与相应标签</text><rect x="40" y="226.0" width="761.8897637795277" height="32.0" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><text x="51" y="242.3" fill="#16233D" font-size="10" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">duplicate / 重复增补</text><text x="241" y="242.3" fill="#16233D" font-size="10" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">已学过相同内容，但需核对版本和差异</text><text x="581" y="242.3" fill="#16233D" font-size="10" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">关联既有指南，只分析增补价值</text><rect x="40" y="258.0" width="761.8897637795277" height="32.0" rx="0" fill="#EDF2FA" stroke="#EDF2FA"/><text x="51" y="274.3" fill="#16233D" font-size="10" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">needs_review / 证据不足</text><text x="241" y="274.3" fill="#16233D" font-size="10" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">原文 / 目标身份 / 出链未确认</text><text x="581" y="274.3" fill="#16233D" font-size="10" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">补证据，不强行绑定搜索命中</text><rect x="40" y="290.0" width="761.8897637795277" height="32.0" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><text x="51" y="306.3" fill="#16233D" font-size="10" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">blocked / 环境受阻</text><text x="241" y="306.3" fill="#16233D" font-size="10" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">目标明确，但执行或审核条件不足</text><text x="581" y="306.3" fill="#16233D" font-size="10" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">写具体阻碍；同源不重复启动</text><rect x="40" y="322.0" width="761.8897637795277" height="32.0" rx="0" fill="#EDF2FA" stroke="#EDF2FA"/><text x="51" y="338.3" fill="#16233D" font-size="10" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">non_link / 非链接</text><text x="241" y="338.3" fill="#16233D" font-size="10" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">原记录没有 HTTP(S)/www 链接</text><text x="581" y="338.3" fill="#16233D" font-size="10" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">按正文处理；不等于无学习价值</text><rect x="40" y="462" width="761.8897637795277" height="66" rx="8" fill="#FFF0E4" stroke="#FFF0E4"/><text x="54" y="481.632" fill="#F07822" font-size="10.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">两条状态轴</text><text x="54" y="498.885" fill="#16233D" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">分析标签：已完成完整分析 / 初步判定非项目学习类 / 非链接类，以及待核实等补充标签。任务状态：未开始 / 进行中 / 用户完成。智能体不调用旧 publish、done、viewed</text><text x="54" y="513.61" fill="#16233D" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">来勾选任务。</text></svg></section><section class="page" id="p10"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 841.8897637795277 595.2755905511812" role="img"><rect x="0" y="0" width="841.8897637795277" height="595.2755905511812" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><rect x="0" y="0" width="10" height="595.2755905511812" rx="0" fill="#764FE3" stroke="#764FE3"/><text x="40" y="30.055" fill="#52647C" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">REMINDER / PERSONAL LEARNING SYSTEM</text><rect x="619.8897637795277" y="17" width="182" height="23" rx="6" fill="#F0EAFF" stroke="#F0EAFF"/><text x="629.8897637795277" y="30.304000000000002" fill="#764FE3" font-size="8.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">云端调度与互斥</text><text x="40" y="71.92" fill="#16233D" font-size="24" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">十五分钟检查，不等于十五分钟学完</text><text x="40" y="95.549" fill="#52647C" font-size="10.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">当前日程已保存并实际运行；它接续已派发票据，没有覆盖所有待分类和未来新增记录。</text><rect x="40" y="562.2755905511812" width="761.8897637795277" height="1" rx="0" fill="#DCE5F0" stroke="#DCE5F0"/><text x="40" y="576.6665905511811" " fill="#16233D" font-size="9.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">每轮新唯一 owner</text><polyline points="492,203 505,203" fill="none" stroke="#764FE3" stroke-width="1.65"/><polygon points="505,203 497.0,199.0 497.0,207.0" fill="#764FE3"/><rect x="505" y="147" width="142" height="112" rx="10" fill="#F0EAFF" stroke="#764FE3"/><rect x="505" y="147" width="5" height="112" rx="2" fill="#764FE3" stroke="#764FE3"/><text x="521" y="172.62" fill="#764FE3" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">学习并续约</text><text x="521" y="192.051" fill="#16233D" font-size="9.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">同源 / 同项目串行</text><polyline points="647,203 660,203" fill="none" stroke="#764FE3" stroke-width="1.65"/><polygon points="660,203 652.0,199.0 652.0,207.0" fill="#764FE3"/><rect x="660" y="147" width="142" height="112" rx="10" fill="#FFF0E4" stroke="#F07822"/><rect x="660" y="147" width="5" height="112" rx="2" fill="#F07822" stroke="#F07822"/><text x="676" y="172.62" fill="#F07822" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">保存并释放</text><text x="676" y="192.051" fill="#16233D" font-size="9.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">回读报告和标签</text><rect x="40" y="301" width="761.8897637795277" height="30" rx="6" fill="#16233D" stroke="#16233D"/><text x="51" y="317.885" fill="#FFFFFF" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">机制</text><text x="223" y="317.885" fill="#FFFFFF" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">当前作用</text><text x="518" y="317.885" fill="#FFFFFF" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">容易误会的地方</text><rect x="40" y="331" width="761.8897637795277" height="32.0" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><text x="51" y="347.3" fill="#16233D" font-size="10" font-family="Microsoft YaHei,Arial,sans-serif page" id="p11"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 841.8897637795277 595.2755905511812" role="img"><rect x="0" y="0" width="841.8897637795277" height="595.2755905511812" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><rect x="0" y="0" width="10" height="595.2755905511812" rx="0" fill="#764FE3" stroke="#764FE3"/><text x="40" y="30.055" fill="#52647C" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">REMINDER / PERSONAL LEARNING SYSTEM</text><rect x="619.8897637795277" y="17" width="182" height="23" rx="6" fill="#F0EAFF" stroke="#F0EAFF"/><text x="629.8897637795277" y="30.304000000000002" fill="#764FE3" font-size="8.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">learn-project 方法</text><text x="40" y="71.92" fill="#16233D" font-size="24" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">skill 把“读资料”拆成可交付的学习</text><text x="40" y="95.549" fill="#52647C" font-size="10.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">skill 是可复用的作业方法，不是另一个模型，也不是自动授予权限的程序。</text><rect x="40" y="562.2755905511812" width="761.8897637795277" height="1" rx="0" fill="#DCE5F0" stroke="#DCE5F0"/><text x="40" y="576.6665905511811" fill="#52647C" font-size="7.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">核验基线 2026-10-05 14:07 CST | 实线=已有路径；虚线=待打通 / 建议配置</text><text x="755.8897637795277" y="577.3305905511811" fill="#16233D" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">11 / 36</text><text x="40" y="552.5005905511812" fill="#52647C" font-size="7.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">依据：.claude/skills/learn-project/SKILL.md；云端执行说明</text><rect x="40" y="137" width="242" height="139" rx="10" fill="#F0EAFF" stroke="#764FE3"/><rect x="40" y="137" width="5" height="139" rx="2" fill="#764FE3" stroke="#764FE3"/><text x="56" y="162.62" fill="#764FE3" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">0 t x="322" y="217.26500000000001" fill="#16233D" font-size="10.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">记录实际读到的版本及依据</text><rect x="572" y="139" width="230" height="134" rx="10" fill="#F0EAFF" stroke="#764FE3"/><rect x="572" y="139" width="5" height="134" rx="2" fill="#764FE3" stroke="#764FE3"/><text x="588" y="164.62" fill="#764FE3" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">Dot 执行方法</text><text x="588" y="184.715" fill="#16233D" font-size="10.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">在云端新建项目目录</text><text x="588" y="200.99" fill="#16233D" font-size="10.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">按实有工具配置实验</text><text x="588" y="217.26500000000001" fill="#16233D" font-size="10.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">不照抄 Windows 专属命令</text><polyline points="263,208 306,208" fill="none" stroke="#087B68" stroke-width="1.65"/><polygon points="306,208 298.0,204.0 298.0,212.0" fill="#087B68"/><polyline points="529,208 572,208" fill="none" stroke="#764FE3" stroke-width="1.65"/><polygon points="572,208 564.0,204.0 564.0,212.0" fill="#764FE3"/><rect x="40" y="320" width="368" height="118" rx="10" fill="#E7F6EF" stroke="#087B68"/><rect x="40" y="320" width="5" height="118" rx="2" fill="#087B68" stroke="#087B68"/><text x="56" y="345.62" fill="#087B68" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">索引不是最新本机知识库</text><text x="56" y="366.13" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">未提交的 Obsidian 手动笔记、私密记录和整台电脑不在云端索引。</text><text x="56" y="383.18" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">云端查重先给范围声明；回迁后本机再次查重合并。</text><rect x="430" y="320" width="372" height="118" rx="10" fill="#EEF1F7" stroke="#333E57"/><rect x="430" y="320" width="5" height="118" rx="2" fill="#333E57" stroke="#333E57"/><text x="446" y="345.62" fill="#333E57" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">读不到 raw 网页时怎么办</text><text x="446" y="366.13" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">记录原失败，再通过实际可用的 Git 对象完整读取同一固定文件；用</text><text x="446" y="383.18" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">commit、blob、SHA256 追溯。不能把搜索摘要当作 skill 已完整读</text><text x="446" y="400.23" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">取。</text><rect x="40" y="463" width="761.8897637795277" height="64" rx="8" fill="#FFF4D8" stroke="#FFF4D8"/><text x="54" y="482.632" fill="#A66700" font-size="10.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">“安装了 skill”不能凭口头确认</text><text x="54" y="499.885" fill="#16233D" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">官方指出本地 skills 需要连接电脑。当前云端方案是把方法作为可追溯输入读取，并实际执行；本次不声称本机 skill 已自动挂载到 Dot。</text></svg></section><section class="page" id="p14"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 841.8897637795277 595.2755905511812" role="img"><rect x="0" y="0" width="841.8897637795277" height="595.2755905511812" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><rect x="0" y="0" width="10" height="595.2755905511812" rx="0" fill="#2875EA" stroke="#2875EA"/><text x="40" y="30.055" fill="#52647C" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">REMINDER / PERSONAL LEARNING SYSTEM</text><rect x="619.8897637795277" y="17" width="182" height="23" rx="6" fill="#EAF2FF" stroke="#EAF2FF"/><text x="629.8897637795277" y="30.304000000000002" fill="#2875EA" font-size="8.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">云端成果回迁</text><text x="40" y="71.92" fill="#16233D" font-size="24" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">先复制校验，再入库，最后推送 Git</text><text x="40" y="95.549" fill="#52647C" font-size="10.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">这五个成功状态分别记账；其中任何一步等待，都不能称“全部完成”。</text><rect x="40" y="562.2755905511812" width="761.8897637795277" height="1" rx="0" fill="#DCE5F0" stroke="#DCE5F0"/><text x="40" y="576.6665905511811" fill="#52647C" font-size="7.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">核验基线 2026-10-05 14:07 CST | 实线=已有路径；虚线=待打通 / 建议配置</text><text x="755.8897637795277" y="577.3305905511811" fill="#16233D" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">14 / 36</text><text x="40" y="552.5005905511812" fill="#52647C" font-size="7.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">依据：reminder_dot_backup.py；handoff；confirm-analysis</text><rect x="40" y="145" width="142" height="110" rx="10" fill="#FFF0E4" stroke="#F07822"/><rect x="40" y="145" width="5" height="110" rx="2" fill="#F07822" stroke="#F07822"/><text x="56" y="170.62" fill="#F07822" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">网站保存</text><text x="56" y="190.13400000000001" fill="#16233D" font-size="9.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">私有报告 + 六原件</text><polyline points="182,200 195,200" fill="none" stroke="#F07822" stroke-width="1.65"/><polygon points="195,200 187.0,196.0 187.0,204.0" fill="#F07822"/><rect x="195" y="145" width="142" height="110" rx="10" fill="#EAF2FF" stroke="#2875EA"/><rect x="195" y="145" width="5" height="110" rx="2" fill="#2875EA" stroke="#2875EA"/><text x="211" y="170.62" fill="#2875EA" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">本机备份</text><text x="211" y="190.13400000000001" fill="#16233D" font-size="9.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">校验 SHA256 / 范围</text><polyline points="337,200 350,200" fill="none" stroke="#2875EA" stroke-width="1.65"/><polygon points="350,200 342.0,196.0 342.0,204.0" fill="#2875EA"/><rect x="350" y="145" width="142" height="110" rx="10" fill="#E7F6EF" stroke="#087B68"/><rect x="350" y="145" width="5" height="110" rx="2" fill="#087B68" stroke="#087B68"/><text x="366" y="170.62" fill="#087B68" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">知识入库</text><text x="366" y="190.13400000000001" fill="#16233D" font-size="9.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">概念查重 + MOC</text><polyline points="492,200 505,200" fill="none" stroke="#087B68" stroke-width="1.65"/><polygon points="505,200 497.0,196.0 497.0,204.0" fill="#087B68"/><rect x="505" y="145" width="142" height="110" rx="10" fill="#EEF1F7" stroke="#333E57"/><rect x="505" y="145" width="5" height="110" rx="2" fill="#333E57" stroke="#333E57"/><text x="521" y="170.62" fill="#333E57" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">Git 提交</text><text x="521" y="190.13400000000001" fill="#16233D" font-size="9.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">审核后明确文件</text><polyline points="647,200 660,200" fill="none" stroke="#333E57" stroke-width="1.65"/><polygon points="660,200 652.0,196.0 652.0,204.0" fill="#333E57"/><rect x="660" y="145" width="142" height="110" rx="10" fill="#EEF1F7" stroke="#333E57"/><rect x="660" y="145" width="5" height="110" rx="2" fill="#333E57" stroke="#333E57"/><text x="676" y="170.62" fill="#333E57" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">Git 推送</text><text x="676" y="190.13400000000001" fill="#16233D" font-size="9.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">远端 SHA 回读</text><rect x="40" y="309" width="367" height="131" rx="10" fill="#EAF2FF" stroke="#2875EA"/><rect x="40" y="309" width="5" height="131" rx="2" fill="#2875EA" stroke="#2875EA"/><text x="56" y="334.62" fill="#2875EA" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">固定脚本：只负责搬运</text><text x="56" y="353.304" fill="#2875EA" font-size="8.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">tools/reminder_dot_on_login.ps1</text><text x="56" y="375.466" fill="#16233D" font-size="10.2" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">用户登录 Windows 时拉取私有副本，验证文件、来源和账户列表，更新</text><text x="56" y="391.276" fill="#16233D" font-size="10.2" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">handoff.json。重复拉取不重复计数，不删除云端原件。</text><rect x="430" y="309" width="372" height="131" rx="10" fill="#E7F6EF" stroke="#087B68"/><rect x="430" y="309" width="5" height="131" rx="2" fill="#087B68" stroke="#087B68"/><text x="446" y="334.62" fill="#087B68" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">协调者：负责理解与交付</text><text x="446" y="353.304" fill="#087B68" font-size="8.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">Windows 的唯一知识协调者</text><text x="446" y="375.466" fill="#16233D" font-size="10.2" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">核对当前 sourceHash 与原 owner，把练习整理到现有项目目录，合并</text><text x="446" y="391.276" fill="#16233D" font-size="10.2" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">vault，独立审核并 confirm-analysis，再按明确清单完成 Git 收尾。</text><rect x="40" y="464" width="761.8897637795277" height="64" rx="8" fill="#FFF4D8" stroke="#FFF4D8"/><text x="54" y="483.632" fill="#A66700" font-size="10.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">目前尚未打通的最后一公里</text><text x="54" y="500.885" fill="#16233D" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">Dot 向当前本机既有聊天的正式投递返回 placement-v1 / NOT_FOUND，自动唤醒未通过。登录备份已运行，不代表本机智能体会自动合并知识或推送。</text></svg></section><section class="page" id="p15"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 841.8897637795277 595.2755905511812" role="img"><rect x="0" y="0" width="841.8897637795277" height="595.2755905511812" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><rect x="0" y="0" width="10" height="595.2755905511812" rx="0" fill="#0 ft YaHei,Arial,sans-serif" font-weight="400">14:02 左右领取 full，源码已固定</text><text x="535" y="309.03200000000004" fill="#16233D" font-size="10.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">正在学习；未交付完整报告</text><rect x="40" y="396" width="365" height="114" rx="10" fill="#EEF1F7" stroke="#333E57"/><rect x="40" y="396" width="5" height="114" rx="2" fill="#333E57" stroke="#333E57"/><text x="56" y="421.62" fill="#333E57" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">代码与学习成果分开看</text><text x="56" y="441.715" fill="#16233D" font-size="10.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">本机配套工具提交 8536dae 尚未推送。公开知识 main 已实际回读为</text><text x="56" y="457.98999999999995" fill="#16233D" font-size="10.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">109ffa9。不要把本机 commit 当成远端已更新。</text><rect x="430" y="396" width="372" height="114" rx="10" fill="#F0EAFF" stroke="#764FE3"/><rect x="430" y="396" width="5" height="114" rx="2" fill="#764FE3" stroke="#764FE3"/><text x="446" y="421.62" fill="#764FE3" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">质量证据也分运行位置</text><text x="446" y="441.715" fill="#16233D" font-size="10.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">MCP Toolbox 的 Linux 程序在云端运行并独立复跑；Windows 校验包</text><text x="446" y="457.98999999999995" fill="#16233D" font-size="10.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">、源码、日志和 PDF。没有把云端实验计为 Windows 实验。</text></svg></section><section class="page" id="p18"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 841.8897637795277 595.2755905511812" role="img"><rect x="0" y="0" width="841.8897637795277" height="595.2755905511812" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><rect x="0" y="0" width="10" height="595.2755905511812" rx="0" fill="#2875EA" stroke="#2875EA"/><text x="40" y="30.055" fill="#52647C" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">REMINDER / PERSONAL LEARNING SYSTEM</text><rect x="619.8897637795277" y="17" width="182" height="23" rx="6" fill="#EAF2FF" stroke="#EAF2FF"/><text x="629.8897637795277" y="30.304000000000002" fill="#2875EA" font-size="8.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">搭建 00 / 先准备</text><text x="40" y="71.92" fill="#16233D" font-size="24" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">先决定复用服务，还是自建一套</text><text x="40" y="95.549" fill="#52647C" font-size="10.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">本手册示例沿用本人实例；朋友可先体验公开学习成果，接入私人任务需要独立权限配置。</text><rect x="40" y="562.2755905511812" width="761.8897637795277" height="1" rx="0" fill="#DCE5F0" stroke="#DCE5F0"/><text x="40" y="576.6665905511811" fill="#52647C" font-size="7.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">核验基线 2026-10-05 14:07 CST | 实线=已有路径；虚线=待打通 / 建议配置</text><text x="755.8897637795277" y="577.3305905511811" fill="#16233D" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">18 / 36</text><rect x="40" y="130" width="761.8897637795277" height="30" rx="6" fill="#16233D" stroke="#16233D"/><text x="51" y="146.885" fill="#FFFFFF" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">需要准备</text><text x="273" y="146.885" fill="#FFFFFF" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">为什么需要</text><text x="559" y="146.885" fill="#FFFFFF" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">先验收什么</text><rect x="40" y="160" width="761.8897637795277" height="32.0" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><text x="51" y="176.3" fill="#16233D" font-size="10" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">网站源码访问权</text><text x="273" y="176.3" fill="#16233D" font-size="10" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">reminder 是私有仓库，未授权会 404 / 拒绝访问</text><text x="559" y="176.3" fill="#16233D" font-size="10" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">仓库拥有者确认只读 / 部署权限</text><rect x="40" y="192.0" width="761.8897637795277" height="32.0" rx="0" fill="#EDF2FA" stroke="#EDF2FA"/><text x="51" y="208.3" fill="#16233D" font-size="10" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">阿里云 ECS + 域名 / HTTPS</text><text x="273" y="208.3" fill="#16233D" font-size="10" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">保存正式任务与 MCP 服务</text><text x="559" y="208.3" fill="#16233D" font-size="10" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">SSH 登录；服务入口配置</text><rect x="40" y="224.0" width="761.8897637795277" height="32.0" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><text x="51" y="240.3" fill="#16233D" font-size="10" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">合资格 Dot 账户</text><text x="273" y="240.3" fill="#16233D" font-size="10" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">使用云端电脑、插件和日程</text><text x="559" y="240.3" fill="#16233D" font-size="10" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">本人可创建 / 使用 Dot；工具可实际运行</text><rect x="40" y="256.0" width="761.8897637795277" height="32.0" rx="0" fill="#EDF2FA" stroke="#EDF2FA"/><text x="51" y="272.3" fill="#16233D" font-size="10" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">Windows：Git / Python / PowerShell 7</text><text x="273" y="272.3" fill="#16233D" font-size="10" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">拉取私有副本和知识协调</text><text x="559" y="272.3" fill="#16233D" font-size="10" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">版本可查询；路径可写</text><rect x="40" y="288.0" width="761.8897637795277" height="32.0" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><text x="51" y="304.3" fill="#16233D" font-size="10" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">Obsidian + 公开知识仓库</text><text x="273" y="304.3" fill="#16233D" font-size="10" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">打开 vault，建立链接与复习</text><text x="559" y="304.3" fill="#16233D" font-size="10" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">能打开现有 Markdown 笔记</text><rect x="40" y="320.0" width="761.8897637795277" height="32.0" rx="0" fill="#EDF2FA" stroke="#EDF2FA"/><text x="51" y="336.3" fill="#16233D" font-size="10" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">无凭据的配套工具包</text><text x="273" y="336.3" fill="#16233D" font-size="10" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">当前公开 main 没有最新 pipeline / Dot 工具</text><text x="559" y="336.3" fill="#16233D" font-size="10" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">只安装显式工具，不复制运行数据</text><rect x="40" y="462" width="761.8897637795277" height="65" rx="8" fill="#FFF4D8" stroke="#FFF4D8"/><text x="54" y="481.632" fill="#A66700" font-size="10.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">新手命令的边界</text><text x="54" y="498.885" fill="#16233D" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">以下命令按源码、CLI help 和官方文档核对；本次没有替读者新建云服务器、安装软件或重部署生产。占位符必须替换；成功标准写在每页，不能把未运行的命令当成已验收</text><text x="54" y="513.61" fill="#16233D" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">。</text></svg></section><section class="page" id="p19"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 841.8897637795277 595.2755905511812" role="img"><rect x="0" y="0" width="841.8897637795277" height="595.2755905511812" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><rect x="0" y="0" width="10" height="595.2755905511812" rx="0" fill="#D74554" stroke="#D74554"/><text x="40" y="30.055" fill="#52647C" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">REMINDER / PERSONAL LEARNING SYSTEM</text><rect x="619.8897637795277" y="17" width="182" height="23" rx="6" fill="#FDECEF" stroke="#FDECEF"/><text x="629.8897637795277" y="30.304000000000002" fill="#D74554" font-size="8.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">搭建 01 / Ubuntu 本地</text><text x="40" y="71.92" fill="#16233D" font-size="24" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">准备运维终端与服务器连接</text><text x="40" y="95.549" fill="#52647C" font-size="10.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">Ubuntu 保管网站代码与运维连接；它不会把 Windows 的最终知识目录当服务器的数据目录。</text><rect x="40" y="562.2755905511812" width="761.8897637795277" height="1" rx="0" fill="#DCE5F0" stroke="#DCE5F0"/><text x="40" y="576.6665905511811" fill="#52647C" font-size="7.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">核验基线 2026-10-05 14:07 CST | 实线=已有路径；虚线=待打通 / 建议配置</text><text x="755.8897637795277" y="577.3305905511811" fill="#16233D" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">19 / 36</text><rect x="40" y="137" width="452" height="131.88799999999998" rx="8" fill="#16233D" stroke="#16233D"/><text x="54" y="154.055" fill="#7ED7DF" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">Ubuntu 本地 / Bash</text><text x="54" y="173.636" fill="#FFFFFF" font-size="9.2" font-family="Consolas,monospace" font-weight="400">git --version</text><text x="54" y="187.62" fill="#FFFFFF" font-size="9.2" font-family="Consolas,monospace" font-weight="400">ssh -V</text><text x="54" y="201.60399999999998" fill="#FFFFFF" font-size="9.2" font-family="Consolas,monospace" font-weight="400">node --version</text><text x="54" y="215.588" fill="#FFFFFF" font-size="9.2" font-family="Consolas,monospace" font-weight="400">git clone https://github.com/Smashwinny/reminder.git</text><text x="54" y="229.57199999999997" fill="#FFFFFF" font-size="9.2" font-family="Consolas,monospace" font-weight="400">cd reminder</text><text x="54" y="243.55599999999998" fill="#FFFFFF" font-size="9.2" font-family="Consolas,monospace" font-weight="400">git status --short</text><text x="54" y="257.54" fill="#FFFFFF" font-size="9.2" font-family="Consolas,monospace" font-weight="400">git log -1 --oneline</text><rect x="524" y="138" width="278" height="150" rx="10" fill="#FDECEF" stroke="#D74554"/><rect x="524" y="138" width="5" height="150" rx="2" fill="#D74554" stroke="#D74554"/><text x="540" y="163.62" fill="#D74554" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">每组命令做什么</text><text x="540" y="183.964" fill="#16233D" font-size="10.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">检查 Git / SSH / Node。</text><text x="540" y="200.704" fill="#16233D" font-size="10.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">克隆已获权限的私有网站仓库。</text><text x="540" y="217.44400000000002" fill="#16233D" font-size="10.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">确认工作区与当前版本。</text><text x="540" y="234.184" fill="#16233D" font-size="10.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">Node 22 对应当前容器版本。</text><rect x="40" y="285.888" width="452" height="61.056" rx="8" fill="#16233D" stroke="#16233D"/><text x="54" y="302.943" fill="#7ED7DF" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">先测代码，再进入阿里云；连接信息自行替换</text><text x="54" y="322.275" fill="#FFFFFF" font-size="8.9" font-family="Consolas,monospace" font-weight="400">node --test sync-server/server.test.js</text><text x="54" y="335.803" fill="#FFFFFF" font-size="8.9" font-family="Consolas,monospace" font-weight="400">ssh -i /PRIVATE/PATH/key ADMIN@ECS_HOST</text><rect x="524" y="310" width="278" height="135" rx="10" fill="#FDECEF" stroke="#D74554"/><rect x="524" y="310" width="5" height="135" rx="2" fill="#D74554" stroke="#D74554"/><text x="540" y="335.62" fill="#D74554" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">预期结果 / 故障处理</text><text x="540" y="355.715" fill="#16233D" font-size="10.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">测试通过后再准备部署。</text><text x="540" y="371.98999999999995" fill="#16233D" font-size="10.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">SSH 成功看到服务器主机名。</text><text x="540" y="388.265" fill="#16233D" font-size="10.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">仓库 404 先核权限，不找旧公网入口。</text><text x="540" y="404.53999999999996" fill="#16233D" font-size="10.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">有未提交改动先保留，不能自动 reset。</text><rect x="40" y="464" width="761.8897637795277" height="64" rx="8" fill="#FFF4D8" stroke="#FFF4D8"/><text x="54" y="483.632" fill="#A66700" font-size="10.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">版本与已有生产</text><text x="54" y="500.885" fill="#16233D" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">当前生产曾验收固定版本 97ef3cc；新建时使用负责人确认的含 Dot 集成版本。生产已有数据时先完整备份和核对差异，不能照抄“首次部署”覆盖现有目录。</text></svg></section><section class="page" id="p20"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 841.8897637795277 595.2755905511812" role="img"><rect x="0" y="0" width="841.8897637795277" height="595.2755905511812" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><rect x="0" y="0" width="10" height="595.2755905511812" rx="0" fill="#F07822" stroke="#F07822"/><text x="40" y="30.055" fill="#52647C" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">REMINDER / PERSONAL LEARNING SYSTEM</text><rect x="619.8897637795277" y="17" width="182" height="23" rx="6" fill="#FFF0E4" stroke="#FFF0E4"/><text x="629.8897637795277" y="30.304000000000002" fill="#F07822" font-size="8.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">搭建 02 / 阿里云服务器</text><text x="40" y="71.92" fill="#16233D" font-size="24" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">安装 Docker 与 Compose v2</text><text x="40" y="95.549" fill="#52647C" font-size="10.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">只在全新、获准运维的 Ubuntu ECS 执行。已有 Docker 时先检查版本，不混装或删除现有服务。</text><rect x="40" y="562.2755905511812" width="761.8897637795277" height="1" rx="0" fill="#DCE5F0" stroke="#DCE5F0"/><text x="40" y="576.6665905511811" fill="#52647C" font-size="7.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">核验基线 2026-10-05 14:07 CST | 实线=已有路径；虚线=待打通 / 建议配置</text><text x="755.8897637795277" y="577.3305905511811" fill="#16233D" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">20 / 36</text><text x="40" y="552.5005905511812" fill="#52647C" font-size="7.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">依据：Docker 官方 Ubuntu 安装步骤 [S6]；项目使用 Compose v2</text><rect x="40" y="130" width="761.8897637795277" height="256.224" rx="8" fill="#16233D" stroke="#16233D"/><text x="54" y="147.055" fill="#7ED7DF" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">阿里云服务器 / Bash · 官方 APT 仓库安装</text><text x="54" y="166.138" fill="#FFFFFF" font-size="8.6" font-family="Consolas,monospace" font-weight="400">sudo apt update</text><text x="54" y="179.21" fill="#FFFFFF" font-size="8.6" font-family="Consolas,monospace" font-weight="400">sudo apt install -y ca-certificates curl git</text><text x="54" y="192.282" fill="#FFFFFF" font-size="8.6" font-family="Consolas,monospace" font-weight="400">sudo install -m 0755 -d /etc/apt/keyrings</text><text x="54" y="205.354" fill="#FFFFFF" font-size="8.6" font-family="Consolas,monospace" font-weight="400">sudo curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc</text><text x="54" y="218.42600000000002" fill="#FFFFFF" font-size="8.6" font-family="Consolas,monospace" font-weight="400">sudo chmod a+r /etc/apt/keyrings/docker.asc</text><text x="54" y="231.49800000000002" fill="#FFFFFF" font-size="8.6" font-family="Consolas,monospace" font-weight="400">sudo tee /etc/apt/sources.list.d/docker.sources &lt;&lt;EOF</text><text x="54" y="244.57" fill="#FFFFFF" font-size="8.6" font-family="Consolas,monospace" font-weight="400">Types: deb</text><text x="54" y="257.642" fill="#FFFFFF" font-size="8.6" font-family="Consolas,monospace" font-weight="400">URIs: https://download.docker.com/linux/ubuntu</text><text x="54" y="270.714" fill="#FFFFFF" font-size="8.6" font-family="Consolas,monospace" font-weight="400">Suites: $(. /etc/os-release &amp;&amp; echo &quot;${UBUNTU_CODENAME:-$VERSION_CODENAME}&quot;)</text><text x="54" y="283.786" fill="#FFFFFF" font-size="8.6" font-family="Consolas,monospace" font-weight="400">Components: stable</text><text x="54" y="296.858" fill="#FFFFFF" font-size="8.6" font-family="Consolas,monospace" font-weight="400">Architectures: $(dpkg --print-architecture)</text><text x="54" y="309.93" fill="#FFFFFF" font-size="8.6" font-family="Consolas,monospace" font-weight="400">Signed-By: /etc/apt/keyrings/docker.asc</text><text x="54" y="323.00199999999995" fill="#FFFFFF" font-size="8.6" font-family="Consolas,monospace" font-weight="400">EOF</text><text x="54" y="336.07399999999996" fill="#FFFFFF" font-size="8.6" font-family="Consolas,monospace" font-weight="400">sudo apt update</text><text x="54" y="349.14599999999996" fill="#FFFFFF" font-size="8.6" font-family="Consolas,monospace" font-weight="400">sudo apt install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin</text><text x="54" y="362.21799999999996" fill="#FFFFFF" font-size="8.6" font-family="Consolas,monospace" font-weight="400">sudo docker compose version</text><text x="54" y="375.28999999999996" fill="#FFFFFF" font-size="8.6" font-family="Consolas,monospace" font-weight="400">sudo docker run --rm hello-world</text><rect x="40" y="462" width="761.8897637795277" height="64" rx="8" fill="#FFF0E4" stroke="#FFF0E4"/><text x="54" y="481.632" fill="#F07822" font-size="10.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">预期结果</text><text x="54" y="498.885" fill="#16233D" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">docker compose version 返回 v2 或更新的官方插件；hello-world 给出成功输出。容器端口仍按本项目绑定 127.0.0.1，不通过开放 8787 公网端口解决连通问题。</text></svg></section><section class="page" id="p21"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 841.8897637795277 595.2755905511812" role="img"><rect x="0" y="0" width="841.8897637795277" height="595.2755905511812" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><rect x="0" y="0" width="10" height="595.2755905511812" rx="0" fill="#F07822" stroke="#F07822"/><text x="40" y="30.055" fill="#52647C" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">REMINDER / PERSONAL LEARNING SYSTEM</text><rect x="619.8897637795277" y="17" width="182" height="23" rx="6" fill="#FFF0E4" stroke="#FFF0E4"/><text x="629.8897637795277" y="30.304000000000002" fill="#F07822" font-size="8.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">搭建 03 / 阿里云服务器</text><text x="40" y="71.92" fill="#16233D" font-size="24" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">部署站点，先让手机与网页同步</text><text x="40" y="95.549" fill="#52647C" font-size="10.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">下面以新目录 /opt/reminder 为例；先完成普通站点，再配置 Dot 四项门控变量。</text><rect x="40" y="562.2755905511812" width="761.8897637795277" height="1" rx="0" fill="#DCE5F0" stroke="#DCE5F0"/><text x="40" y="576.6665905511811" fill="#52647C" font-size="7.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">核验基线 2026-10-05 14:07 CST | 实线=已有路径；虚线=待打通 / 建议配置</text><text x="755.8897637795277" y="577.3305905511811" fill="#16233D" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">21 / 36</text><text x="40" y="552.5005905511812" fill="#52647C" font-size="7.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">依据：deploy/install.sh；docker-compose.yml；.env.example</text><rect x="40" y="133" width="484" height="191.776" rx="8" fill="#16233D" stroke="#16233D"/><text x="54" y="150.055" fill="#7ED7DF" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">阿里云服务器 / Bash</text><text x="54" y="169.1795" fill="#FFFFFF" font-size="8.65" font-family="Consolas,monospace" font-weight="400">sudo install -d -m 0750 -o &quot;$USER&quot; /opt/reminder</text><text x="54" y="182.3275" fill="#FFFFFF" font-size="8.65" font-family="Consolas,monospace" font-weight="400">git clone https://github.com/Smashwinny/reminder.git /opt/reminder</text><text x="54" y="195.47549999999998" fill="#FFFFFF" font-size="8.65" font-family="Consolas,monospace" font-weight="400">cd /opt/reminder</text><text x="54" y="208.6235" fill="#FFFFFF" font-size="8.65" font-family="Consolas,monospace" font-weight="400">umask 077</text><text x="54" y="221.7715" fill="#FFFFFF" font-size="8.65" font-family="Consolas,monospace" font-weight="400">cp deploy/.env.example deploy/.env</text><text x="54" y="234.9195" fill="#FFFFFF" font-size="8.65" font-family="Consolas,monospace" font-weight="400">openssl rand -hex 24</text><text x="54" y="248.0675" fill="#FFFFFF" font-size="8.65" font-family="Consolas,monospace" font-weight="400">nano deploy/.env</text><text x="54" y="261.2155" fill="#FFFFFF" font-size="8.65" font-family="Consolas,monospace" font-weight="400">touch deploy/kimi.key</text><text x="54" y="274.36350000000004" fill="#FFFFFF" font-size="8.65" font-family="Consolas,monospace" font-weight="400">chmod 600 deploy/.env deploy/kimi.key</text><text x="54" y="287.5115" fill="#FFFFFF" font-size="8.65" font-family="Consolas,monospace" font-weight="400">sudo docker compose -f deploy/docker-compose.yml up -d --build</text><text x="54" y="300.65950000000004" fill="#FFFFFF" font-size="8.65" font-family="Consolas,monospace" font-weight="400">sudo docker compose -f deploy/docker-compose.yml ps</text><text x="54" y="313.80750000000006" fill="#FFFFFF" font-size="8.65" font-family="Consolas,monospace" font-weight="400">curl -fsS http://127.0.0.1:8787/api/healthz</text><rect x="547" y="136" width="255" height="180" rx="10" fill="#FFF0E4" stroke="#F07822"/><rect x="547" y="136" width="5" height="180" rx="2" fill="#F07822" stroke="#F07822"/><text x="563" y="161.62" fill="#F07822" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">必须人工填写</text><text x="563" y="182.13" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">把随机邀请码填入 .env。</text><text x="563" y="199.18" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">Kimi 摘要可选：Key 仅填 kimi.key。</text><text x="563" y="216.23" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">Dot 账户和 callback 等下一步确定。</text><text x="563" y="233.28" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">不要把随机值、Key 或 .env 发到 Issue / Git</text><text x="563" y="250.32999999999998" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">。</text><rect x="547" y="335" width="255" height="124" rx="10" fill="#FFF0E4" stroke="#F07822"/><rect x="547" y="335" width="5" height="124" rx="2" fill="#F07822" stroke="#F07822"/><text x="563" y="360.62" fill="#F07822" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">预期结果</text><text x="563" y="380.632" fill="#16233D" font-size="10.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">容器 reminder_app 健康。</text><text x="563" y="396.752" fill="#16233D" font-size="10.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">数据在 reminder_data 卷。</text><text x="563" y="412.872" fill="#16233D" font-size="10.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">本机 healthz 返回成功。</text><text x="563" y="428.992" fill="#16233D" font-size="10.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">外网稍后经 HTTPS 入口访问。</text><rect x="40" y="464" width="761.8897637795277" height="64" rx="8" fill="#FFF4D8" stroke="#FFF4D8"/><text x="54" y="483.632" fill="#A66700" font-size="10.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">两种首次部署方式选一种</text><text x="54" y="500.885" fill="#16233D" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">也可在已配置好 .env 的新实例运行 sudo sh deploy/install.sh：会创建缺失的空 kimi.key 并检查容器 / 端口冲突。发现已有实例则停止，转入负责人审核的更新流程。</text></svg></section><section class="page" id="p22"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 841.8897637795277 595.2755905511812" role="img"><rect x="0" y="0" width="841.8897637795277" height="595.2755905511812" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><rect x="0" y="0" width="10" height="595.2755905511812" rx="0" fill="#F07822" stroke="#F07822"/><text x="40" y="30.055" fill="#52647C" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">REMINDER / PERSONAL LEARNING SYSTEM</text><rect x="619.8897637795277" y="17" width="182" height="23" rx="6" fill="#FFF0E4" stroke="#FFF0E4"/><text x="629.8897637795277" y="30.304000000000002" fill="#F07822" font-size="8.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">搭建 04 / 阿里云服务器</text><text x="40" y="71.92" fill="#16233D" font-size="24" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">把 HTTPS 入口和备份接好</text><text x="40" y="95.549" fill="#52647C" font-size="10.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">当前实例使用 Cloudflare 命名隧道；新读者可采用自己的隧道或 Nginx / 证书，二选一。</text><rect x="40" y="562.2755905511812" width="761.8897637795277" height="1" rx="0" fill="#DCE5F0" stroke="#DCE5F0"/><text x="40" y="576.6665905511811" fill="#52647C" font-size="7.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">核验基线 2026-10-05 14:07 CST | 实线=已有路径；虚线=待打通 / 建议配置</text><text x="755.8897637795277" y="577.3305905511811" fill="#16233D" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">22 / 36</text><rect x="40" y="133" width="363" height="131" rx="10" fill="#FFF0E4" stro
