ke="#F07822"/><rect x="40" y="133" width="5" height="131" rx="2" fill="#F07822" stroke="#F07822"/><text x="56" y="158.62" fill="#F07822" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">入口配置：Cloudflare 路线</text><text x="56" y="178.964" fill="#16233D" font-size="10.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">在 Cloudflare 配置自己的域名与命名隧道，服务指向</text><text x="56" y="195.704" fill="#16233D" font-size="10.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">http://127.0.0.1:8787。官方安装 cloudflared；私密 token 文件按</text><text x="56" y="212.44400000000002" fill="#16233D" font-size="10.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">服务模板路径保存并限制权限。</text><rect x="431" y="133" width="371" height="131" rx="10" fill="#FDECEF" stroke="#D74554"/><rect x="431" y="133" width="5" height="131" rx="2" fill="#D74554" stroke="#D74554"/><text x="447" y="158.62" fill="#D74554" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">入口配置：Nginx 路线</text><text x="447" y="178.964" fill="#16233D" font-size="10.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">参考 deploy/nginx-reminder.conf.example，换成本人域名与已取得</text><text x="447" y="195.704" fill="#16233D" font-size="10.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">的有效证书；nginx -t 通过后加载。已有入口由原运维者维护，不新增</text><text x="447" y="212.44400000000002" fill="#16233D" font-size="10.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">第二个正式数据源。</text><rect x="40" y="291" width="762" height="129.76" rx="8" fill="#16233D" stroke="#16233D"/><text x="54" y="308.055" fill="#7ED7DF" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">服务器备份和公网验证 / Bash · YOUR_DOMAIN 换成自己的域名</text><text x="54" y="327.47" fill="#FFFFFF" font-size="9.0" font-family="Consolas,monospace" font-weight="400">cd /opt/reminder</text><text x="54" y="341.15000000000003" fill="#FFFFFF" font-size="9.0" font-family="Consolas,monospace" font-weight="400">sudo cp deploy/reminder-backup.service deploy/reminder-backup.timer /etc/systemd/system/</text><text x="54" y="354.83000000000004" fill="#FFFFFF" font-size="9.0" font-family="Consolas,monospace" font-weight="400">sudo systemctl daemon-reload</text><text x="54" y="368.51000000000005" fill="#FFFFFF" font-size="9.0" font-family="Consolas,monospace" font-weight="400">sudo systemctl enable --now reminder-backup.timer</text><text x="54" y="382.19000000000005" fill="#FFFFFF" font-size="9.0" font-family="Consolas,monospace" font-weight="400">sudo sh deploy/backup.sh</text><text x="54" y="395.87" fill="#FFFFFF" font-size="9.0" font-family="Consolas,monospace" font-weight="400">sudo systemctl status reminder-backup.timer</text><text x="54" y="409.55" fill="#FFFFFF" font-size="9.0" font-family="Consolas,monospace" font-weight="400">curl -fsS https://YOUR_DOMAIN/api/healthz</text><rect x="40" y="449" width="761.8897637795277" height="70" rx="8" fill="#FFF4D8" stroke="#FFF4D8"/><text x="54" y="468.632" fill="#A66700" font-size="10.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">备份验收与时区</text><text x="54" y="485.885" fill="#16233D" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">保留压缩备份及 .sha256，复制到独立私有位置并测试恢复。模板 OnCalendar=03:20 使用服务器时区并带随机延迟；查 timedatectl 后确定实际时间，不把同机卷副本当异</text><text x="54" y="500.61" fill="#16233D" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">机备份。</text></svg></section><section class="page" id="p23"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 841.8897637795277 595.2755905511812" role="img"><rect x="0" y="0" width="841.8897637795277" height="595.2755905511812" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><rect x="0" y="0" width="10" height="595.2755905511812" rx="0" fill="#764FE3" stroke="#764FE3"/><text x="40" y="30.055" fill="#52647C" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">REMINDER / PERSONAL LEARNING SYSTEM</text><rect x="619.8897637795277" y="17" width="182" height="23" rx="6" fill="#F0EAFF" stroke="#F0EAFF"/><text x="629.8897637795277" y="30.304000000000002" fill="#764FE3" font-size="8.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">搭建 05 / 浏览器 + 阿里云</text><text x="40" y="71.92" fill="#16233D" font-size="24" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">用私有 MCP / OAuth 连接本人 Dot</text><text x="40" y="95.549" fill="#52647C" font-size="10.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">这一步在界面中完成，不存在本项目已经验证的“一条 CLI 命令连接 Dot”。</text><rect x="40" y="562.2755905511812" width="761.8897637795277" height="1" rx="0" fill="#DCE5F0" stroke="#DCE5F0"/><text x="40" y="576.6665905511811" fill="#52647C" font-size="7.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">核验基线 2026-10-05 14:07 CST | 实线=已有路径；虚线=待打通 / 建议配置</text><text x="755.8897637795277" y="577.3305905511811" fill="#16233D" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">23 / 36</text><text x="40" y="552.5005905511812" fill="#52647C" font-size="7.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">依据：连接本人 Dot 流程；官方 OAuth [S3]</text><rect x="40" y="131" width="761.8897637795277" height="30" rx="6" fill="#16233D" stroke="#16233D"/><text x="51" y="147.885" fill="#FFFFFF" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">在哪里</text><text x="204" y="147.885" fill="#FFFFFF" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">操作</text><text x="571" y="147.885" fill="#FFFFFF" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">核对结果</text><rect x="40" y="161" width="761.8897637795277" height="31.1" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><text x="51" y="176.802" fill="#16233D" font-size="9.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">ChatGPT 桌面 / 浏览器</text><text x="204" y="176.802" fill="#16233D" font-size="9.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">创建私有 MCP 应用；MCP URL 为 https://reminder.geniusqi.com/mcp</text><text x="571" y="176.802" fill="#16233D" font-size="9.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">自建实例替换自己的域名</text><rect x="40" y="192.1" width="761.8897637795277" height="31.1" rx="0" fill="#EDF2FA" stroke="#EDF2FA"/><text x="51" y="207.902" fill="#16233D" font-size="9.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">同一应用配置界面</text><text x="204" y="207.902" fill="#16233D" font-size="9.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">选择预定义自定义 OAuth 公共客户端；确定 client ID；复制精确 callback</text><text x="571" y="207.902" fill="#16233D" font-size="9.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">callback 不能猜、不能沿用别人草稿</text><rect x="40" y="223.2" width="761.8897637795277" height="45.2" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><text x="51" y="239.00199999999998" fill="#16233D" font-size="9.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">阿里云 deploy/.env</text><text x="204" y="239.00199999999998" fill="#16233D" font-size="9.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">填写 DOT_ALLOWED_USER_ID / DOT_PUBLIC_ORIGIN /</text><text x="204" y="253.10199999999998" fill="#16233D" font-size="9.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">DOT_OAUTH_CLIENT_ID / DOT_OAUTH_REDIRECT_URI</text><text x="571" y="239.00199999999998" fill="#16233D" font-size="9.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">账户用 canonical UUID；四项齐备才开放</text><rect x="40" y="268.4" width="761.8897637795277" height="31.1" rx="0" fill="#EDF2FA" stroke="#EDF2FA"/><text x="51" y="284.202" fill="#16233D" font-size="9.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">网站 /dot 管理页</text><text x="204" y="284.202" fill="#16233D" font-size="9.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">本人登录；选择获准列表及是否自动加入以后新增记录</text><text x="571" y="284.202" fill="#16233D" font-size="9.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">列表真实成员和 future auto-add 分别确认</text><rect x="40" y="299.5" width="761.8897637795277" height="31.1" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><text x="51" y="315.302" fill="#16233D" font-size="9.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">本人 OAuth 同意页</text><text x="204" y="315.302" fill="#16233D" font-size="9.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">核对账户、列表与三个 scope；本人确认同意</text><text x="571" y="315.302" fill="#16233D" font-size="9.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">records.read + analysis.write + learning.write</text><rect x="40" y="330.6" width="761.8897637795277" height="31.1" rx="0" fill="#EDF2FA" stroke="#EDF2FA"/><text x="51" y="346.40200000000004" fill="#16233D" font-size="9.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">Dot 私密对话</text><text x="204" y="346.40200000000004" fill="#16233D" font-size="9.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">调用 reminder_identity 并实际回读</text><text x="571" y="346.40200000000004" fill="#16233D" font-size="9.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">身份 / listId / 权限 / 模式符合本人选择</text><rect x="40" y="464" width="761.8897637795277" height="64" rx="8" fill="#FFF4D8" stroke="#FFF4D8"/><text x="54" y="483.632" fill="#A66700" font-size="10.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">配置变更后的验收</text><text x="54" y="500.885" fill="#16233D" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">运维者审核配置后更新 Reminder app，再检查 discovery 与真实 OAuth；未授权 MCP POST 应拒绝。临时哨兵 ID 被拒绝不能证明真实跨账户 / 跨列表隔离，需要用受控测</text><text x="54" y="515.61" fill="#16233D" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">试账户验证。</text></svg></section><section class="page" id="p24"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 841.8897637795277 595.2755905511812" role="img"><rect x="0" y="0" width="841.8897637795277" height="595.2755905511812" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><rect x="0" y="0" width="10" height="595.2755905511812" rx="0" fill="#764FE3" stroke="#764FE3"/><text x="40" y="30.055" fill="#52647C" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">REMINDER / PERSONAL LEARNING SYSTEM</text><rect x="619.8897637795277" y="17" width="182" height="23" rx="6" fill="#F0EAFF" stroke="#F0EAFF"/><text x="629.8897637795277" y="30.304000000000002" fill="#764FE3" font-size="8.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">搭建 06 / Dot 云端</text><text x="40" y="71.92" fill="#16233D" font-size="24" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">让 Dot 先证明会学习，再保存日程</text><text x="40" y="95.549" fill="#52647C" font-size="10.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">先做一条真实、来源可读的小项目；连接成功与完整学习成功分别验收。</text><rect x="40" y="562.2755905511812" width="761.8897637795277" height="1" rx="0" fill="#DCE5F0" stroke="#DCE5F0"/><text x="40" y="576.6665905511811" fill="#52647C" font-size="7.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">核验基线 2026-10-05 14:07 CST | 实线=已有路径；虚线=待打通 / 建议配置</text><text x="755.8897637795277" y="577.3305905511811" fill="#16233D" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">24 / 36</text><rect x="40" y="135" width="368" height="154" rx="10" fill="#F0EAFF" stroke="#764FE3"/><rect x="40" y="135" width="5" height="154" rx="2" fill="#764FE3" stroke="#764FE3"/><text x="56" y="160.62" fill="#764FE3" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">交给 Dot 的材料</text><text x="56" y="181.13" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">当前 README / 学习指南、原 learn-project 方法、固定版本知识索</text><text x="56" y="198.18" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">引、明确允许列表和本批次任务范围。没有把 F: 盘作为云端路径，也</text><text x="56" y="215.23" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">没有把本机 token 发给 Dot。</text><rect x="431" y="135" width="371" height="154" rx="10" fill="#F0EAFF" stroke="#764FE3"/><rect x="431" y="135" width="5" height="154" rx="2" fill="#764FE3" stroke="#764FE3"/><text x="447" y="160.62" fill="#764FE3" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">首条实测</text><text x="447" y="181.13" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">identity → preliminary 领取 / 来源核实 / 保存 / 回读 / 释放 → full</text><text x="447" y="198.18" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">领取 / 真实实验 / PDF / 独立审核 → 六原件保存 / 标签回读 / 释放。</text><rect x="40" y="314" width="761.8897637795277" height="143" rx="9" fill="#F0EAFF" stroke="#F0EAFF"/><text x="56" y="338.96" fill="#764FE3" font-size="12" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">可复制给 Dot 的启动指令（摘要版）</text><text x="56" y="364.462" fill="#16233D" font-size="11.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">请先核对拾遗插件的本人账户、一个允许列表和三个权限。读取学习指南及固定版本 learn-project；只学习来源已核实、无其他 owner 的记录</text><text x="56" y="384.462" fill="#16233D" font-size="11.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">。按方法做真实实验、彩色 PDF、知识提案和独立审核，保存六类原件并回读标签，完成勾选留给我。首条全部验收后，再确认保存每 15 分钟、</text><text x="56" y="404.462" fill="#16233D" font-size="11.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">Asia/Shanghai 的日程，明确本批范围，异常单独记录，同一故障不反复通知。</text><rect x="40" y="464" width="761.8897637795277" height="64" rx="8" fill="#FFF4D8" stroke="#FFF4D8"/><text x="54" y="483.632" fill="#A66700" font-size="10.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">日程必须实际 list 回读</text><text x="54" y="500.885" fill="#16233D" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">确认 enabled、时区、周期、保存的完整指令和目标环境。一次 run_now 成功不保证长期调度、严格时点或跨回合绝对串行；日程范围不能自动扩大到清单外任务。</text></svg></section><section class="page" id="p25"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 841.8897637795277 595.2755905511812" role="img"><rect x="0" y="0" width="841.8897637795277" height="595.2755905511812" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><rect x="0" y="0" width="10" height="595.2755905511812" rx="0" fill="#2875EA" stroke="#2875EA"/><text x="40" y="30.055" fill="#52647C" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">REMINDER / PERSONAL LEARNING SYSTEM</text><rect x="619.8897637795277" y="17" width="182" height="23" rx="6" fill="#EAF2FF" stroke="#EAF2FF"/><text x="629.8897637795277" y="30.304000000000002" fill="#2875EA" font-size="8.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">搭建 07 / Windows 本地</text><text x="40" y="71.92" fill="#16233D" font-size="24" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">先准备知识仓库与配套工具</text><text x="40" y="95.549" fill="#52647C" font-size="10.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">以下假设新机器 F:\reminder 不存在。已有目录只检查状态，不覆盖、重置或重新 clone 到里面。</text><rect x="40" y="562.2755905511812" width="761.8897637795277" height="1" rx="0" fill="#DCE5F0" stroke="#DCE5F0"/><text x="40" y="576.6665905511811" fill="#52647C" font-size="7.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">核验基线 2026-10-05 14:07 CST | 实线=已有路径；虚线=待打通 / 建议配置</text><text x="755.8897637795277" y="577.3305905511811" fill="#16233D" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">25 / 36</text><text x="40" y="552.5005905511812" fill="#52647C" font-size="7.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">依据：WinGet 官方 [S7]；公共仓库文件清单；配套包</text><rect x="40" y="132" width="470" height="176.12" rx="8" fill="#16233D" stroke="#16233D"/><text x="54" y="149.055" fill="#7ED7DF" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">Windows / PowerShell 7 · 软件许可提示由本人处理</text><text x="54" y="168.055" fill="#FFFFFF" font-size="8.5" font-family="Consolas,monospace" font-weight="400">winget install --id Git.Git -e</text><text x="54" y="180.975" fill="#FFFFFF" font-size="8.5" font-family="Consolas,monospace" font-weight="400">winget search --id Microsoft.PowerShell -e</text><text x="54" y="193.895" fill="#FFFFFF" font-size="8.5" font-family="Consolas,monospace" font-weight="400">winget search --id Python.Python.3.12 -e</text><text x="54" y="206.815" fill="#FFFFFF" font-size="8.5" font-family="Consolas,monospace" font-weight="400">winget install --id Microsoft.PowerShell -e</text><text x="54" y="219.735" fill="#FFFFFF" font-size="8.5" font-family="Consolas,monospace" font-weight="400">winget install --id Python.Python.3.12 -e</text><text x="54" y="232.655" fill="#FFFFFF" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400"># 关闭并重开 PowerShell 7，检查实际解释器</text><text x="54" y="245.575" fill="#FFFFFF" font-size="8.5" font-family="Consolas,monospace" font-weight="400">git --version</text><text x="54" y="258.495" fill="#FFFFFF" font-size="8.5" font-family="Consolas,monospace" font-weight="400">pwsh --version</text><text x="54" y="271.415" fill="#FFFFFF" font-size="8.5" font-family="Consolas,monospace" font-weight="400">python --version</text><text x="54" y="284.335" fill="#FFFFFF" font-size="8.5" font-family="Consolas,monospace" font-weight="400">git clone https://github.com/Smashwinny/reminder_knowlege.git F:\reminder</text><text x="54" y="297.255" fill="#FFFFFF" font-size="8.5" font-family="Consolas,monospace" font-weight="400">Set-Location F:\reminder</text><rect x="533" y="133" width="269" height="157" rx="10" fill="#EAF2FF" stroke="#2875EA"/><rect x="533" y="133" width="5" height="157" rx="2" fill="#2875EA" stroke="#2875EA"/><text x="549" y="158.62" fill="#2875EA" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">为什么还有配套包</text><text x="549" y="179.13" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">当前公开 main 只有历史 tools。本次附最新无凭</text><text x="549" y="196.18" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">据工具的白名单快照；不能只 clone 后就假定已</text><text x="549" y="213.23" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">有 pipeline / Dot 回迁命令。</text><rect x="533" y="311" width="269" height="148" rx="10" fill="#EAF2FF" stroke="#2875EA"/><rect x="533" y="311" width="5" height="148" rx="2" fill="#2875EA" stroke="#2875EA"/><text x="549" y="336.62" fill="#2875EA" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">安装工具的顺序</text><text x="549" y="356.715" fill="#16233D" font-size="10.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">先解压随附包到临时目录。</text><text x="549" y="372.98999999999995" fill="#16233D" font-size="10.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">阅读本机工具补齐/README.md。</text><text x="549" y="389.265" fill="#16233D" font-size="10.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">只在新干净 clone 中复制明确文件。</text><text x="549" y="405.53999999999996" fill="#16233D" font-size="10.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">已有工作区逐文件比较，由协调者合并。</text><rect x="40" y="464" width="761.8897637795277" height="64" rx="8" fill="#FFF4D8" stroke="#FFF4D8"/><text x="54" y="483.632" fill="#A66700" font-size="10.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">预期结果</text><text x="54" y="500.885" fill="#16233D" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">Git、Python、pwsh 均可查询版本；tools/reminder_dot_backup.py 与 reminder_pipeline.py 存在。这里只准备备份环境，不启动旧本机周期学习。</text></svg></section><section class="page" id="p26"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 841.8897637795277 595.2755905511812" role="img"><rect x="0" y="0" width="841.8897637795277" height="595.2755905511812" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><rect x="0" y="0" width="10" height="595.2755905511812" rx="0" fill="#2875EA" stroke="#2875EA"/><text x="40" y="30.055" fill="#52647C" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">REMINDER / PERSONAL LEARNING SYSTEM</text><rect x="619.8897637795277" y="17" width="182" height="23" rx="6" fill="#EAF2FF" stroke="#EAF2FF"/><text x="629.8897637795277" y="30.304000000000002" fill="#2875EA" font-size="8.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">搭建 08 / Windows 本地</text><text x="40" y="71.92" fill="#16233D" font-size="24" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">私密配置账户、列表和本机凭据</text><text x="40" y="95.549" fill="#52647C" font-size="10.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">Dot OAuth 与本机网站会话是两种凭据；本机凭据从已有环境变量或私有 token 文件读取。</text><rect x="40" y="562.2755905511812" width="761.8897637795277" height="1" rx="0" fill="#DCE5F0" stroke="#DCE5F0"/><text x="40" y="576.6665905511811" fill="#52647C" font-size="7.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">核验基线 2026-10-05 14:07 CST | 实线=已有路径；虚线=待打通 / 建议配置</text><text x="755.8897637795277" y="577.3305905511811" fill="#16233D" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">26 / 36</text><rect x="40" y="133" width="465" height="164.72" rx="8" fill="#16233D" stroke="#16233D"/><text x="54" y="150.055" fill="#7ED7DF" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">Windows / PowerShell 7 · 不把 token 写在命令参数中</text><text x="54" y="169.138" fill="#FFFFFF" font-size="8.6" font-family="Consolas,monospace" font-weight="400">Set-Location F:\reminder</text><text x="54" y="182.21" fill="#FFFFFF" font-size="8.6" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">New-Item -ItemType Directory -Force 完成/.pipeline</text><text x="54" y="195.282" fill="#FFFFFF" font-size="8.6" font-family="Consolas,monospace" font-weight="400">Copy-Item reminder-dot/dot-backup-config.example.json `</text><text x="54" y="208.354" fill="#FFFFFF" font-size="8.6" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">  完成/.pipeline/dot-backup-config.json</text><text x="54" y="221.42600000000002" fill="#FFFFFF" font-size="8.6" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">notepad 完成/.pipeline/dot-backup-config.json</text><text x="54" y="234.49800000000002" fill="#FFFFFF" font-size="8.6" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400"># 在私密终端输入已有本机网站会话 token</text><text x="54" y="247.57" fill="#FFFFFF" font-size="8.6" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">$reminderSecret = Read-Host &#x27;网站会话 token&#x27; -AsSecureString</text><text x="54" y="260.642" fill="#FFFFFF" font-size="8.6" font-family="Consolas,monospace" font-weight="400">$env:SHIYI_TOKEN = `</text><text x="54" y="273.714" fill="#FFFFFF" font-size="8.6" font-family="Consolas,monospace" font-weight="400">  [System.Net.NetworkCredential]::new(&#x27;&#x27;, $reminderSecret).Password</text><text x="54" y="286.786" fill="#FFFFFF" font-size="8.6" font-family="Consolas,monospace" font-weight="400">python tools/reminder_dot_backup.py --help</text><rect x="529" y="135" width="273" height="157" rx="10" fill="#EAF2FF" stroke="#2875EA"/><rect x="529" y="135" width="5" height="157" rx="2" fill="#2875EA" stroke="#2875EA"/><text x="545" y="160.62" fill="#2875EA" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">配置文件只填写两项</text><text x="545" y="181.13" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">accountId：identity 核对的 canonical 账户</text><text x="545" y="198.18" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">UUID。</text><text x="545" y="215.23" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">listId：本人允许列表 UUID。</text><text x="545" y="232.28" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">来自私密授权回读，不能按名字猜或复制本人的值</text><text x="545" y="249.32999999999998" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">给朋友。</text><rect x="529" y="312" width="273" height="137" rx="10" fill="#FFF0E4" stroke="#F07822"/><rect x="529" y="312" width="5" height="137" rx="2" fill="#F07822" stroke="#F07822"/><text x="545" y="337.62" fill="#F07822" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">没有既有 token 时</text><text x="545" y="357.632" fill="#16233D" font-size="10.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">在本人私密终端通过网站正式登录建立本机会话。配</text><text x="545" y="373.752" fill="#16233D" font-size="10.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">套包提供 getpass 登录示例，拒绝重定向且不打印</text><text x="545" y="389.872" fill="#16233D" font-size="10.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">token；不要使用旧 login 命令把密码写到命令行。</text><rect x="40" y="464" width="761.8897637795277" height="64" rx="8" fill="#FFF4D8" stroke="#FFF4D8"/><text x="54" y="483.632" fill="#A66700" font-size="10.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">会话保存的范围</text><text x="54" y="500.885" fill="#16233D" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">临时 SHIYI_TOKEN 只在当前进程生效，不能供以后登录任务复用。需要自动登录备份时，将正式取得的会话安全保存到 tools/.shiyi_token 并限制本机读取权限；它不授予</text><text x="54" y="515.61" fill="#16233D" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">Dot 电脑权限。</text></svg></section><section class="page" id="p27"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 841.8897637795277 595.2755905511812" role="img"><rect x="0" y="0" width="841.8897637795277" height="595.2755905511812" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><rect x="0" y="0" width="10" height="595.2755905511812" rx="0" fill="#2875EA" stroke="#2875EA"/><text x="40" y="30.055" fill="#52647C" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">REMINDER / PERSONAL LEARNING SYSTEM</text><rect x="619.8897637795277" y="17" width="182" height="23" rx="6" fill="#EAF2FF" stroke="#EAF2FF"/><text x="629.8897637795277" y="30.304000000000002" fill="#2875EA" font-size="8.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">搭建 09 / Windows 本地</text><text x="40" y="71.92" fill="#16233D" font-size="24" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">执行一次备份，再注册登录触发</text><text x="40" y="95.549" fill="#52647C" font-size="10.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">触发器名为 Reminder-Dot-Backup-OnLogon；它只复制产物，不启动模型、vault 合并或 Git。</text><rect x="40" y="562.2755905511812" width="761.8897637795277" height="1" rx="0" fill="#DCE5F0" stroke="#DCE5F0"/><text x="40" y="576.6665905511811" fill="#52647C" font-size="7.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">核验基线 2026-10-05 14:07 CST | 实线=已有路径；虚线=待打通 / 建议配置</text><text x="755.8897637795277" y="577.3305905511811" fill="#16233D" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">27 / 36</text><text x="40" y="552.5005905511812" fill="#52647C" font-size="7.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">依据：install_reminder_dot_backup_trigger.ps1；备份入口</text><rect x="40" y="136" width="470" height="128.696" rx="8" fill="#16233D" stroke="#16233D"/><text x="54" y="153.055" fill="#7ED7DF" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">Windows / PowerShell 7</text><text x="54" y="172.387" fill="#FFFFFF" font-size="8.9" font-family="Consolas,monospace" font-weight="400">Set-Location F:\reminder</text><text x="54" y="185.915" fill="#FFFFFF" font-size="8.9" font-family="Consolas,monospace" font-weight="400">&amp; ./tools/reminder_dot_on_login.ps1</text><text x="54" y="199.443" fill="#FFFFFF" font-size="8.9" font-family="Consolas,monospace" font-weight="400">&amp; ./tools/install_reminder_dot_backup_trigger.ps1 -WhatIf</text><text x="54" y="212.971" fill="#FFFFFF" font-size="8.9" font-family="Consolas,monospace" font-weight="400">&amp; ./tools/install_reminder_dot_backup_trigger.ps1</text><text x="54" y="226.499" fill="#FFFFFF" font-size="8.9" font-family="Consolas,monospace" font-weight="400">Get-ScheduledTask -TaskName Reminder-Dot-Backup-OnLogon</text><text x="54" y="240.027" fill="#FFFFFF" font-size="8.9" font-family="Consolas,monospace" font-weight="400">Get-ScheduledTaskInfo -TaskName Reminder-Dot-Backup-OnLogon</text><text x="54" y="253.555" fill="#FFFFFF" font-size="8.9" font-family="Consolas,monospace" font-weight="400">python tools/reminder_pipeline.py status</text><rect x="534" y="138" width="268" height="157" rx="10" fill="#EAF2FF" stroke="#2875EA"/><rect x="534" y="138" width="5" height="157" rx="2" fill="#2875EA" stroke="#2875EA"/><text x="550" y="163.62" fill="#2875EA" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">一次备份的通过标准</text><text x="550" y="184.13" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">账户 / 列表一致。</text><text x="550" y="201.18" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">报告 Markdown 与六原件 SHA256 一致。</text><text x="550" y="218.23" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">重复备份新增 0，不覆盖冲突副本。</text><text x="550" y="235.28" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">cloudDeleted 为 false。</text><rect x="534" y="315" width="268" height="135" rx="10" fill="#EAF2FF" stroke="#2875EA"/><rect x="534" y="315" width="5" height="135" rx="2" fill="#2875EA" stroke="#2875EA"/><text x="550" y="340.62" fill="#2875EA" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">到哪里找文件</text><text x="550" y="360.217" fill="#16233D" font-size="9.9" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">完成/.pipeline/dot/账户/列表/</text><text x="550" y="375.562" fill="#16233D" font-size="9.9" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">reports/：私有报告与文件</text><text x="550" y="390.907" fill="#16233D" font-size="9.9" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">exports/：原始导出</text><text x="550" y="406.252" fill="#16233D" font-size="9.9" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">handoff.json：各阶段交接账本</text><rect x="40" y="464" width="761.8897637795277" height="64" rx="8" fill="#FFF4D8" stroke="#FFF4D8"/><text x="54" y="483.632" fill="#A66700" font-size="10.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">启动方式必须分别验收</text><text x="54" y="500.885" fill="#16233D" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">首次手动备份成功，再看注册触发器回读和真实登录执行结果。机器离线、会话过期或配置缺失时保留待同步；一次创建成功不等于每次启动都可靠。</text></svg></section><section class="page" id="p28"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 841.8897637795277 595.2755905511812" role="img"><rect x="0" y="0" width="841.8897637795277" height="595.2755905511812" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><rect x="0" y="0" width="10" height="595.2755905511812" rx="0" fill="#2875EA" stroke="#2875EA"/><text x="40" y="30.055" fill="#52647C" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">REMINDER / PERSONAL LEARNING SYSTEM</text><rect x="619.8897637795277" y="17" width="182" height="23" rx="6" fill="#EAF2FF" stroke="#EAF2FF"/><text x="629.8897637795277" y="30.304000000000002" fill="#2875EA" font-size="8.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">搭建 10 / 本机协调者</text><text x="40" y="71.92" fill="#16233D" font-size="24" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">把备份变成合格的知识交付</text><text x="40" y="95.549" fill="#52647C" font-size="10.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">以下是操作骨架；manifest、审核意见和确认回执必须来自实际产物，不能填占位值骗过验收。</text><rect x="40" y="562.2755905511812" width="761.8897637795277" height="1" rx="0" fill="#DCE5F0" stroke="#DCE5F0"/><text x="40" y="576.6665905511811" fill="#52647C" font-size="7.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">核验基线 2026-10-05 14:07 CST | 实线=已有路径；虚线=待打通 / 建议配置</text><text x="755.8897637795277" y="577.3305905511811" fill="#16233D" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">28 / 36</text><rect x="40" y="131" width="762" height="248.01600000000002" rx="8" fill="#16233D" stroke="#16233D"/><text x="54" y="148.055" fill="#7ED7DF" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">协调者操作骨架 / PowerShell 7 · Bash 换行使用反斜杠</text><text x="54" y="167.304" fill="#FFFFFF" font-size="8.8" font-family="Consolas,monospace" font-weight="400">python tools/reminder_coordinator.py status</text><text x="54" y="180.68" fill="#FFFFFF" font-size="8.8" font-family="Consolas,monospace" font-weight="400">python tools/reminder_coordinator.py acquire --owner coordinator_example</text><text x="54" y="194.056" fill="#FFFFFF" font-size="8.8" font-family="Consolas,monospace" font-weight="400">python tools/reminder_pipeline.py sync</text><text x="54" y="207.432" fill="#FFFFFF" font-size="8.8" font-family="Consolas,monospace" font-weight="400">python tools/reminder_pipeline.py status --task TASK</text><text x="54" y="220.80800000000002" fill="#FFFFFF" font-size="8.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400"># 仅已 classify 为 learning；已有 start 票据跳过 claim/start</text><text x="54" y="234.184" fill="#FFFFFF" font-size="8.8" font-family="Consolas,monospace" font-weight="400">python tools/reminder_pipeline.py claim --task TASK --owner ORIGINAL_OWNER</text><text x="54" y="247.56" fill="#FFFFFF" font-size="8.8" font-family="Consolas,monospace" font-weight="400">python tools/reminder_pipeline.py start --task TASK --owner ORIGINAL_OWNER --project PROJECT</text><text x="54" y="260.936" fill="#FFFFFF" font-size="8.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400"># 整理真实文件、合并 vault、由另一位审核者审阅</text><text x="54" y="274.312" fill="#FFFFFF" font-size="8.8" font-family="Consolas,monospace" font-weight="400">python tools/reminder_pipeline.py ready --task TASK --owner ORIGINAL_OWNER `</text><text x="54" y="287.688" fill="#FFFFFF" font-size="8.8" font-family="Consolas,monospace" font-weight="400">  --manifest PROJECT/manifest.json</text><text x="54" y="301.06399999999996" fill="#FFFFFF" font-size="8.8" font-family="Consolas,monospace" font-weight="400">python tools/reminder_pipeline.py review --task TASK --owner ORIGINAL_OWNER `</text><text x="54" y="314.44" fill="#FFFFFF" font-size="8.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">  --reviewer REVIEWER --notes &quot;实际审核意见&quot;</text><text x="54" y="327.816" fill="#FFFFFF" font-size="8.8" font-family="Consolas,monospace" font-weight="400">python tools/reminder_pipeline.py confirm-analysis --task TASK --owner ORIGINAL_OWNER `</text><text x="54" y="341.192" fill="#FFFFFF" font-size="8.8" font-family="Consolas,monospace" font-weight="400">  --coordinator coordinator_example --receipt PRIVATE_RECEIPT.json</text><text x="54" y="354.568" fill="#FFFFFF" font-size="8.8" font-family="Consolas,monospace" font-weight="400">python tools/reminder_pipeline.py render</text><text x="54" y="367.94399999999996" fill="#FFFFFF" font-size="8.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400"># 保持协调者租约：下一页 Git 收尾后再 release</text><text x="40" y="436.802" fill="#16233D" font-size="9.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">manifest：topic、project_dir、pdf、html、exercise_dir、experiment_log、vault_note、source_urls；使用真实仓库相对路径。</text><text x="40" y="466.802" fill="#16233D" font-size="9.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">receipt：schema、accountId、listId、taskId、reportId、sourceHash、backupBundle、backupSha256、handoff；只留私有 .pipeline。</text><text x="40" y="498.3" fill="#2875EA" font-size="10" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">已有 start 票据不再次 claim / start；原 owner 续约。确认只读网站来源并释放资源。真实独立审核必须先完成，任务勾选仍留给本人。</text></svg></section><section class="page" id="p29"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 841.8897637795277 595.2755905511812" role="img"><rect x="0" y="0" width="841.8897637795277" height="595.2755905511812" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><rect x="0" y="0" width="10" height="595.2755905511812" rx="0" fill="#333E57" stroke="#333E57"/><text x="40" y="30.055" fill="#52647C" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">REMINDER / PERSONAL LEARNING SYSTEM</text><rect x="619.8897637795277" y="17" width="182" height="23" rx="6" fill="#EEF1F7" stroke="#EEF1F7"/><text x="629.8897637795277" y="30.304000000000002" fill="#333E57" font-size="8.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">搭建 11 / 本机 Git 协调</text><text x="40" y="71.92" fill="#16233D" font-size="24" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">只提交审核过的学习成果</text><text x="40" y="95.549" fill="#52647C" font-size="10.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">当前使用独立公开知识发布副本隔离私有网站历史；不把整个工作分支直接推到公开仓库。</text><rect x="40" y="562.2755905511812" width="761.8897637795277" height="1" rx="0" fill="#DCE5F0" stroke="#DCE5F0"/><text x="40" y="576.6665905511811" fill="#52647C" font-size="7.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">核验基线 2026-10-05 14:07 CST | 实线=已有路径；虚线=待打通 / 建议配置</text><text x="755.8897637795277" y="577.3305905511811" fill="#16233D" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">29 / 36</text><rect x="40" y="132" width="510" height="195.728" rx="8" fill="#16233D" stroke="#16233D"/><text x="54" y="149.055" fill="#7ED7DF" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">Windows 唯一协调者 / PowerShell · 文件名按真实交付替换</text><text x="54" y="167.308" fill="#FFFFFF" font-size="7.6" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">git -C 完成/.pipeline/knowledge-publication status --short</text><text x="54" y="178.85999999999999" fill="#FFFFFF" font-size="7.6" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">git -C 完成/.pipeline/knowledge-publication diff --cached --name-only</text><text x="54" y="190.41199999999998" fill="#FFFFFF" font-size="7.6" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400"># 暂存区归属明确且已知；按本次审核文件逐个列出</text><text x="54" y="201.964" fill="#FFFFFF" font-size="7.6" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">git -C 完成/.pipeline/knowledge-publication add -- `</text><text x="54" y="213.516" fill="#FFFFFF" font-size="7.6" font-family="Consolas,monospace" font-weight="400">  PROJECT/guide.pdf PROJECT/guide.html `</text><text x="54" y="225.06799999999998" fill="#FFFFFF" font-size="7.6" font-family="Consolas,monospace" font-weight="400">  PROJECT/exercise/main.py PROJECT/experiment_log.txt `</text><text x="54" y="236.62" fill="#FFFFFF" font-size="7.6" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">  vault/项目笔记/PROJECT.md vault/概念/CONCEPT.md vault/00-总览.md</text><text x="54" y="248.172" fill="#FFFFFF" font-size="7.6" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">git -C 完成/.pipeline/knowledge-publication diff --cached --stat</text><text x="54" y="259.724" fill="#FFFFFF" font-size="7.6" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">git -C 完成/.pipeline/knowledge-publication diff --cached</text><text x="54" y="271.27599999999995" fill="#FFFFFF" font-size="7.6" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">git -C 完成/.pipeline/knowledge-publication commit -m &quot;learn: 项目指南与实测知识入库&quot;</text><text x="54" y="282.828" fill="#FFFFFF" font-size="7.6" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">git -C 完成/.pipeline/knowledge-publication push origin main</text><text x="54" y="294.38" fill="#FFFFFF" font-size="7.6" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">git -C 完成/.pipeline/knowledge-publication rev-parse HEAD</text><text x="54" y="305.932" fill="#FFFFFF" font-size="7.6" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">git -C 完成/.pipeline/knowledge-publication ls-remote origin refs/heads/main</text><text x="54" y="317.484" fill="#FFFFFF" font-size="7.6" font-family="Consolas,monospace" font-weight="400">python tools/reminder_coordinator.py release --owner coordinator_example</text><rect x="574" y="134" width="228" height="162" rx="10" fill="#EEF1F7" stroke="#333E57"/><rect x="574" y="134" width="5" height="162" rx="2" fill="#333E57" stroke="#333E57"/><text x="590" y="159.62" fill="#333E57" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">通过标准</text><text x="590" y="179.632" fill="#16233D" font-size="10.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">已核对指南、日志、笔记不含私密原记录</text><text x="590" y="195.752" fill="#16233D" font-size="10.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">。</text><text x="590" y="211.872" fill="#16233D" font-size="10.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">提交 hooks 通过。</text><text x="590" y="227.99200000000002" fill="#16233D" font-size="10.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">推送后的远端 main SHA 与本次 commit</text><text x="590" y="244.11200000000002" fill="#16233D" font-size="10.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">相同。</text><text x="590" y="260.232" fill="#16233D" font-size="10.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">账本再记 pushed + SHA。</text><rect x="574" y="317" width="228" height="130" rx="10" fill="#FFF4D8" stroke="#A66700"/><rect x="574" y="317" width="5" height="130" rx="2" fill="#A66700" stroke="#A66700"/><text x="590" y="342.62" fill="#A66700" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">出现拒绝或冲突</text><text x="590" y="362.549" fill="#16233D" font-size="10.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">保留本次文件与提交，先核对远端。</text><text x="590" y="378.51399999999995" fill="#16233D" font-size="10.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">共享工作区不自动 rebase / reset。</text><text x="590" y="394.479" fill="#16233D" font-size="10.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">不强推，不跳 hooks，不全仓 add。</text><rect x="40" y="464" width="761.8897637795277" height="64" rx="8" fill="#FFF4D8" stroke="#FFF4D8"/><text x="54" y="483.632" fill="#A66700" font-size="10.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">独立发布副本的初始化</text><text x="54" y="500.885" fill="#16233D" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">先 clone 已确认的公开知识仓库到上述目录；仅复制明确审核文件。新手自己 fork 时更新远端目标，核对仓库可见性，不能将私人学习内容默认公开。</text></svg></section><section class="page" id="p30"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 841.8897637795277 595.2755905511812" role="img"><rect x="0" y="0" width="841.8897637795277" height="595.2755905511812" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><rect x="0" y="0" width="10" height="595.2755905511812" rx="0" fill="#087B68" stroke="#087B68"/><text x="40" y="30.055" fill="#52647C" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">REMINDER / PERSONAL LEARNING SYSTEM</text><rect x="619.8897637795277" y="17" width="182" height="23" rx="6" fill="#E7F6EF" stroke="#E7F6EF"/><text x="629.8897637795277" y="30.304000000000002" fill="#087B68" font-size="8.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">搭建 12 / Obsidian 与换机</text><text x="40" y="71.92" fill="#16233D" font-size="24" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">打开 vault，让概念成为可点击的网络</text><text x="40" y="95.549" fill="#52647C" font-size="10.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">Obsidian 的 vault 是一个本地文件夹；没有“上传到 Obsidian 服务器”这个必需步骤。</text><rect x="40" y="562.2755905511812" width="761.8897637795277" height="1" rx="0" fill="#DCE5F0" stroke="#DCE5F0"/><text x="40" y="576.6665905511811" fill="#52647C" font-size="7.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">核验基线 2026-10-05 14:07 CST | 实线=已有路径；虚线=待打通 / 建议配置</text><text x="755.8897637795277" y="577.3305905511811" fill="#16233D" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">30 / 36</text><text x="40" y="552.5005905511812" fill="#52647C" font-size="7.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">依据：Obsidian 内部链接与图谱 [S4][S5]</text><rect x="40" y="133" width="366" height="143" rx="10" fill="#E7F6EF" stroke="#087B68"/><rect x="40" y="133" width="5" height="143" rx="2" fill="#087B68" stroke="#087B68"/><text x="56" y="158.62" fill="#087B68" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">Windows 界面步骤</text><text x="56" y="179.13" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">安装并打开 Obsidian → 打开已有文件夹为 vault → 选择</text><text x="56" y="196.18" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">F:\reminder\vault → 打开 00-总览.md → 点项目笔记和 [[概念链接</text><text x="56" y="213.23" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">]] → 打开图谱 / 当前笔记局部图谱。</text><rect x="430" y="133" width="372" height="143" rx="10" fill="#E7F6EF" stroke="#087B68"/><rect x="430" y="133" width="5" height="143" rx="2" fill="#087B68" stroke="#087B68"/><text x="446" y="158.62" fill="#087B68" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">知识入库的四个动作</text><text x="446" y="179.13" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">新概念写一句话定义和证据。</text><text x="446" y="196.18" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">同义概念合并，保留别名。</text><text x="446" y="213.23" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">相关概念互链，注明关系。</text><text x="446" y="230.28" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">项目笔记链接指南、实验并更新总览。</text><rect x="40" y="307" width="762" height="102.4" rx="8" fill="#16233D" stroke="#16233D"/><text x="54" y="324.055" fill="#7ED7DF" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">换机首次 clone；已克隆且工作区干净才 pull / Bash 或 PowerShell</text><text x="54" y="343.47" fill="#FFFFFF" font-size="9.0" font-family="Consolas,monospace" font-weight="400">git clone https://github.com/Smashwinny/reminder_knowlege.git REMINDER_NEW_DEVICE</text><text x="54" y="357.15000000000003" fill="#FFFFFF" font-size="9.0" font-family="Consolas,monospace" font-weight="400">cd REMINDER_NEW_DEVICE</text><text x="54" y="370.83000000000004" fill="#FFFFFF" font-size="9.0" font-family="Consolas,monospace" font-weight="400">git status --short</text><text x="54" y="384.51000000000005" fill="#FFFFFF" font-size="9.0" font-family="Consolas,monospace" font-weight="400">git pull --ff-only</text><text x="54" y="398.19000000000005" fill="#FFFFFF" font-size="9.0" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400"># Obsidian 里打开 REMINDER_NEW_DEVICE/vault</text><rect x="40" y="442" width="761.8897637795277" height="77" rx="8" fill="#FFF4D8" stroke="#FFF4D8"/><text x="54" y="461.632" fill="#A66700" font-size="10.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">同步与写入纪律</text><text x="54" y="478.885" fill="#16233D" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">Git 同步 Markdown 和已审核学习文件；私人备份另走安全渠道。未提交的手动笔记先保留并明确合并，不能靠 pull 覆盖。换机阅读可以；多台同时学习或写 vault 需要重新</text><text x="54" y="493.61" fill="#16233D" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">协调唯一写入者。</text></svg></section><section class="page" id="p31"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 841.8897637795277 595.2755905511812" role="img"><rect x="0" y="0" width="841.8897637795277" height="595.2755905511812" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><rect x="0" y="0" width="10" height="595.2755905511812" rx="0" fill="#087B68" stroke="#087B68"/><text x="40" y="30.055" fill="#52647C" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">REMINDER / PERSONAL LEARNING SYSTEM</text><rect x="619.8897637795277" y="17" width="182" height="23" rx="6" fill="#E7F6EF" stroke="#E7F6EF"/><text x="629.8897637795277" y="30.304000000000002" fill="#087B68" font-size="8.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">搭建 13 / 每日复习</text><text x="40" y="71.92" fill="#16233D" font-size="24" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">把复习责任交给 Dot，把评分留给本人</text><text x="40" y="95.549" fill="#52647C" font-size="10.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">下面是建议的日程指令；本次只交付手册，未修改已有复习日程或新增自动化。</text><rect x="40" y="562.2755905511812" width="761.8897637795277" height="1" rx="0" fill="#DCE5F0" stroke="#DCE5F0"/><text x="40" y="576.6665905511811" fill="#52647C" font-size="7.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">核验基线 2026-10-05 14:07 CST | 实线=已有路径；虚线=待打通 / 建议配置</text><text x="755.8897637795277" y="577.3305905511811" fill="#16233D" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">31 / 36</text><rect x="40" y="131" width="478" height="220" rx="9" fill="#E7F6EF" stroke="#E7F6EF"/><text x="55" y="156.96" fill="#087B68" font-size="12" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">给 Dot 的可复制复习指令</text><text x="55" y="186.379" fill="#16233D" font-size="11.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">每天北京时间 20:30，基于已发布且能实际读取的知识笔记，挑 3–5 个近期概念或我上次</text><text x="55" y="206.379" fill="#16233D" font-size="11.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">答错的概念，先只给问题，不给答案。问定义、原理、一个反例和一个迁移用途；我回答</text><text x="55" y="226.379" fill="#16233D" font-size="11.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">后再用原笔记和真实实验证据反馈。请生成带日期的复习草稿，记录我的原回答、0/1/2</text><text x="55" y="246.379" fill="#16233D" font-size="11.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">评分建议、错因和下次日期，待我确认。本机离线只留云端草稿；上线后由唯一协调者合</text><text x="55" y="266.379" fill="#16233D" font-size="11.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">并 vault。不要读取获准范围外的私密记录，也不要把评分写进任务完成状态。请确认日程</text><text x="55" y="286.379" fill="#16233D" font-size="11.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">实际保存结果。</text><rect x="547" y="134" width="255" height="148" rx="10" fill="#E7F6EF" stroke="#087B68"/><rect x="547" y="134" width="5" height="148" rx="2" fill="#087B68" stroke="#087B68"/><text x="563" y="159.62" fill="#087B68" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">建议新增的笔记</text><text x="563" y="179.881" fill="#16233D" font-size="10.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">vault/复习/日期.md</text><text x="563" y="196.466" fill="#16233D" font-size="10.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">概念链接 + 问题</text><text x="563" y="213.05100000000002" fill="#16233D" font-size="10.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">本人回答 + 错因</text><text x="563" y="229.636" fill="#16233D" font-size="10.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">评分建议 + 本人确认</text><text x="563" y="246.221" fill="#16233D" font-size="10.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">下一次复习日期</text><rect x="547" y="302" width="255" height="128" rx="10" fill="#F0EAFF" stroke="#764FE3"/><rect x="547" y="302" width="5" height="128" rx="2" fill="#764FE3" stroke="#764FE3"/><text x="563" y="327.62" fill="#764FE3" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">日程回读要看</text><text x="563" y="347.881" fill="#16233D" font-size="10.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">Asia/Shanghai / 每日时点</text><text x="563" y="364.46599999999995" fill="#16233D" font-size="10.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">复习来源和范围</text><text x="563" y="381.051" fill="#16233D" font-size="10.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">是否等待本人回答</text><text x="563" y="397.63599999999997" fill="#16233D" font-size="10.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">通知方式与无变化时静默</text><rect x="40" y="454" width="761.8897637795277" height="68" rx="8" fill="#FFF4D8" stroke="#FFF4D8"/><text x="54" y="473.632" fill="#A66700" font-size="10.4" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">与十五分钟学习日程分开</text><text x="54" y="490.885" fill="#16233D" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">学习调度负责加工新资料；复习日程负责检验本人能否回忆和应用。本机评分数据库与间隔算法尚未验收，模板需首次答题和写回验证后才能称已运行。</text></svg></section><section class="page" id="p32"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 841.8897637795277 595.2755905511812" role="img"><rect x="0" y="0" width="841.8897637795277" height="595.2755905511812" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><rect x="0" y="0" width="10" height="595.2755905511812" rx="0" fill="#2875EA" stroke="#2875EA"/><text x="40" y="30.055" fill="#52647C" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">REMINDER / PERSONAL LEARNING SYSTEM</text><rect x="619.8897637795277" y="17" width="182" height="23" rx="6" fill="#EAF2FF" stroke="#EAF2FF"/><text x="629.8897637795277" y="30.304000000000002" fill="#2875EA" font-size="8.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">系统联调验收</text><text x="40" y="71.92" fill="#16233D" font-size="24" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">用一条真实链接走通十个检查点</text><text x="40" y="95.549" fill="#52647C" font-size="10.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">这是一份可执行的验收清单；仅在本人受控账户和允许列表里试运行。</text><rect x="40" y="562.2755905511812" width="761.8897637795277" height="1" rx="0" fill="#DCE5F0" stroke="#DCE5F0"/><text x="40" y="576.6665905511811" fill="#52647C" font-size="7.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">核验基线 2026-10-05 14:07 CST | 实线=已有路径；虚线=待打通 / 建议配置</text><text x="755.8897637795277" y="577.3305905511811" fill="#16233D" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">32 / 36</text><rect x="40" y="131" width="761.8897637795277" height="30" rx="6" fill="#16233D" stroke="#16233D"/><text x="51" y="147.885" fill="#FFFFFF" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">检查点</text><text x="270" y="147.885" fill="#FFFFFF" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">实际通过标准</text><rect x="40" y="161" width="761.8897637795277" height="30.950000000000003" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><text x="51" y="176.719" fill="#16233D" font-size="9.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">1 · 手机保存 / 同账号回读</text><text x="270" y="176.719" fill="#16233D" font-size="9.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">电脑网站能看到同一任务；正文与 ID 一致</text><rect x="40" y="191.95" width="761.8897637795277" height="30.950000000000003" rx="0" fill="#EDF2FA" stroke="#EDF2FA"/><text x="51" y="207.66899999999998" fill="#16233D" font-size="9.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">2 · HTTPS / 服务健康</text><text x="270" y="207.66899999999998" fill="#16233D" font-size="9.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">域名健康端点成功；数据卷可持续保留</text><rect x="40" y="222.89999999999998" width="761.8897637795277" height="30.950000000000003" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><text x="51" y="238.61899999999997" fill="#16233D" font-size="9.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">3 · 身份 / 范围 / 隔离</text><text x="270" y="238.61899999999997" fill="#16233D" font-size="9.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">identity 与本人范围一致；受控清单外 / 他人账户真实测试被拒绝</text><rect x="40" y="253.84999999999997" width="761.8897637795277" height="30.950000000000003" rx="0" fill="#EDF2FA" stroke="#EDF2FA"/><text x="51" y="269.56899999999996" fill="#16233D" font-size="9.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">4 · 初步分类</text><text x="270" y="269.56899999999996" fill="#16233D" font-size="9.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">实际读原来源；有理由、知识关联、下一步；回读后释放</text><rect x="40" y="284.79999999999995" width="761.8897637795277" height="30.950000000000003" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><text x="51" y="300.51899999999995" fill="#16233D" font-size="9.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">5 · full 领取与互斥</text><text x="270" y="300.51899999999995" fill="#16233D" font-size="9.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">同源、同项目无并行；唯一 owner；已有租约不抢占</text><rect x="40" y="315.74999999999994" width="761.8897637795277" height="30.950000000000003" rx="0" fill="#EDF2FA" stroke="#EDF2FA"/><text x="51" y="331.46899999999994" fill="#16233D" font-size="9.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">6 · 实验 / PDF / 独立审核</text><text x="270" y="331.46899999999994" fill="#16233D" font-size="9.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">真实命令日志；逐页无排版问题；独立检查记录</text><rect x="40" y="346.69999999999993" width="761.8897637795277" height="30.950000000000003" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><text x="51" y="362.4189999999999" fill="#16233D" font-size="9.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">7 · 网站完整报告</text><text x="270" y="362.4189999999999" fill="#16233D" font-size="9.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">六原件及完整标签可回读；任务 state 不由智能体更改</text><rect x="40" y="377.6499999999999" width="761.8897637795277" height="30.950000000000003" rx="0" fill="#EDF2FA" stroke="#EDF2FA"/><text x="51" y="393.3689999999999" fill="#16233D" font-size="9.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">8 · 本机备份</text><text x="270" y="393.3689999999999" fill="#16233D" font-size="9.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">全部 SHA256 相同；重复拉取新增 0；云端原件保留</text><rect x="40" y="408.5999999999999" width="761.8897637795277" height="30.950000000000003" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><text x="51" y="424.3189999999999" fill="#16233D" font-size="9.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">9 · 入库 / Git</text><text x="270" y="424.3189999999999" fill="#16233D" font-size="9.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">概念关联可点击；远端 SHA 确认；私密原文不公开</text><rect x="40" y="439.5499999999999" width="761.8897637795277" height="30.950000000000003" rx="0" fill="#EDF2FA" stroke="#EDF2FA"/><text x="51" y="455.2689999999999" fill="#16233D" font-size="9.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">10 · 本人复习与完成</text><text x="270" y="455.2689999999999" fill="#16233D" font-size="9.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">先答题看反馈；由本人点击任务完成；标签仍保留</text></svg></section><section class="page" id="p33"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 841.8897637795277 595.2755905511812" role="img"><rect x="0" y="0" width="841.8897637795277" height="595.2 font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">Reminder / 拾遗</text><text x="193" y="177.051" fill="#16233D" font-size="9.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">低摩擦记录；手机网页同账号；任务和报告关联</text><text x="496" y="177.051" fill="#16233D" font-size="9.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">网站是正式源，旧本机服务不能重新成为第二源</text><rect x="40" y="192.55" width="761.8897637795277" height="31.549999999999997" rx="0" fill="#EDF2FA" stroke="#EDF2FA"/><text x="51" y="208.601" fill="#16233D" font-size="9.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">Dot</text><text x="193" y="208.601" fill="#16233D" font-size="9.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">云端电脑与长任务协调；机器关机仍可云端工作</text><text x="496" y="208.601" fill="#16233D" font-size="9.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">实际工具、权限、额度与环境会限制任务</text><rect x="40" y="224.10000000000002" width="761.8897637795277" height="31.549999999999997" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><text x="51" y="240.151" fill="#16233D" font-size="9.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">learn-project skill</text><text x="193" y="240.151" fill="#16233D" font-size="9.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">统一疑问、讲解、能力、实验、产物和知识沉淀</text><text x="496" y="240.151" fill="#16233D" font-size="9.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">方法本身不是执行引擎；必须真的运行</text><rect x="40" y="255.65000000000003" width="761.8897637795277" height="31.549999999999997" rx="0" fill="#EDF2FA" stroke="#EDF2FA"/><text x="51" y="271.701" fill="#16233D" font-size="9.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">MCP + OAuth</text><text x="193" y="271.701" fill="#16233D" font-size="9.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">把限定工具和授权范围提供给智能体</text><text x="496" y="271.701" fill="#16233D" font-size="9.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">工具提示不是安全权限；服务端逐请求检查</text><rect x="40" y="287.20000000000005" width="761.8897637795277" height="31.549999999999997" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><text x="51" y="303.25100000000003" fill="#16233D" font-size="9.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">Obsidian</text><text x="193" y="303.25100000000003" fill="#16233D" font-size="9.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">本地 Markdown、双链、局部图谱、可迁移</text><text x="496" y="303.25100000000003" fill="#16233D" font-size="9.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">图谱是笔记关联视图，不能证明本人掌握</text><rect x="40" y="318.75000000000006" width="761.8897637795277" height="31.549999999999997" rx="0" fill="#EDF2FA" stroke="#EDF2FA"/><text x="51" y="334.80100000000004" fill="#16233D" font-size="9.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">Git / GitHub</text><text x="193" y="334.80100000000004" fill="#16233D" font-size="9.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">版本历史、可回溯变更、多设备传递学习成果</text><text x="496" y="334.80100000000004" fill="#16233D" font-size="9.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">公开仓库不是私密备份；不能替代任务租约</text><rect x="40" y="350.30000000000007" width="761.8897637795277" height="31.549999999999997" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><text x="51" y="366.35100000000006" fill="#16233D" font-size="9.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">Docker / Compose</text><text x="193" y="366.35100000000006" fill="#16233D" font-size="9.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">可移植的站点运行配置与独立数据卷</text><text x="496" y="366.35100000000006" fill="#16233D" font-size="9.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">卷需要异机备份；多副本不能直接共享 JSON 写入</text></svg></section><section class="page" id="p34"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 841.8897637795277 595.2755905511812" role="img"><rect x="0" y="0" width="841.8897637795277" height="595.2755905511812" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><rect x="0" y="0" width="10" height="595.2755905511812" rx="0" fill="#A66700" stroke="#A66700"/><text x="40" y="30.055" fill="#52647C" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">REMINDER / PERSONAL LEARNING SYSTEM</text><rect x="619.8897637795277" y="17" width="182" height="23" rx="6" fill="#FFF4D8" stroke="#FFF4D8"/><text x="629.8897637795277" y="30.304000000000002" fill="#A66700" font-size="8.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">附录 B / 排错与维护</text><text x="40" y="71.92" fill="#16233D" font-size="24" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">先定位失败环节，再做对应修复</text><text x="40" y="95.549" fill="#52647C" font-size="10.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">失败时保留原件和已有状态，不把缓存当本次网站真值，不用新 owner 绕开旧租约。</text><rect x="40" y="562.2755905511812" width="761.8897637795277" height="1" rx="0" fill="#DCE5F0" stroke="#DCE5F0"/><text x="40" y="576.6665905511811" fill="#52647C" font-size="7.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">核验基线 2026-10-05 14:07 CST | 实线=已有路径；虚线=待打通 / 建议配置</text><text x="755.8897637795277" y="577.3305905511811" fill="#16233D" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">34 / 36</text><rect x="40" y="131" width="761.8897637795277" height="30" rx="6" fill="#16233D" stroke="#16233D"/><text x="51" y="147.885" fill="#FFFFFF" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">现象</text><text x="235" y="147.885" fill="#FFFFFF" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">优先核对</text><text x="534" y="147.885" fill="#FFFFFF" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">下一步</text><rect x="40" y="161" width="761.8897637795277" height="30.65" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><text x="51" y="176.553" fill="#16233D" font-size="9.1" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">链接只有壳 / 视频读不到</text><text x="235" y="176.553" fill="#16233D" font-size="9.1" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">原文、作者、出链 / 字幕是否真实可访问</text><text x="534" y="176.553" fill="#16233D" font-size="9.1" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">标证据不足；补公开来源或本人笔记</text><rect x="40" y="191.65" width="761.8897637795277" height="30.65" rx="0" fill="#EDF2FA" stroke="#EDF2FA"/><text x="51" y="207.203" fill="#16233D" font-size="9.1" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">OAuth / MCP 503</text><text x="235" y="207.203" fill="#16233D" font-size="9.1" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">四项 Dot 门控配置是否齐备并已生效</text><text x="534" y="207.203" fill="#16233D" font-size="9.1" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">唯一运维者修配置；健康与 discovery 回读</text><rect x="40" y="222.3" width="761.8897637795277" height="30.65" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><text x="51" y="237.853" fill="#16233D" font-size="9.1" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">401 / 授权失效</text><text x="235" y="237.853" fill="#16233D" font-size="9.1" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">对应凭据类别、过期、scope 与 resource</text><text x="534" y="237.853" fill="#16233D" font-size="9.1" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">正式私密重新连接；不打印 token</text><rect x="40" y="252.95000000000002" width="761.8897637795277" height="30.65" rx="0" fill="#EDF2FA" stroke="#EDF2FA"/><text x="51" y="268.50300000000004" fill="#16233D" font-size="9.1" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">409 / 已有租约</text><text x="235" y="268.50300000000004" fill="#16233D" font-size="9.1" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">任务、同源、项目和原 owner</text><text x="534" y="268.50300000000004" fill="#16233D" font-size="9.1" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">跳过或原 owner 续约；不自动抢占</text><rect x="40" y="283.6" width="761.8897637795277" height="30.65" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><text x="51" y="299.153" fill="#16233D" font-size="9.1" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">上传超出 1 MB</text><text x="235" y="299.153" fill="#16233D" font-size="9.1" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">实际六类文件总大小</text><text x="534" y="299.153" fill="#16233D" font-size="9.1" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">保留受阻；不能删关键证据伪装完整</text><rect x="40" y="314.25" width="761.8897637795277" height="30.65" rx="0" fill="#EDF2FA" stroke="#EDF2FA"/><text x="51" y="329.803" fill="#16233D" font-size="9.1" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">备份通过但 Git 未更新</text><text x="235" y="329.803" fill="#16233D" font-size="9.1" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">handoff 的知识入库 / commit / push 状态</text><text x="534" y="329.803" fill="#16233D" font-size="9.1" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">协调者继续审核与明确文件推送</text><rect x="40" y="344.9" width="761.8897637795277" height="30.65" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><text x="51" y="360.453" fill="#16233D" font-size="9.1" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">Git 暂存归属不明 / 远端拒绝</text><text x="235" y="360.453" fill="#16233D" font-size="9.1" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">暂存清单、远端变更、当前协调者</text><text x="534" y="360.453" fill="#16233D" font-size="9.1" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">保留现场；不 reset / 强推 / 自动 rebase</text><rect x="40" y="375.54999999999995" width="761.8897637795277" height="30.65" rx="0" fill="#EDF2FA" stroke="#EDF2FA"/><text x="51" y="391.10299999999995" fill="#16233D" font-size="9.1" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">Dot 不能唤醒本机聊天</text><text x="235" y="391.10299999999995" fill="#16233D" font-size="9.1" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">设备在线、正式路由与 PING / PONG 回执</text><text x="534" y="391.10299999999995" fill="#16233D" font-size="9.1" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">当前 NOT_FOUND 未通过；不要归因于 OAuth</text><rect x="40" y="406.19999999999993" width="761.8897637795277" height="30.65" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><text x="51" y="421.75299999999993" fill="#16233D" font-size="9.1" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">Obsidian 链接断了</text><text x="235" y="421.75299999999993" fill="#16233D" font-size="9.1" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">vault 打开位置、笔记名、相对路径</text><text x="534" y="421.75299999999993" fill="#16233D" font-size="9.1" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">修正 Markdown 链接；不重复生成同义概念</text></svg></section><section class="page" id="p35"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 841.8897637795277 595.2755905511812" role="img"><rect x="0" y="0" width="841.8897637795277" height="595.2755905511812" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><rect x="0" y="0" width="10" height="595.2755905511812" rx="0" fill="#764FE3" stroke="#764FE3"/><text x="40" y="30.055" fill="#52647C" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">REMINDER / PERSONAL LEARNING SYSTEM</text><rect x="619.8897637795277" y="17" width="182" height="23" rx="6" fill="#F0EAFF" stroke="#F0EAFF"/><text x="629.8897637795277" y="30.304000000000002" fill="#764FE3" font-size="8.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">面向伙伴 / 演进路线</text><text x="40" y="71.92" fill="#16233D" font-size="24" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">从个人闭环，走向可复制的产品</text><text x="40" y="95.549" fill="#52647C" font-size="10.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">这是演进建议与验证指标；没有把个人实验包装成已验证的企业多租户平台。</text><rect x="40" y="562.2755905511812" width="761.8897637795277" height="1" rx="0" fill="#DCE5F0" stroke="#DCE5F0"/><text x="40" y="576.6665905511811" fill="#52647C" font-size="7.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">核验基线 2026-10-05 14:07 CST | 实线=已有路径；虚线=待打通 / 建议配置</text><text x="755.8897637795277" y="577.3305905511811" fill="#16233D" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">35 / 36</text><rect x="40" y="132" width="246" height="193" rx="10" fill="#F0EAFF" stroke="#764FE3"/><rect x="40" y="132" width="5" height="193" rx="2" fill="#764FE3" stroke="#764FE3"/><text x="56" y="157.62" fill="#764FE3" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">现在 · 证明端到端价值</text><text x="56" y="178.13" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">已拿到真实云端报告、实验证据、独立审核</text><text x="56" y="195.18" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">、本机知识与 Git。用一条真实学习项目演</text><text x="56" y="212.23" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">示，可让伙伴直接看到输入与产出。</text><rect x="298" y="132" width="246" height="193" rx="10" fill="#EAF2FF" stroke="#2875EA"/><rect x="298" y="132" width="5" height="193" rx="2" fill="#2875EA" stroke="#2875EA"/><text x="314" y="157.62" fill="#2875EA" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">下一步 · 补齐自动收尾</text><text x="314" y="178.13" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">原生本机唤醒、票据续约、新记录派发、知</text><text x="314" y="195.18" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">识索引更新、复习写回都需明确验收。解决</text><text x="314" y="212.23" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">“报告完成后仍等协调者”的断点。</text><rect x="556" y="132" width="246" height="193" rx="10" fill="#FFF0E4" stroke="#F07822"/><rect x="556" y="132" width="5" height="193" rx="2" fill="#F07822" stroke="#F07822"/><text x="572" y="157.62" fill="#F07822" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">再扩展 · 才谈团队规模</text><text x="572" y="178.13" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">多账户授权隔离、事务租约、分块产物存储</text><text x="572" y="195.18" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">、稳定事件触发、成本审计和恢复演练。现</text><text x="572" y="212.23" fill="#16233D" font-size="11" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">单进程 JSON 存储不直接扩成多副本。</text><rect x="40" y="353" width="761.8897637795277" height="30" rx="6" fill="#16233D" stroke="#16233D"/><text x="51" y="369.885" fill="#FFFFFF" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">向伙伴 / 投资人展示的指标</text><text x="398" y="369.885" fill="#FFFFFF" font-size="9.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">应该怎样测</text><rect x="40" y="383" width="761.8897637795277" height="32.3" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><text x="51" y="399.466" fill="#16233D" font-size="10.2" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">来源核实率 / 可学习比例</text><text x="398" y="399.466" fill="#16233D" font-size="10.2" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">真实输入中多少能确认目标；不可读与非学习分开</text><rect x="40" y="415.3" width="761.8897637795277" height="32.3" rx="0" fill="#EDF2FA" stroke="#EDF2FA"/><text x="51" y="431.766" fill="#16233D" font-size="10.2" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">复现通过率 / 审核退回率</text><text x="398" y="431.766" fill="#16233D" font-size="10.2" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">以实际实验和独立审核计算，不以文件存在计算</text><rect x="40" y="447.6" width="761.8897637795277" height="32.3" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><text x="51" y="464.06600000000003" fill="#16233D" font-size="10.2" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">回迁与推送时延 / 恢复成功率</text><text x="398" y="464.06600000000003" fill="#16233D" font-size="10.2" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">分别记录网站保存、本机入库、远端 push 的时间</text><rect x="40" y="479.90000000000003" width="761.8897637795277" height="32.3" rx="0" fill="#EDF2FA" stroke="#EDF2FA"/><text x="51" y="496.36600000000004" fill="#16233D" font-size="10.2" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">七天后可解释和可迁移的比例</text><text x="398" y="496.36600000000004" fill="#16233D" font-size="10.2" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">本人闭卷回答和小实验；没有实际数据不填提升百分比</text><text x="40" y="526.221" fill="#52647C" font-size="8.7" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">成本账：云服务器 / 域名、Dot 账户额度、摘要 API、实验资源、审核与协调投入分别记录；本手册没有给未经核对的价格或投资回报承诺。</text></svg></section><section class="page" id="p36"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 841.8897637795277 595.2755905511812" role="img"><rect x="0" y="0" width="841.8897637795277" height="595.2755905511812" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><rect x="0" y="0" width="10" height="595.2755905511812" rx="0" fill="#333E57" stroke="#333E57"/><text x="40" y="30.055" fill="#52647C" font-size="8.5" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">REMINDER / PERSONAL LEARNING SYSTEM</text><rect x="619.8897637795277" y="17" width="182" height="23" rx="6" fill="#EEF1F7" stroke="#EEF1F7"/><text x="629.8897637795277" y="30.304000000000002" fill="#333E57" font-size="8.8" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">附录 C / 依据与配套文件</text><text x="40" y="71.92" fill="#16233D" font-size="24" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700">这份讲解如何被核对和复用</text><text x="40" y="95.549" fill="#52647C" font-size="10.3" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="400">报告为 2026-10-0
