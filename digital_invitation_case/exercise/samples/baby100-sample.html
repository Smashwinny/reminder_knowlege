<!DOCTYPE html>
<html lang="zh">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>百日宴请柬样品</title>
<style>
:root{--main:#5aa7c9;--ink:#33444d}
body{margin:0;font-family:"Microsoft YaHei",sans-serif;background:linear-gradient(160deg,#f0f9ff,#fff8ee);color:var(--ink);text-align:center}
.card{max-width:420px;margin:24px auto;background:#fff;border-radius:16px;box-shadow:0 8px 30px rgba(90,167,201,.18);padding:40px 28px}
.badge{display:inline-block;background:var(--main);color:#fff;border-radius:999px;font-size:11px;padding:2px 10px;margin-bottom:14px}
h1{font-size:22px;margin:8px 0}
.baby{font-size:44px;margin:10px 0}
.edit{border-bottom:2px dashed #a8d0e3;padding:0 6px;min-width:32px;display:inline-block}
.edit:focus{outline:3px solid #7c4dff;background:#fff3a6}
.meta{font-size:14px;line-height:2.1;margin-top:16px;color:#5a6d77}
.footer-note{font-size:11px;color:#9ab0bb;margin-top:20px}
</style></head>
<body>
<div class="card">
<span class="badge">样品 v1 · 可修改范围见附单</span>
<h1>宝宝百日宴</h1>
<div class="baby">🍼</div>
<p class="meta">
<span class="edit" contenteditable="true" role="textbox">宝宝大名 / 小名</span> 小宝贝<br>
诞生于 <span class="edit" contenteditable="true" role="textbox">2026 年 X 月 X 日</span><br>
百日之喜 · <span class="edit" contenteditable="true" role="textbox">宴设 XX 酒店</span><br>
<span class="edit" contenteditable="true" role="textbox">X 月 X 日 X 时</span> 敬备薄宴
</p>
<p class="footer-note">点击虚线字段可直接编辑（4 项）｜配色/字体/版式为固定模板项｜样品仅用于需求验证</p>
</div>
</body>
</html>
