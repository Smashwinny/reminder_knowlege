<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>像素村 — Three.js 像素风 3D 世界复刻 demo</title>
<style>
  html,body{margin:0;padding:0;background:#12121c;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  #game{
    width:960px;height:540px;
    image-rendering:pixelated;          /* 关键：CSS 放大时保留硬像素边 */
    image-rendering:crisp-edges;
    border:4px solid #2e86de;border-radius:6px;box-shadow:0 0 40px #2e86de55;
    background:#000;
  }
  #hud{
    color:#f1c40f;font:14px/1.6 Consolas,monospace;background:#000a;
    padding:6px 14px;border-radius:6px;margin-top:10px;letter-spacing:0.5px;
  }
</style>
</head>
<body>
<canvas id="game" width="960" height="540"></canvas>
<div id="hud">loading...</div>
<script type="importmap">
  { "imports": { "three": "../node_modules/three/build/three.module.js" } }
</script>
<script type="module" src="./js/main.js"></script>
</body>
</html>
