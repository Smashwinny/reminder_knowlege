<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>拾光：技能分工方法实验</title><style>*{box-sizing:border-box}body{margin:0;background:#e9f8ff;color:#17375b;font:18px/1.6 system-ui;text-align:center}main{max-width:680px;margin:auto;padding:20px}canvas{display:block;width:100%;border-radius:20px;border:4px solid #0061e7;background:#07315c}button{padding:12px 18px;background:#ff9700;color:#102b48;border:0;border-radius:16px;font:inherit;margin:8px}button:focus-visible{outline:4px solid #0051ff}p{text-align:left}</style><main><h1>拾光 · 原创最小游戏</h1><p>左右箭头或按钮移动，碰到橙色圆点得分。暂停/继续可点按钮。为可重复实验采用手动推进，不是实时FPS演示。</p><canvas width="320" height="220" aria-label="蓝色玩家收集橙色光点"></canvas><div><button id="left">向左一步</button><button id="right">向右一步</button><button id="pause">暂停</button><button id="reset">重置</button></div><output id="hud" aria-live="polite"></output><p>坐标：左上原点，x向右，y向下；规则固定60 tick/模拟秒。测试钩子advanceTime与render_game_to_text用于自动验收。没有微信SDK、网络、模型调用或资产下载。</p></main><script src="core.js"></script><script>let state=Lab.create(),acc=0,dir=0,flash=0;const cv=document.querySelector('canvas'),ctx=cv.getContext('2d');function render(){ctx.fillStyle='#07315c';ctx.fillRect(0,0,320,220);ctx.fillStyle='#ff9700';ctx.beginPath();ctx.arc(state.coinX,state.coinY,10,0,7);ctx.fill();ctx.fillStyle=flash>0?'#ffffff':'#00dcff';ctx.fillRect(state.x-12,state.y-12,24,24);ctx.fillStyle='white';ctx.font='16px sans-serif';ctx.fillText('score: '+state.score+' | tick: '+state.tick+(state.paused?' | PAUSED':''),12,28);document.querySelector('#hud').textContent='得分 '+state.score+' / 模拟步 '+state.tick;}function update(){state=Lab.step(state,dir);if(state.events.length)flash=6;else flash=Math.max(0,flash-1);}window.advanceTime=ms=>{if(!Number.isFinite(ms)||ms<0||ms>60000)throw Error('invalid time');acc+=ms;while(acc+1e-9>=1000/60){acc-=1000/60;update();}render();};window.render_game_to_text=()=>JSON.stringify({...state,coordinate:'origin top-left; +x right; +y down',remainder_ms:Math.round(acc*1e6)/1e6,flash});window.lab={setDir:x=>dir=x,reset:()=>{state=Lab.create();acc=0;dir=0;flash=0;render();}};document.onkeydown=e=>{if(e.key==='ArrowRight'){e.preventDefault();dir=1;advanceTime(1000/60);}if(e.key==='ArrowLeft'){e.preventDefault();dir=-1;advanceTime(1000/60);}};document.onkeyup=()=>dir=0;document.querySelector('#right').onclick=()=>{dir=1;advanceTime(1000/60);dir=0;};document.querySelector('#left').onclick=()=>{dir=-1;advanceTime(1000/60);dir=0;};document.querySelector('#pause').onclick=()=>{state.paused=!state.paused;document.querySelector('#pause').textContent=state.paused?'继续':'暂停';render();};document.querySelector('#reset').onclick=()=>{lab.reset();document.querySelector('#pause').textContent='暂停';};render();</script></html>
